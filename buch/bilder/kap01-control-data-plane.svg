<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" role="img" aria-labelledby="kap01-control-data-plane-title kap01-control-data-plane-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap01-control-data-plane-title">Verwalten und Inhalt lesen als getrennte Rechte</title><desc id="kap01-control-data-plane-desc">Ein Key Vault und eine SharePoint-Site sind jeweils in eine Verwaltungsebene und eine Inhaltsebene geteilt. Die Admin-Identität erreicht beide Verwaltungsebenen, ihr Weg zum Inhalt ist blockiert. Die App-Identität erreicht nur den Inhalt.</desc><defs><marker id="d4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="16" y="16" width="234" height="324" rx="12" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><text x="133" y="38" text-anchor="middle" font-size="14" font-weight="700" style="fill:#2f5d8a;">Key Vault</text><rect x="30" y="50" width="206" height="122" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="133" y="74" text-anchor="middle" font-size="13" font-weight="700">Control Plane</text><text x="133" y="96" text-anchor="middle" font-size="11.5">anlegen, Netzwerkregeln, löschen</text><text x="133" y="115" text-anchor="middle" font-size="11.5">Ziel:</text><text x="133" y="134" text-anchor="middle" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">management.azure.com</text><line x1="30" y1="186" x2="236" y2="186" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="30" y="200" width="206" height="122" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="133" y="224" text-anchor="middle" font-size="13" font-weight="700">Data Plane</text><text x="133" y="246" text-anchor="middle" font-size="11.5">Secret lesen</text><text x="133" y="265" text-anchor="middle" font-size="11.5">Ziel:</text><text x="133" y="284" text-anchor="middle" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">&lt;name&gt;.vault.azure.net</text><rect x="430" y="16" width="234" height="324" rx="12" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><text x="547" y="38" text-anchor="middle" font-size="14" font-weight="700" style="fill:#2f5d8a;">SharePoint-Site</text><rect x="444" y="50" width="206" height="122" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="547" y="74" text-anchor="middle" font-size="13" font-weight="700">Verwaltung</text><text x="547" y="96" text-anchor="middle" font-size="11.5">Einstellungen, Speicherlimit</text><line x1="444" y1="186" x2="650" y2="186" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="444" y="200" width="206" height="122" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="547" y="224" text-anchor="middle" font-size="13" font-weight="700">Inhalt</text><text x="547" y="246" text-anchor="middle" font-size="11.5">Bibliothek, Dateien</text><text x="340" y="82" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:#2f5d8a;">Recht: verwalten</text><rect x="285" y="90" width="110" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="114.14" text-anchor="middle" font-size="11.5" font-weight="700">Admin-Identität</text><rect x="285" y="240" width="110" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="264.14" text-anchor="middle" font-size="11.5" font-weight="700">App-Identität</text><text x="340" y="298" text-anchor="middle" font-size="11.5" font-weight="600" style="fill:#2f5d8a;">Recht: Inhalt lesen</text><line x1="285" y1="110" x2="238" y2="110" stroke="#2f5d8a" stroke-width="2" marker-end="url(#d4a)"/><line x1="395" y1="110" x2="442" y2="110" stroke="#2f5d8a" stroke-width="2" marker-end="url(#d4a)"/><line x1="285" y1="260" x2="238" y2="260" stroke="#2f5d8a" stroke-width="2" marker-end="url(#d4a)"/><line x1="395" y1="260" x2="442" y2="260" stroke="#2f5d8a" stroke-width="2" marker-end="url(#d4a)"/><line x1="297" y1="130" x2="238" y2="228" stroke="#b8472a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#d4b)"/><line x1="383" y1="130" x2="442" y2="228" stroke="#b8472a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#d4b)"/><line x1="260.5" y1="172" x2="274.5" y2="186" stroke="#b8472a" stroke-width="3"/><line x1="260.5" y1="186" x2="274.5" y2="172" stroke="#b8472a" stroke-width="3"/><line x1="405.5" y1="172" x2="419.5" y2="186" stroke="#b8472a" stroke-width="3"/><line x1="405.5" y1="186" x2="419.5" y2="172" stroke="#b8472a" stroke-width="3"/><text x="340" y="176" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#b8472a;">blockiert:</text><text x="340" y="192" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#b8472a;">kein Inhaltsrecht</text><text x="16" y="362" text-anchor="start" class="legend-text">Blauer Pfeil: Recht vorhanden. Roter gestrichelter Pfeil mit Kreuz: blockiert. Gestrichelte Linie im Objekt: Grenze der beiden Ebenen.</text></svg>