<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 422" width="680" role="img" aria-labelledby="d1-t d1-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style>
<title id="d1-t">App-Registrierung und Service Principals in zwei Tenants</title>
<desc id="d1-d">Eine App-Registrierung im Heimat-Tenant und je ein davon abgeleiteter Service Principal im Heimat-Tenant und in einem Kunden-Tenant. Die App-Registrierung ist der einmalige Bauplan; wirksame Rechte hängen am Service Principal und gelten daher immer nur in dessen Tenant.</desc>
