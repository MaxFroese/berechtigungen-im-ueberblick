<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="d14-vk-title d14-vk-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d14-vk-title">Vertragskette und technischer Zugriff</title><desc id="d14-vk-desc">Links die Vertragskette: Firma mit Auftrag, AVV und Freigaben an den IT-Dienstleister, dieser mit Partnervertrag und CSP an Microsoft. Rechts der Tenant der Firma mit Entra ID, Microsoft 365 und Azure. Die Firma greift über ihr Break-Glass-Konto zu, der Dienstleister über GDAP mit befristeten Rollen, Microsoft betreibt den Tenant.</desc><defs><marker id="d14-vk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d14-vk-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d14-vk-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="30" y="30" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Vertrag</text><text x="380" y="30" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Technischer Zugriff</text><rect x="30" y="50" width="250" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="155.0" y="76" font-size="12.5" text-anchor="middle" font-weight="600">Firma</text><text x="155.0" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">entscheidet, verantwortet</text><rect x="30" y="160" width="250" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="155.0" y="186" font-size="12.5" text-anchor="middle" font-weight="600">IT-Dienstleister</text><text x="155.0" y="200" font-size="11" text-anchor="middle" style="fill:#5b6072">betreibt, rechnet ab</text><rect x="30" y="270" width="250" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="155.0" y="296" font-size="12.5" text-anchor="middle" font-weight="600">Microsoft</text><text x="155.0" y="310" font-size="11" text-anchor="middle" style="fill:#5b6072">betreibt die Dienste</text><path d="M155 106 L155 158" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d14-vk-a)"/><text x="163" y="137" font-size="11" text-anchor="start">Auftrag, AVV, Freigaben</text><path d="M155 216 L155 268" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d14-vk-a)"/><text x="163" y="247" font-size="11" text-anchor="start">Partnervertrag, CSP</text><rect x="380" y="50" width="280" height="276" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="520" y="72" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Tenant der Firma</text><rect x="400" y="88" width="240" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="520.0" y="106" font-size="12.5" text-anchor="middle" font-weight="600">Entra ID</text><text x="520.0" y="120" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen, Konten, Consent</text><rect x="400" y="140" width="240" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="520.0" y="158" font-size="12.5" text-anchor="middle" font-weight="600">Microsoft 365</text><text x="520.0" y="172" font-size="11" text-anchor="middle" style="fill:#5b6072">SharePoint, Teams, Exchange</text><rect x="400" y="192" width="240" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="520.0" y="210" font-size="12.5" text-anchor="middle" font-weight="600">Azure</text><text x="520.0" y="224" font-size="11" text-anchor="middle" style="fill:#5b6072">Subscriptions, Ressourcen</text><text x="520" y="258" font-size="11" text-anchor="middle" style="fill:#5b6072">Audit-Log und Sign-in-Log</text><text x="520" y="272" font-size="11" text-anchor="middle" style="fill:#5b6072">zeigen auch Zugriffe des Partners</text><path d="M280 78 L378 78" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d14-vk-r)"/><text x="329" y="58" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Break-Glass-</text><text x="329" y="71" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Konto</text><path d="M280 188 L378 188" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d14-vk-a)"/><text x="329" y="180" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">GDAP</text><text x="329" y="204" font-size="10.5" text-anchor="middle" style="fill:#5b6072">befristete</text><text x="329" y="217" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Rollen</text><path d="M280 298 L378 298" fill="none" stroke="#5b6072" stroke-width="1.5" marker-end="url(#d14-vk-m)"/><text x="329" y="290" font-size="11" text-anchor="middle" style="fill:#5b6072">betreibt</text><rect x="20" y="346" width="640" height="44" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340.0" y="372" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Vertrag läuft über den Dienstleister, der Zugriff direkt in den Tenant der Firma.</text></svg>