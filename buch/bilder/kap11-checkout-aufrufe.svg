<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 586" role="img" aria-labelledby="d11-co-title d11-co-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d11-co-title">Checkout-Aufrufe an die Commerce-API</title><desc id="d11-co-desc">Der Checkout im Browser ruft nacheinander createCart, previewagreement, getEligiblePaymentMethods und updateBillingInformation auf. Die Antworten auf createCart und updateBillingInformation enthalten isAuthorizedToSign: false. Am Ende bleibt der Knopf „Next“ gesperrt, weil die Vereinbarung nicht unterschrieben werden kann.</desc><defs><marker id="d11-co-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d11-co-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d11-co-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><line x1="140" y1="88" x2="140" y2="470" stroke="#5b6072" stroke-width="1"/><line x1="540" y1="88" x2="540" y2="470" stroke="#5b6072" stroke-width="1"/><circle cx="140" cy="44" r="43" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="140" y="41" font-size="12" text-anchor="middle" font-weight="600">Browser</text><text x="140" y="56" font-size="11.5" text-anchor="middle" style="fill:#5b6072">(Checkout)</text><circle cx="540" cy="44" r="43" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="540" y="41" font-size="12" text-anchor="middle" font-weight="600">Commerce-</text><text x="540" y="56" font-size="12" text-anchor="middle" font-weight="600">API</text><path d="M140 120 L538 120" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-co-a)"/><text x="340.0" y="113" font-size="11.5" text-anchor="middle" style="paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">createCart: Warenkorb mit Produkt und Platzzahl</text><path d="M540 152 L142 152" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d11-co-l)"/><text x="340.0" y="144" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">Antwort: isAuthorizedToSign: false</text><path d="M140 204 L538 204" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-co-a)"/><text x="340.0" y="197" font-size="11.5" text-anchor="middle" style="paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">previewagreement: Vereinbarung laden</text><path d="M540 236 L142 236" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d11-co-m)"/><text x="340.0" y="229" font-size="11.5" text-anchor="middle" style="fill:#5b6072;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">Antwort: Vereinbarung</text><path d="M140 288 L538 288" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-co-a)"/><text x="340.0" y="281" font-size="11.5" text-anchor="middle" style="paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">getEligiblePaymentMethods: erlaubte Zahlungsmittel</text><path d="M540 320 L142 320" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d11-co-m)"/><text x="340.0" y="313" font-size="11.5" text-anchor="middle" style="fill:#5b6072;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">Antwort: Zahlungsmittel</text><path d="M140 372 L538 372" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-co-a)"/><text x="340.0" y="365" font-size="11.5" text-anchor="middle" style="paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">updateBillingInformation: Rechnungsprofil anhängen</text><path d="M540 404 L142 404" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d11-co-l)"/><text x="340.0" y="396" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">Antwort: isAuthorizedToSign: false</text><rect x="60" y="430" width="160" height="36" rx="6" fill="#eef1f5" stroke="#5b6072" stroke-width="1.5"/><text x="140" y="453" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#5b6072">„Next“ gesperrt</text><text x="236" y="446" font-size="11.5" text-anchor="start" style="fill:#b8472a">Vereinbarung kann nicht unterschrieben werden,</text><text x="236" y="461" font-size="11.5" text-anchor="start" style="fill:#b8472a">keine Fehlermeldung</text><rect x="20" y="492" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="513" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Checkout prüft das Unterschriftsrecht des Kontos auf dem Rechnungskonto.</text><text x="340" y="531" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Fehlt es, sperrt er den Kauf stillschweigend.</text><line x1="20" y1="570" x2="58" y2="570" stroke="#2f5d8a" stroke-width="1.5"/><text x="66" y="574" font-size="11" text-anchor="start" style="fill:#5b6072">Aufruf</text><line x1="130" y1="570" x2="168" y2="570" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="176" y="574" font-size="11" text-anchor="start" style="fill:#5b6072">Antwort</text><line x1="250" y1="570" x2="288" y2="570" stroke="#b8472a" stroke-width="2.5"/><text x="296" y="574" font-size="11" text-anchor="start" style="fill:#5b6072">Antwort ohne Unterschriftsrecht</text></svg>