<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="d18-ww-title d18-ww-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d18-ww-title">Was wandert und was bleibt</title><desc id="d18-ww-desc">Links ein Solution-Paket mit Apps, Flows, Tabellendefinitionen, Agenten, Definitionen der Umgebungsvariablen und Verbindungsreferenzen. In der Mitte die Zuordnung über eine Einstellungsdatei oder den Import-Dialog. Rechts Test und Produktion mit eigenen Verbindungen, Werten, Key Vaults und Daten.</desc><defs><marker id="d18-ww-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d18-ww-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d18-ww-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="40" width="220" height="262" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="120" y="30" font-size="12" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">wandert</text><text x="120" y="62" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Solution-Paket</text><rect x="22" y="76" width="196" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="120.0" y="98" font-size="12.5" text-anchor="middle" font-weight="600">Apps und Flows</text><rect x="22" y="120" width="196" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="120.0" y="142" font-size="12.5" text-anchor="middle" font-weight="600">Tabellendefinitionen</text><rect x="22" y="164" width="196" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="120.0" y="186" font-size="12.5" text-anchor="middle" font-weight="600">Agenten</text><rect x="22" y="208" width="196" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="120.0" y="230" font-size="12.5" text-anchor="middle" font-weight="600">Variablen (Definition)</text><rect x="22" y="252" width="196" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="120.0" y="274" font-size="12.5" text-anchor="middle" font-weight="600">Verbindungsreferenzen</text><rect x="255" y="136" width="150" height="76" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="330.0" y="164" font-size="12.5" text-anchor="middle" font-weight="600">Zuordnung</text><text x="330.0" y="180" font-size="11" text-anchor="middle" style="fill:#5b6072">Einstellungsdatei</text><text x="330.0" y="194" font-size="11" text-anchor="middle" style="fill:#5b6072">oder Import-Dialog</text><path d="M230 174 L253 174" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ww-a)"/><path d="M405 160 L428 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ww-a)"/><path d="M405 190 L428 240" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ww-a)"/><text x="550" y="30" font-size="12" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">bleibt in der Umgebung</text><rect x="430" y="40" width="240" height="122" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="550" y="62" font-size="12.5" text-anchor="middle" font-weight="600">Test</text><text x="550" y="84" font-size="11" text-anchor="middle" style="fill:#5b6072">Verbindungen von Test</text><text x="550" y="102" font-size="11" text-anchor="middle" style="fill:#5b6072">Werte der Variablen</text><text x="550" y="120" font-size="11" text-anchor="middle" style="fill:#5b6072">Key Vault von Test</text><text x="550" y="138" font-size="11" text-anchor="middle" style="fill:#5b6072">Testdaten</text><rect x="430" y="180" width="240" height="122" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="550" y="202" font-size="12.5" text-anchor="middle" font-weight="600">Produktion</text><text x="550" y="224" font-size="11" text-anchor="middle" style="fill:#5b6072">Verbindungen eines Service-Kontos</text><text x="550" y="242" font-size="11" text-anchor="middle" style="fill:#5b6072">eigene Werte</text><text x="550" y="260" font-size="11" text-anchor="middle" style="fill:#5b6072">eigener Key Vault</text><text x="550" y="278" font-size="11" text-anchor="middle" style="fill:#5b6072">echte Daten</text><text x="340" y="335" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Das Paket ist umgebungsneutral; zugeordnet wird erst beim Import.</text></svg>