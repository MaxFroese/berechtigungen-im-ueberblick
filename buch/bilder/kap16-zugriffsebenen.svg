<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="d16-ze-title d16-ze-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d16-ze-title">Zugriffsebenen auf dem Baum der Business Units</title><desc id="d16-ze-desc">Ein Baum aus Root, Abteilung A mit Unterabteilung A1 und Abteilung B. Für Person P in Abteilung A umfasst User nur ihre eigenen Zeilen, Business Unit die Abteilung A, Parent: Child Abteilung A und A1, Organization den ganzen Baum.</desc><defs><marker id="d16-ze-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d16-ze-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d16-ze-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="10" width="660" height="350" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="24" y="32" font-size="12" text-anchor="start" font-weight="600" style="fill:#5b6072">Organization: der ganze Baum</text><path d="M340 80 L270 180" fill="none" stroke="#5b6072" stroke-width="1.5"/><path d="M340 80 L550 150" fill="none" stroke="#5b6072" stroke-width="1.5"/><path d="M270 230 L270 268" fill="none" stroke="#5b6072" stroke-width="1.5"/><rect x="280" y="40" width="120" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="64" font-size="12.5" text-anchor="middle" font-weight="600">Root</text><rect x="480" y="150" width="140" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="550.0" y="180" font-size="12.5" text-anchor="middle" font-weight="600">Abteilung B</text><rect x="60" y="118" width="320" height="222" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="72" y="136" font-size="11" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Parent: Child Business Units</text><rect x="80" y="148" width="280" height="94" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="92" y="166" font-size="11" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Business Unit</text><rect x="200" y="180" width="140" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="270.0" y="202" font-size="12.5" text-anchor="middle" font-weight="600">Abteilung A</text><text x="270.0" y="218" font-size="11" text-anchor="middle" style="fill:#5b6072">Person P</text><rect x="92" y="178" width="96" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="140.0" y="202" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">User</text><text x="140.0" y="216" font-size="11" text-anchor="middle" style="fill:#5b6072">Zeilen von P</text><rect x="200" y="270" width="140" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="270.0" y="300" font-size="12.5" text-anchor="middle" font-weight="600">Unterabteilung A1</text><text x="550" y="240" font-size="11" text-anchor="middle" style="fill:#5b6072">Dieselbe Rolle wirkt für</text><text x="550" y="254" font-size="11" text-anchor="middle" style="fill:#5b6072">eine Person in B anders.</text></svg>