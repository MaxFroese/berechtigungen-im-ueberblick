<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="kap01-azure-hierarchie-title kap01-azure-hierarchie-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap01-azure-hierarchie-title">Azure-Hierarchie und Microsoft 365 im selben Tenant</title><desc id="kap01-azure-hierarchie-desc">Vom Tenant führt ein Baum über die Subscriptions dev und prod und ihre Resource Groups zu Ressourcen wie App Service und Key Vault; links stehen die passenden Abschnitte der Resource-ID. Microsoft 365 mit SharePoint und Exchange Online hängt direkt am Tenant und ist nicht Teil dieser Hierarchie.</desc><text x="16" y="32" text-anchor="start" font-size="12" font-weight="700" style="fill:#2f5d8a;">Resource-ID</text><text x="16" y="48" text-anchor="start" font-size="10.5" style="fill:#5b6072;">Tenant taucht nicht auf</text><text x="16" y="117" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">/subscriptions/</text><text x="16" y="131" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">&lt;subscription-id&gt;</text><line x1="178" y1="120" x2="193" y2="120" stroke="#5b6072" stroke-width="1"/><text x="16" y="201" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">/resourceGroups/</text><text x="16" y="215" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">meine-rg</text><line x1="178" y1="204" x2="193" y2="204" stroke="#5b6072" stroke-width="1"/><text x="16" y="285" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;fill:#2f5d8a;">/providers/Microsoft.Web/</text><text x="16" y="299" text-anchor="start" font-size="10.5" style="font-family:ui-monospace,Menlo,Consolas,monospace;