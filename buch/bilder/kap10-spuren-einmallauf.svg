<svg viewBox="0 0 680 580" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap10-spuren-einmallauf-t kap10-spuren-einmallauf-d" id="kap10-spuren-einmallauf" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap10-spuren-einmallauf-t">Spuren eines einmaligen Auswertungslaufs</title><desc id="kap10-spuren-einmallauf-d">Der Datenweg läuft von der SharePoint-Site als ausgewählte Kopie in den Arbeitsordner auf dem Laptop, von dort zum KI-Agenten als lokalem Prozess und als Prompt zum KI-Anbieter, im Beispiel Claude Code mit standardmäßig 30 Tagen Aufbewahrung im Business-Tarif. Der KI-Agent hinterlässt lokale Session-Transkripte im Klartext und eine Ergebnisdatei. Ein optionaler Feedback-Befehl mit 5 Jahren Aufbewahrung ist als zu sperren markiert. Hervorgehoben ist die mögliche Weiterverwendung des Ergebnisses in einem neuen Kundenprojekt, denn auch das Ergebnis kann noch Kundeninformationen tragen.</desc><defs><marker id="kap10-spuren-einmallauf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap10-spuren-einmallauf-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap10-spuren-einmallauf-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="340" y="26" font-size="13" font-weight="600" text-anchor="middle" style="fill:#b8472a">Der Prozess endet, die Inhalte bleiben</text><rect x="140" y="50" width="340" height="362" rx="10" fill="#ffffff" stroke="#5b6072" stroke-width="1"/><text x="152" y="70" font-size="12" font-weight="600" style="fill:#5b6072">Laptop</text><line x1="118" y1="150" x2="171" y2="150" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><line x1="277" y1="150" x2="352" y2="150" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><text x="315" y="142" font-size="12" text-anchor="middle" style="fill:#5b6072">liest</text><line x1="466" y1="150" x2="540" y2="150" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><text x="510" y="142" font-size="12" text-anchor="middle" style="fill:#5b6072">Prompt</text><line x1="370" y1="189" x2="264" y2="292" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><text x="305" y="228" font-size="12" text-anchor="end" style="fill:#5b6072">protokolliert</text><line x1="410" y1="206" x2="410" y2="276" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><text x="420" y="245" font-size="12" style="fill:#5b6072">schreibt</text><line x1="451" y1="188" x2="562" y2="288" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#kap10-spuren-einmallauf-h)"/><text x="504" y="226" font-size="12" style="fill:#5b6072">optional</text><line x1="608" y1="268" x2="608" y2="218" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#kap10-spuren-einmallauf-h)"/><text x="618" y="247" font-size="11" style="fill:#5b6072">Transkript</text><line x1="410" y1="382" x2="410" y2="452" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-h)"/><text x="420" y="438" font-size="12" style="fill:#5b6072">möglich</text><circle cx="68" cy="150" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="68" y="137" font-size="12" font-weight="600" text-anchor="middle">SharePoint-</text><text x="68" y="153" font-size="12" font-weight="600" text-anchor="middle">Site</text><text x="68" y="171" font-size="11" text-anchor="middle" style="fill:#5b6072">Quelle</text><rect x="95" y="110" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><circle cx="225" cy="150" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="225" y="137" font-size="12" font-weight="600" text-anchor="middle">Arbeitsordner</text><text x="225" y="155" font-size="11" text-anchor="middle">ausgewählte</text><text x="225" y="170" font-size="11" text-anchor="middle">Kopie</text><rect x="254" y="108" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><circle cx="410" cy="150" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="410" y="136" font-size="13" font-weight="600" text-anchor="middle">KI-Agent</text><text x="410" y="155" font-size="11" text-anchor="middle">lokaler</text><text x="410" y="170" font-size="11" text-anchor="middle">Prozess</text><circle cx="608" cy="150" r="66" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="608" y="114" font-size="13" font-weight="600" text-anchor="middle">KI-Anbieter</text><text x="608" y="132" font-size="11" text-anchor="middle">Aufbewahrung</text><text x="608" y="150" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Beispiel Claude Code:</text><text x="608" y="166" font-size="11" text-anchor="middle">Business-Tarif</text><text x="608" y="182" font-size="11" text-anchor="middle">standardmäßig</text><text x="608" y="198" font-size="11" font-weight="600" text-anchor="middle">30 Tage</text><rect x="646" y="99" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><circle cx="225" cy="330" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="225" y="318" font-size="12" font-weight="600" text-anchor="middle">Session-</text><text x="225" y="334" font-size="12" font-weight="600" text-anchor="middle">Transkripte</text><text x="225" y="351" font-size="11" text-anchor="middle">im Klartext</text><rect x="254" y="288" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><text x="225" y="398" font-size="11" text-anchor="middle" style="fill:#5b6072">Beispiel Claude Code</text><circle cx="410" cy="330" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="410" y="326" font-size="12" font-weight="600" text-anchor="middle">Ergebnisdatei</text><rect x="439" y="288" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><circle cx="608" cy="330" r="62" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="608" y="304" font-size="11.5" font-weight="600" text-anchor="middle">Feedback-Befehl</text><text x="608" y="321" font-size="11" text-anchor="middle">optional</text><text x="608" y="338" font-size="11" font-weight="600" text-anchor="middle">5 Jahre</text><text x="608" y="355" font-size="11" text-anchor="middle">Aufbewahrung</text><rect x="643" y="282" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><text x="608" y="410" font-size="12" font-weight="600" text-anchor="middle" style="fill:#b8472a">Zu sperren</text><text x="608" y="426" font-size="11" text-anchor="middle" style="fill:#5b6072">Beispiel Claude Code</text><circle cx="410" cy="512" r="58" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="410" y="500" font-size="11" font-weight="600" text-anchor="middle">Weiterverwendung</text><text x="410" y="517" font-size="11" text-anchor="middle">in neuem</text><text x="410" y="532" font-size="11" text-anchor="middle">Kundenprojekt</text><rect x="443" y="466" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><text x="480" y="505" font-size="12" font-weight="600" style="fill:#b8472a">Auch das Ergebnis kann noch</text><text x="480" y="521" font-size="12" font-weight="600" style="fill:#b8472a">Kundeninformationen tragen</text><rect x="20" y="495" width="16" height="10" rx="2" fill="#b8472a" stroke="#b8472a" stroke-width="1"/><text x="44" y="504" class="legend-text">Ort, an dem nach dem Lauf</text><text x="44" y="518" class="legend-text">Inhalte liegen können</text><line x1="20" y1="538" x2="50" y2="538" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-spuren-einmallauf-a)"/><text x="58" y="542" class="legend-text">Datenweg des Laufs</text><line x1="20" y1="558" x2="50" y2="558" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#kap10-spuren-einmallauf-h)"/><text x="58" y="562" class="legend-text">Optionaler Weg, zu sperren</text></svg>