<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 385" role="img" aria-labelledby="kap01-physische-orte-title kap01-physische-orte-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap01-physische-orte-title">Vier physische Orte und ein Zugriff über Identität und Recht</title><desc id="kap01-physische-orte-desc">Vier getrennte Blöcke: von Microsoft betriebene Rechenzentren mit Entra ID und Microsoft-365-Diensten, selbst belegte Rechenzentren mit App Service und Key Vault, der Laptop und der GitHub-Runner. Ein Pfeil vom Runner zu einer Azure-Ressource ist mit Identität und zugewiesenem Recht beschriftet.</desc><defs><marker id="d3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="16" y="16" width="314" height="154" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="173" y="40" text-anchor="middle" font-size="13" font-weight="700">Microsoft-Rechenzentren,</text><text x="173" y="58" text-anchor="middle" font-size="13" font-weight="700">von Microsoft betrieben</text><rect x="30" y="85" width="135" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="97.5" y="109.14" text-anchor="middle" font-size="11.5">Entra ID</text><rect x="180" y="85" width="135" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="247.5" y="108.96" text-anchor="middle" font-size="11">Microsoft-365-Dienste</text><rect x="350" y="16" width="314" height="154" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="507" y="40" text-anchor="middle" font-size="13" font-weight="700">Microsoft-Rechenzentren,</text><text x="507" y="58" text-anchor="middle" font-size="13" font-weight="700">selbst belegt</text><rect x="370" y="85" width="120" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="430.0" y="109.14" text-anchor="middle" font-size="11.5">App Service</text><rect x="525" y="85" width="120" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="585.0" y="109.14" text-anchor="middle" font-size="11.5">Key Vault</text><text x="445" y="152" text-anchor="start" font-size="11" style="fill:#5b6072;">selber Ort allein gibt kein Recht</text><rect x="16" y="235" width="314" height="110" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="173" y="260" text-anchor="middle" font-size="13" font-weight="700">Laptop</text><rect x="28" y="282" width="90" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="73.0" y="305.96" text-anchor="middle" font-size="11">Browser</text><rect x="124" y="282" width="90" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="169.0" y="305.78" text-anchor="middle" font-size="10.5">Kommandozeile</text><rect x="220" y="282" width="90" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="265.0" y="305.96" text-anchor="middle" font-size="11">lokale Kopien</text><rect x="350" y="235" width="314" height="110" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="507" y="260" text-anchor="middle" font-size="13" font-weight="700">GitHub-Runner</text><rect x="370" y="282" width="120" height="40" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="430.0" y="306.14" text-anchor="middle" font-size="11.5">Workflow</text><text x="505" y="298" text-anchor="start" font-size="11" style="fill:#5b6072;">kurzlebige Maschine,</text><text x="505" y="314" text-anchor="start" font-size="11" style="fill:#5b6072;">außerhalb des Tenants</text><line x1="430" y1="282" x2="430" y2="127" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d3a)"/><text x="442" y="208" text-anchor="start" font-size="13" font-weight="700" style="fill:#b8472a;">Identität und zugewiesenes Recht</text><text x="16" y="372" text-anchor="start" class="legend-text">Blöcke: physische Orte. Roter Pfeil: Zugriff entsteht über Identität und Recht, nicht über den Standort.</text></svg>