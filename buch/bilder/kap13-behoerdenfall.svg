<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 545" role="img" aria-labelledby="d13-bf-title d13-bf-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d13-bf-title">Prüfschritte im Behördenfall</title><desc id="d13-bf-desc">Acht Schritte untereinander: Daten sichten, Rolle klären, Ort wählen, Kette prüfen, Standort einstellen, Daten begrenzen, Freigaben einholen und zuletzt Lauf und Löschung. Erst im letzten Schritt fließen echte Daten.</desc><defs><marker id="d13-bf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d13-bf-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="60" y="14" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="36" font-size="12.5" text-anchor="start" font-weight="600">Daten sichten</text><text x="74" y="54" font-size="11" text-anchor="start" style="fill:#5b6072">Personenbezug ja; besondere Kategorien in Beschwerden möglich</text><circle cx="34" cy="40" r="15" fill="#2f5d8a"/><text x="34" y="45" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">1</text><path d="M34 55 L34 89" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="80" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="102" font-size="12.5" text-anchor="start" font-weight="600">Rolle klären</text><text x="74" y="120" font-size="11" text-anchor="start" style="fill:#5b6072">Beratung als Auftragsverarbeiter; Landesdatenschutzgesetz gilt</text><circle cx="34" cy="106" r="15" fill="#2f5d8a"/><text x="34" y="111" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">2</text><path d="M34 121 L34 155" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="146" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="168" font-size="12.5" text-anchor="start" font-weight="600">Ort wählen</text><text x="74" y="186" font-size="11" text-anchor="start" style="fill:#5b6072">Arbeit im Tenant des Landesamts</text><circle cx="34" cy="172" r="15" fill="#2f5d8a"/><text x="34" y="177" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">3</text><path d="M34 187 L34 221" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="212" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="234" font-size="12.5" text-anchor="start" font-weight="600">Kette prüfen</text><text x="74" y="252" font-size="11" text-anchor="start" style="fill:#5b6072">Vertrag des Landesamts mit Microsoft; kein Modellanbieter außerhalb der Kette</text><circle cx="34" cy="238" r="15" fill="#2f5d8a"/><text x="34" y="243" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">4</text><path d="M34 253 L34 287" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="278" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="300" font-size="12.5" text-anchor="start" font-weight="600">Standort einstellen</text><text x="74" y="318" font-size="11" text-anchor="start" style="fill:#5b6072">Flex Routing, Anthropic-Einstellungen, „Move data across regions“ geprüft</text><circle cx="34" cy="304" r="15" fill="#2f5d8a"/><text x="34" y="309" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">5</text><path d="M34 319 L34 353" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="344" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="366" font-size="12.5" text-anchor="start" font-weight="600">Daten begrenzen</text><text x="74" y="384" font-size="11" text-anchor="start" style="fill:#5b6072">Sites.Selected; Beschwerden ausfiltern oder pseudonymisieren</text><circle cx="34" cy="370" r="15" fill="#2f5d8a"/><text x="34" y="375" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">6</text><path d="M34 385 L34 419" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="410" width="610" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="74" y="432" font-size="12.5" text-anchor="start" font-weight="600">Freigaben einholen</text><text x="74" y="450" font-size="11" text-anchor="start" style="fill:#5b6072">DSFA prüfen, Personalrat beteiligen, schriftlich festhalten</text><circle cx="34" cy="436" r="15" fill="#2f5d8a"/><text x="34" y="441" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">7</text><path d="M34 451 L34 485" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-bf-a)"/><rect x="60" y="476" width="610" height="52" rx="4" fill="#d9e4ef" stroke="#b8472a" stroke-width="1.5"/><text x="74" y="498" font-size="12.5" text-anchor="start" font-weight="600">Lauf und Löschung</text><text x="74" y="516" font-size="11" text-anchor="start" style="fill:#5b6072">Ergebnis von Menschen prüfen; Kopien und Indizes löschen; dokumentieren</text><circle cx="34" cy="502" r="15" fill="#b8472a"/><text x="34" y="507" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">8</text><text x="656" y="498" font-size="11.5" text-anchor="end" font-weight="600" style="fill:#b8472a">erst hier fließen echte Daten</text></svg>