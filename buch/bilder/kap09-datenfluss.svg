<svg viewBox="0 0 680 500" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap09-datenfluss-t kap09-datenfluss-d" id="kap09-datenfluss" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap09-datenfluss-t">Lokal, Cloud-Sitzung und Foundry im Vergleich</title><desc id="kap09-datenfluss-d">Drei Varianten nebeneinander. Lokal laufen Befehle auf dem Laptop, Prompts und Dateiinhalte gehen zum Modell beim Anbieter, und ein Transkript liegt im Klartext. In der Cloud-Sitzung von Claude Code laufen Befehle in einer VM beim Anbieter, GitHub wird über einen Proxy mit außerhalb liegenden Zugangsdaten erreicht. Bei Foundry läuft der KI-Agent weiter auf dem Laptop. Bei Hosted on Azure bleiben Prompts in Azure, und nur Metadaten und markierte Inhalte gehen weiter zum Anbieter. Bei Hosted on Anthropic läuft die Anfrage über den Anbieter.</desc><defs><marker id="kap09-datenfluss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap09-datenfluss-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap09-datenfluss-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="127" y="24" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Lokal</text><text x="127" y="42" font-size="11" text-anchor="middle" style="fill:#5b6072">mit Anbieter-Modell</text><text x="342" y="24" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Cloud-Sitzung</text><text x="342" y="42" font-size="11" text-anchor="middle" style="fill:#5b6072">Claude Code</text><text x="565" y="24" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Lokal über Foundry</text><text x="565" y="42" font-size="11" text-anchor="middle" style="fill:#5b6072">Modell über Microsoft Foundry</text><text x="16" y="171" font-size="12" text-anchor="middle" font-weight="600" transform="rotate(-90 16 171)" style="fill:#2f5d8a">Wo Befehle laufen</text><text x="16" y="355" font-size="12" text-anchor="middle" font-weight="600" transform="rotate(-90 16 355)" style="fill:#2f5d8a">Wo das Modell läuft</text><line x1="26" y1="298" x2="668" y2="298" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="30" y="56" width="195" height="204" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><text x="127" y="76" font-size="12" text-anchor="middle" font-weight="600">Laptop</text><text x="127" y="92" font-size="11" text-anchor="middle" style="fill:#5b6072">Betriebssystem-Konto</text><circle cx="77" cy="165" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="77" y="169.2" font-size="12" text-anchor="middle">KI-Agent</text><rect x="135" y="146" width="83" height="38" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="176.5" y="161.8" font-size="11" text-anchor="middle">Transkript</text><text x="176.5" y="175.8" font-size="11" text-anchor="middle">im Klartext</text><line x1="113" y1="165" x2="134" y2="165" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><circle cx="77" cy="345" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="77" y="334.2" font-size="12" text-anchor="middle">Modell</text><text x="77" y="349.2" font-size="12" text-anchor="middle">beim</text><text x="77" y="364.2" font-size="12" text-anchor="middle">Anbieter</text><line x1="77.0" y1="201.0" x2="77.0" y2="308.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><text x="85" y="275" font-size="11" text-anchor="start">Prompts,</text><text x="85" y="289" font-size="11" text-anchor="start">Dateiinhalte</text><text x="122" y="331" font-size="11" text-anchor="start" style="fill:#5b6072">sofern nicht</text><text x="122" y="345" font-size="11" text-anchor="start" style="fill:#5b6072">anders</text><text x="122" y="359" font-size="11" text-anchor="start" style="fill:#5b6072">konfiguriert</text><rect x="245" y="56" width="100" height="204" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><text x="295" y="76" font-size="12" text-anchor="middle" font-weight="600">VM beim</text><text x="295" y="92" font-size="12" text-anchor="middle" font-weight="600">Anbieter</text><circle cx="295" cy="165" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="295" y="169.2" font-size="12" text-anchor="middle">KI-Agent</text><text x="400" y="110" font-size="11" text-anchor="middle" style="fill:#5b6072">außerhalb der VM</text><rect x="360" y="120" width="80" height="52" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="400.0" y="135.8" font-size="11" text-anchor="middle">Proxy hängt</text><text x="400.0" y="149.8" font-size="11" text-anchor="middle">Zugangs-</text><text x="400.0" y="163.8" font-size="11" text-anchor="middle">daten an</text><line x1="326" y1="146" x2="359" y2="146" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><circle cx="400" cy="228" r="30" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="400" y="231.8" font-size="11" text-anchor="middle">GitHub</text><line x1="400" y1="172" x2="400" y2="197" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><circle cx="295" cy="345" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="295" y="334.2" font-size="12" text-anchor="middle">Modell</text><text x="295" y="349.2" font-size="12" text-anchor="middle">beim</text><text x="295" y="364.2" font-size="12" text-anchor="middle">Anbieter</text><line x1="295.0" y1="201.0" x2="295.0" y2="308.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><text x="303" y="275" font-size="11" text-anchor="start">Prompts,</text><text x="303" y="289" font-size="11" text-anchor="start">Dateiinhalte</text><text x="340" y="331" font-size="11" text-anchor="start" style="fill:#5b6072">sofern nicht</text><text x="340" y="345" font-size="11" text-anchor="start" style="fill:#5b6072">anders</text><text x="340" y="359" font-size="11" text-anchor="start" style="fill:#5b6072">konfiguriert</text><rect x="465" y="56" width="200" height="204" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><text x="565" y="76" font-size="12" text-anchor="middle" font-weight="600">Laptop</text><text x="565" y="92" font-size="11" text-anchor="middle" style="fill:#5b6072">Betriebssystem-Konto</text><circle cx="565" cy="160" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="565" y="164.2" font-size="12" text-anchor="middle">KI-Agent</text><text x="608" y="156" font-size="11" text-anchor="start" style="fill:#5b6072">Rechte</text><text x="608" y="170" font-size="11" text-anchor="start" style="fill:#5b6072">wie lokal</text><circle cx="513" cy="345" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="513" y="341.7" font-size="12" text-anchor="middle">Modell</text><text x="513" y="356.7" font-size="12" text-anchor="middle">in Azure</text><circle cx="621" cy="345" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="621" y="349.2" font-size="12" text-anchor="middle">Anbieter</text><line x1="555.3" y1="194.7" x2="523.0" y2="309.4" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><line x1="575.4" y1="194.5" x2="610.3" y2="309.6" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-datenfluss-a)"/><line x1="549" y1="345" x2="584" y2="345" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#kap09-datenfluss-m)"/><text x="521" y="275" font-size="11" text-anchor="end">Hosted on</text><text x="521" y="289" font-size="11" text-anchor="end">Azure</text><text x="607" y="275" font-size="11" text-anchor="start">Hosted on</text><text x="607" y="289" font-size="11" text-anchor="start">Anthropic</text><text x="567" y="397" font-size="11" text-anchor="middle" style="fill:#5b6072">Hosted on Azure: nur Metadaten</text><text x="567" y="411" font-size="11" text-anchor="middle" style="fill:#5b6072">und markierte Inhalte</text><rect x="30" y="430" width="195" height="50" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="127.5" y="451.9" font-size="11" text-anchor="middle" font-weight="600">Ausgangslage</text><text x="127.5" y="465.9" font-size="11" text-anchor="middle">Rechte des lokalen Kontos</text><rect x="245" y="430" width="195" height="50" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="342.5" y="451.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Verschiebt auch die Ausführung</text><text x="342.5" y="465.9" font-size="11" text-anchor="middle">gelöst vom lokalen Konto</text><rect x="465" y="430" width="200" height="50" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="565.0" y="451.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Verschiebt nur den Datenweg</text><text x="565.0" y="465.9" font-size="11" text-anchor="middle">Ausführung bleibt lokal</text></svg>