<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="d13-zv-title d13-zv-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d13-zv-title">Zwei Varianten der Kette</title><desc id="d13-zv-desc">Links arbeitet die Beratung im Tenant der Behörde: Die Behörde hat Vertrag und DPA direkt mit Microsoft, die Beratung ist über einen AVV angebunden und greift im Tenant der Behörde zu. Rechts verarbeitet die Beratung die Daten im eigenen Tenant: Behörde, AVV, Beratung als Kundin von Microsoft, Vertrag und DPA, Microsoft als Unterauftragsverarbeiter und dessen Unterauftragsverarbeiter; Genehmigung und Änderungen laufen über die Beratung.</desc><defs><marker id="d13-zv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d13-zv-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="10" y="10" width="320" height="380" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="34" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">A: im Tenant der Behörde</text><rect x="30" y="56" width="170" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="78" font-size="12.5" text-anchor="middle" font-weight="600">Behörde</text><text x="115.0" y="92" font-size="11" text-anchor="middle" style="fill:#5b6072">Verantwortliche</text><rect x="30" y="290" width="170" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="312" font-size="12.5" text-anchor="middle" font-weight="600">Microsoft</text><text x="115.0" y="326" font-size="11" text-anchor="middle" style="fill:#5b6072">Auftragsverarbeiter</text><path d="M115 106 L115 288" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-zv-a)"/><text x="123" y="200" font-size="11" text-anchor="start">Vertrag + DPA</text><rect x="215" y="150" width="105" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="267.5" y="169" font-size="12.5" text-anchor="middle" font-weight="600">Beratung</text><text x="267.5" y="184" font-size="11" text-anchor="middle" style="fill:#5b6072">Auftrags-</text><text x="267.5" y="199" font-size="11" text-anchor="middle" style="fill:#5b6072">verarbeiter</text><path d="M267 150 L267 81 L202 81" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-zv-a)"/><text x="274" y="120" font-size="11" text-anchor="start">AVV</text><path d="M267 210 L267 315 L202 315" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d13-zv-a)"/><text x="260" y="248" font-size="11" text-anchor="end" style="fill:#5b6072">Zugriff im</text><text x="260" y="262" font-size="11" text-anchor="end" style="fill:#5b6072">Tenant der</text><text x="260" y="276" font-size="11" text-anchor="end" style="fill:#5b6072">Behörde</text><text x="170" y="368" font-size="11" text-anchor="middle" style="fill:#5b6072">Die Kette zu Microsoft prüft die Behörde selbst.</text><rect x="350" y="10" width="320" height="380" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="364" y="34" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">B: im eigenen Tenant der Beratung</text><rect x="380" y="52" width="260" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="70" font-size="12.5" text-anchor="middle" font-weight="600">Behörde</text><text x="510.0" y="86" font-size="11" text-anchor="middle" style="fill:#5b6072">Verantwortliche</text><path d="M510 96 L510 124" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-zv-a)"/><text x="518" y="114" font-size="11" text-anchor="start">AVV</text><rect x="380" y="126" width="260" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="148" font-size="12.5" text-anchor="middle" font-weight="600">Beratung</text><text x="510.0" y="162" font-size="11" text-anchor="middle" style="fill:#5b6072">Auftragsverarbeiter, Kundin von Microsoft</text><path d="M510 176 L510 204" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-zv-a)"/><text x="518" y="194" font-size="11" text-anchor="start">Vertrag + DPA</text><rect x="380" y="206" width="260" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="224" font-size="12.5" text-anchor="middle" font-weight="600">Microsoft</text><text x="510.0" y="240" font-size="11" text-anchor="middle" style="fill:#5b6072">Unterauftragsverarbeiter</text><path d="M510 250 L510 278" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-zv-a)"/><text x="518" y="268" font-size="11" text-anchor="start">Unterauftragnehmerliste</text><rect x="380" y="280" width="260" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="298" font-size="12.5" text-anchor="middle" font-weight="600">Microsofts Unterauftragsverarbeiter</text><text x="510.0" y="314" font-size="11" text-anchor="middle" style="fill:#5b6072">etwa Modellanbieter</text><rect x="380" y="338" width="260" height="40" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="510" y="355" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Genehmigung und Änderungen</text><text x="510" y="370" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">laufen über die Beratung</text><rect x="20" y="406" width="640" height="50" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="427" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Wo die Daten liegen, entscheidet, ob Microsoft der Behörde</text><text x="340" y="445" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">direkt oder nur über die Beratung verpflichtet ist.</text></svg>