<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="d14-va-title d14-va-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d14-va-title">Vier-Augen-Prinzip mit zwei Parteien</title><desc id="d14-va-desc">Ablauf in vier Schritten: Die Firma beantragt und gibt frei, der Dienstleister setzt mit befristeter Rolle um, das Audit-Log hält die Änderung fest, ein Alarm bei Änderungen an Rollen oder Conditional Access geht an die Firma zurück. Darunter: Break-Glass-Konto versiegelt bei der Geschäftsführung; der Dienstleister gibt sich keine eigenen Aufträge.</desc><defs><marker id="d14-va-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d14-va-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d14-va-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="77.5" y="42" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">Firma</text><text x="252.5" y="42" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">Dienstleister</text><text x="427.5" y="42" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">Plattform</text><text x="602.5" y="42" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">Plattform</text><rect x="5" y="56" width="145" height="84" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="77.5" y="88" font-size="12.5" text-anchor="middle" font-weight="600">1 Antrag</text><text x="77.5" y="104" font-size="11" text-anchor="middle" style="fill:#5b6072">beantragt, gibt frei</text><text x="77.5" y="118" font-size="11" text-anchor="middle" style="fill:#5b6072">Ticket, E-Mail</text><rect x="180" y="56" width="145" height="84" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="252.5" y="88" font-size="12.5" text-anchor="middle" font-weight="600">2 Umsetzung</text><text x="252.5" y="104" font-size="11" text-anchor="middle" style="fill:#5b6072">setzt um, mit</text><text x="252.5" y="118" font-size="11" text-anchor="middle" style="fill:#5b6072">befristeter Rolle</text><rect x="355" y="56" width="145" height="84" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="427.5" y="88" font-size="12.5" text-anchor="middle" font-weight="600">3 Audit-Log</text><text x="427.5" y="104" font-size="11" text-anchor="middle" style="fill:#5b6072">hält die Änderung</text><text x="427.5" y="118" font-size="11" text-anchor="middle" style="fill:#5b6072">fest</text><rect x="530" y="56" width="145" height="84" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="602.5" y="88" font-size="12.5" text-anchor="middle" font-weight="600">4 Alarm</text><text x="602.5" y="104" font-size="11" text-anchor="middle" style="fill:#5b6072">bei Rollen und</text><text x="602.5" y="118" font-size="11" text-anchor="middle" style="fill:#5b6072">Conditional Access</text><path d="M150 98 L178 98" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d14-va-a)"/><path d="M325 98 L353 98" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d14-va-a)"/><path d="M500 98 L528 98" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d14-va-a)"/><path d="M602.5 140 L602.5 186 L77.5 186 L77.5 142" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d14-va-r)"/><text x="340" y="206" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Nachweis läuft an die Firma zurück</text><rect x="5" y="228" width="320" height="56" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="165.0" y="246" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Break-Glass-Konto</text><text x="165.0" y="262" font-size="11" text-anchor="middle" style="fill:#5b6072">versiegelt bei der Geschäftsführung,</text><text x="165.0" y="276" font-size="11" text-anchor="middle" style="fill:#5b6072">nicht beim Dienstleister</text><rect x="355" y="228" width="320" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="515.0" y="246" font-size="12.5" text-anchor="middle" font-weight="600">Keine eigenen Aufträge</text><text x="515.0" y="262" font-size="11" text-anchor="middle" style="fill:#5b6072">Der Dienstleister setzt nur um,</text><text x="515.0" y="276" font-size="11" text-anchor="middle" style="fill:#5b6072">was die Firma freigegeben hat</text></svg>