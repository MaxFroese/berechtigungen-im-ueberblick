<svg viewBox="0 0 680 600" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap09-vier-grenzen-t kap09-vier-grenzen-d" id="kap09-vier-grenzen" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap09-vier-grenzen-t">Ein Befehl durchläuft vier Grenzen</title><desc id="kap09-vier-grenzen-d">Das Modell schlägt einen Befehl vor. Er durchläuft Station 1 Rückfrage im Tool, die am Urteil von Mensch oder Klassifikator hängt, Station 2 Sandbox oder VM, vom Betriebssystem erzwungen, Station 3 Regeln in Entra ID, die nur bei einem neuen Token wirken und mit einem gültigen Token umgangen werden, und Station 4 Rechte des Kontos am Zieldienst. Jede Station hat einen Abzweig gestoppt. Die Stationen 2 bis 4 wirken ohne Mitarbeit von Mensch und Modell.</desc><defs><marker id="kap09-vier-grenzen-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap09-vier-grenzen-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap09-vier-grenzen-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><rect x="170" y="14" width="260" height="44" rx="10" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="300.0" y="40.5" font-size="13" text-anchor="middle" font-weight="600">Modell schlägt Befehl vor</text><line x1="300" y1="58" x2="300" y2="87" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-a)"/><rect x="170" y="88" width="260" height="72" rx="10" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="300.0" y="113.2" font-size="12" text-anchor="middle" font-weight="600">1  Rückfrage im Tool</text><text x="300.0" y="128.2" font-size="12" text-anchor="middle">Mensch oder Klassifikator</text><text x="300.0" y="143.2" font-size="12" text-anchor="middle" style="fill:#b8472a">hängt am Urteil</text><line x1="430" y1="124.0" x2="509" y2="124.0" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-h)"/><rect x="510" y="102" width="150" height="44" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="585.0" y="120.8" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">gestoppt</text><text x="585.0" y="134.8" font-size="11" text-anchor="middle" style="fill:#5b6072">wenn erkannt</text><line x1="300" y1="160" x2="300" y2="189" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-a)"/><rect x="170" y="190" width="260" height="72" rx="10" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="300.0" y="215.2" font-size="12" text-anchor="middle" font-weight="600">2  Sandbox oder VM</text><text x="300.0" y="230.2" font-size="12" text-anchor="middle">Betriebssystem</text><text x="300.0" y="245.2" font-size="12" text-anchor="middle" style="fill:#2f5d8a">technisch erzwungen</text><line x1="430" y1="226.0" x2="509" y2="226.0" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-h)"/><rect x="510" y="204" width="150" height="44" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="585.0" y="222.8" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">gestoppt</text><text x="585.0" y="236.8" font-size="11" text-anchor="middle" style="fill:#5b6072">außerhalb der Regeln</text><line x1="300" y1="262" x2="300" y2="291" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-a)"/><rect x="170" y="292" width="260" height="72" rx="10" fill="#ffffff" stroke="#2f5d8a" stroke-width="2" stroke-dasharray="6 4"/><text x="300.0" y="317.2" font-size="12" text-anchor="middle" font-weight="600">3  Regeln in Entra ID</text><text x="300.0" y="332.2" font-size="12" text-anchor="middle">nur bei neuem Token</text><text x="300.0" y="347.2" font-size="12" text-anchor="middle" style="fill:#5b6072">wirkt nur an der Token-Ausstellung</text><line x1="430" y1="328.0" x2="509" y2="328.0" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-h)"/><rect x="510" y="306" width="150" height="44" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="585.0" y="324.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">gestoppt</text><text x="585.0" y="338.9" font-size="11" text-anchor="middle" style="fill:#5b6072">Token abgelehnt</text><line x1="300" y1="364" x2="300" y2="393" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-a)"/><rect x="170" y="394" width="260" height="72" rx="10" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="300.0" y="419.2" font-size="12" text-anchor="middle" font-weight="600">4  Rechte des Kontos</text><text x="300.0" y="434.2" font-size="12" text-anchor="middle">am Zieldienst</text><text x="300.0" y="449.2" font-size="12" text-anchor="middle" style="fill:#2f5d8a">technisch erzwungen</text><line x1="430" y1="430.0" x2="509" y2="430.0" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-h)"/><rect x="510" y="408" width="150" height="44" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="585.0" y="426.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">gestoppt</text><text x="585.0" y="440.9" font-size="11" text-anchor="middle" style="fill:#5b6072">403</text><line x1="300" y1="466" x2="300" y2="495" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-vier-grenzen-a)"/><rect x="170" y="496" width="260" height="40" rx="10" fill="#ffffff" stroke="#5b6072" stroke-width="1.5"/><text x="300.0" y="520.2" font-size="12" text-anchor="middle" font-weight="600">Befehl läuft</text><path d="M300 277H150V379H298" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#kap09-vier-grenzen-m)"/><text x="142" y="314" font-size="11" text-anchor="end" style="fill:#5b6072">gültiges Token:</text><text x="142" y="328" font-size="11" text-anchor="end" style="fill:#5b6072">keine neue</text><text x="142" y="342" font-size="11" text-anchor="end" style="fill:#5b6072">Prüfung</text><path d="M50 190H40V466H50" fill="none" stroke="#2f5d8a" stroke-width="2"/><text x="28" y="328" font-size="11" text-anchor="middle" font-weight="600" transform="rotate(-90 28 328)" style="fill:#2f5d8a">wirkt ohne Mitarbeit von Mensch und Modell</text><rect x="20" y="555" width="24" height="14" rx="3" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="50" y="566" font-size="11" text-anchor="start" style="fill:#5b6072">hängt am Urteil</text><rect x="170" y="555" width="24" height="14" rx="3" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="200" y="566" font-size="11" text-anchor="start" style="fill:#5b6072">technisch erzwungen</text><rect x="345" y="555" width="24" height="14" rx="3" fill="#ffffff" stroke="#2f5d8a" stroke-width="2" stroke-dasharray="6 4"/><text x="375" y="566" font-size="11" text-anchor="start" style="fill:#5b6072">wirkt nur an der Token-Ausstellung</text></svg>