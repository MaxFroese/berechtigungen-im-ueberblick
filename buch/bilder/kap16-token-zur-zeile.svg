<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img" aria-labelledby="d16-tz-title d16-tz-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d16-tz-title">Vom Entra-Token zur Zeile</title><desc id="d16-tz-desc">Ein Mensch mit delegiertem Token und ein Dienst mit App-only-Token erhalten von Entra ID ein Token für die Adresse der Umgebung. Dataverse ordnet es einem Nutzer oder einem Application User zu, wendet dessen Sicherheitsrollen an und liefert die erlaubten Zeilen.</desc><defs><marker id="d16-tz-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d16-tz-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d16-tz-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="40" width="175" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="97.5" y="60" font-size="12.5" text-anchor="middle" font-weight="600">Mensch über App</text><text x="97.5" y="76" font-size="11" text-anchor="middle" style="fill:#5b6072">delegiert:</text><text x="97.5" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">user_impersonation</text><rect x="10" y="200" width="175" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="97.5" y="220" font-size="12.5" text-anchor="middle" font-weight="600">Dienst oder Skript</text><text x="97.5" y="236" font-size="11" text-anchor="middle" style="fill:#5b6072">App-only:</text><text x="97.5" y="250" font-size="11" text-anchor="middle" style="fill:#5b6072">.default</text><text x="315" y="100" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">authentifiziert</text><rect x="240" y="110" width="150" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="315.0" y="140" font-size="12.5" text-anchor="middle" font-weight="600">Entra ID</text><text x="315.0" y="156" font-size="11" text-anchor="middle" style="fill:#5b6072">Access Token,</text><text x="315.0" y="170" font-size="11" text-anchor="middle" style="fill:#5b6072">aud = Umgebungsadresse</text><path d="M185 70 L238 132" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><path d="M185 230 L238 170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><rect x="448" y="20" width="222" height="280" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="559" y="42" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Dataverse autorisiert</text><rect x="460" y="60" width="96" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="508.0" y="82" font-size="12.5" text-anchor="middle" font-weight="600">Nutzer</text><text x="508.0" y="98" font-size="11" text-anchor="middle" style="fill:#5b6072">Mensch</text><rect x="566" y="60" width="96" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="614.0" y="82" font-size="12.5" text-anchor="middle" font-weight="600">Application</text><text x="614.0" y="98" font-size="11" text-anchor="middle" style="fill:#5b6072">User</text><rect x="460" y="150" width="202" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="561.0" y="172" font-size="12.5" text-anchor="middle" font-weight="600">Sicherheitsrollen</text><text x="561.0" y="188" font-size="11" text-anchor="middle" style="fill:#5b6072">Business Unit, Teams</text><rect x="460" y="236" width="202" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="561.0" y="266" font-size="12.5" text-anchor="middle" font-weight="600">Zeilen</text><path d="M390 150 L446 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><text x="418" y="142" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Token</text><path d="M508 110 L508 148" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><path d="M614 110 L614 148" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><path d="M561 200 L561 234" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-tz-a)"/><text x="340" y="330" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Sicherheitsgruppe der Umgebung prüft nur Menschen; der Application User geht vorbei.</text></svg>