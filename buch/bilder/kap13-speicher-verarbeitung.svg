<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" role="img" aria-labelledby="d13-sv-title d13-sv-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d13-sv-title">Speicherort und Verarbeitungsort</title><desc id="d13-sv-desc">Gespeicherte Daten wie Dateien, Chatverlauf und der Abuse-Monitoring-Speicher bleiben in der Geografie der Ressource innerhalb der EU Data Boundary. Die Inferenz für einen Prompt kann je nach Einstellung in derselben Geografie, in der Data Zone EU, in jeder Azure-Region weltweit, per Flex Routing in den USA, Kanada oder Australien oder bei Ausnahmen wie Claude in Copilot, Bing-Websuche und Previews außerhalb der EU laufen.</desc><defs><marker id="d13-sv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d13-sv-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="10" y="40" width="460" height="330" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="24" y="30" font-size="13" text-anchor="start" font-weight="600" style="fill:#2f5d8a">EU Data Boundary (EU und EFTA)</text><text x="490" y="30" font-size="13" text-anchor="start" font-weight="600" style="fill:#5b6072">Außerhalb der EU</text><rect x="30" y="62" width="200" height="124" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1.5"/><text x="130.0" y="98" font-size="12.5" text-anchor="middle" font-weight="600">Speicherort</text><text x="130.0" y="113" font-size="11" text-anchor="middle" style="fill:#5b6072">Geografie der Ressource</text><text x="130.0" y="128" font-size="11" text-anchor="middle" style="fill:#5b6072">Dateien, Indizes</text><text x="130.0" y="143" font-size="11" text-anchor="middle" style="fill:#5b6072">Chatverlauf, Zustand</text><text x="130.0" y="158" font-size="11" text-anchor="middle" style="fill:#5b6072">Abuse-Monitoring-Speicher</text><path d="M130 186 L130 258" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-sv-a)"/><text x="138" y="226" font-size="11" text-anchor="start" style="fill:#5b6072">Inhalt</text><rect x="30" y="260" width="200" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="130.0" y="282" font-size="12.5" text-anchor="middle" font-weight="600">Prompt mit Dokumentinhalt</text><text x="130.0" y="296" font-size="11" text-anchor="middle" style="fill:#5b6072">Inferenz: wo wird gerechnet?</text><path d="M230 285 L250 285 M250 98 L250 330" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><rect x="270" y="76" width="185" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="362.5" y="94" font-size="12.5" text-anchor="middle" font-weight="600">Standard / Regional</text><text x="362.5" y="110" font-size="11" text-anchor="middle" style="fill:#5b6072">Foundry: gleiche Geografie</text><path d="M250 98 L268 98" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-sv-a)"/><rect x="270" y="128" width="185" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="362.5" y="146" font-size="12.5" text-anchor="middle" font-weight="600">Data Zone EU</text><text x="362.5" y="162" font-size="11" text-anchor="middle" style="fill:#5b6072">Foundry: EU und EFTA</text><path d="M250 150 L268 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-sv-a)"/><rect x="490" y="188" width="180" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="580.0" y="206" font-size="12.5" text-anchor="middle" font-weight="600">Global</text><text x="580.0" y="222" font-size="11" text-anchor="middle" style="fill:#5b6072">Foundry: jede Azure-Region</text><path d="M250 210 L488 210" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d13-sv-a)"/><rect x="490" y="246" width="180" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="580.0" y="261" font-size="12.5" text-anchor="middle" font-weight="600">Flex Routing (Copilot)</text><text x="580.0" y="276" font-size="11" text-anchor="middle" style="fill:#5b6072">bei Lastspitzen: USA,</text><text x="580.0" y="291" font-size="11" text-anchor="middle" style="fill:#5b6072">Kanada, Australien</text><path d="M250 270 L488 270" fill="none" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d13-sv-r)"/><rect x="490" y="308" width="180" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="580.0" y="323" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Ausnahmen</text><text x="580.0" y="338" font-size="11" text-anchor="middle" style="fill:#5b6072">Claude in Copilot,</text><text x="580.0" y="353" font-size="11" text-anchor="middle" style="fill:#5b6072">Bing-Websuche, Previews</text><path d="M250 330 L488 330" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d13-sv-r)"/><rect x="20" y="386" width="640" height="34" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="408" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Speicherort bleibt fest. Wo gerechnet wird, ist eine Einstellung.</text></svg>