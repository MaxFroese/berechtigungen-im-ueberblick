<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 395" width="680" height="395" role="img" aria-labelledby="k3-title k3-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="k3-title">Control Plane und Data Plane einer Azure-OpenAI-Ressource</title><desc id="k3-desc">Eine Azure-OpenAI-Ressource ist in Control Plane mit Ressource anlegen und Modell bereitstellen und Data Plane mit Modellaufruf geteilt. Contributor zeigt nur auf die Control Plane, Cognitive Services OpenAI User auf die Data Plane. Ein gestrichelter Pfeil listKeys führt von der Control Plane zum API-Key und weiter zur Data Plane.</desc><defs><marker id="k3-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="k3-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="k3-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs>
<rect x="270" y="14" width="396" height="346" rx="10" fill="#ffffff" stroke="#5b6072" stroke-width="1.2"/>
<text x="468" y="36" text-anchor="middle" font-size="14" font-weight="600">Azure-OpenAI-Ressource</text>
<rect x="290" y="50" width="356" height="100" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="468" y="74" text-anchor="middle" font-size="14" font-weight="600" style="fill:#2f5d8a">Control Plane</text>
<rect x="305" y="88" width="158" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="384" y="114" text-anchor="middle" font-size="12">Ressource anlegen</text>
<rect x="473" y="88" width="158" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="552" y="114" text-anchor="middle" font-size="12">Modell bereitstellen</text>
<rect x="290" y="250" width="356" height="94" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="468" y="274" text-anchor="middle" font-size="14" font-weight="600" style="fill:#2f5d8a">Data Plane</text>
<rect x="389" y="288" width="158" height="42" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="468" y="313" text-anchor="middle" font-size="12">Modellaufruf</text>
<rect x="413" y="185" width="110" height="30" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="2"/>
<text x="468" y="205" text-anchor="middle" font-size="12" font-weight="600">API-Key</text>
<line x1="468" y1="150" x2="468" y2="184" stroke="#b8472a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#k3-r)"/>
<line x1="468" y1="215" x2="468" y2="249" stroke="#b8472a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#k3-r)"/>
<text x="478" y="172" text-anchor="start" font-size="12" style="fill:#b8472a">listKeys</text>
<text x="478" y="237" text-anchor="start" font-size="12" style="fill:#b8472a">ohne Data-Plane-Rolle</text>
<text x="403" y="196" text-anchor="end" font-size="12" style="fill:#b8472a">Brücke zwischen</text>
<text x="403" y="212" text-anchor="end" font-size="12" style="fill:#b8472a">den Ebenen</text>
<rect x="16" y="76" width="194" height="54" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="113" y="108" text-anchor="middle" font-size="13" font-weight="600">Contributor</text>
<line x1="210" y1="103" x2="289" y2="103" stroke="#2f5d8a" stroke-width="1.8" marker-end="url(#k3-b)"/>
<text x="113" y="149" text-anchor="middle" font-size="11" style="fill:#5b6072">erreicht nur die Control Plane</text>
<rect x="16" y="270" width="194" height="54" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="113" y="293" text-anchor="middle" font-size="13" font-weight="600">Cognitive Services</text>
<text x="113" y="311" text-anchor="middle" font-size="13" font-weight="600">OpenAI User</text>
<line x1="210" y1="297" x2="289" y2="297" stroke="#2f5d8a" stroke-width="1.8" marker-end="url(#k3-b)"/>
<text x="113" y="343" text-anchor="middle" font-size="11" style="fill:#5b6072">erreicht die Data Plane</text>
<line x1="150" y1="381" x2="180" y2="381" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#k3-b)"/>
<text x="188" y="385" text-anchor="start" class="legend-text">Rollenzuweisung</text>
<line x1="320" y1="381" x2="350" y2="381" stroke="#b8472a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#k3-r)"/>
<text x="358" y="385" text-anchor="start" class="legend-text">Weg über einen gespeicherten Schlüssel</text>
</svg>