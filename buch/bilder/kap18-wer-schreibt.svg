<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="d18-ws-title d18-ws-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d18-ws-title">Wer in Produktion schreibt</title><desc id="d18-ws-desc">Ein Maker beantragt in der Entwicklung ein Deployment, die Pipeline im Host prüft, eine zweite Person genehmigt, ein Service Principal mit hoher Rolle nur in Produktion importiert die managed Solution. Antrag, Genehmigung und Deployment stehen im Protokoll des Hosts.</desc><defs><marker id="d18-ws-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d18-ws-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d18-ws-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="60" width="120" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="65.0" y="90" font-size="12.5" text-anchor="middle" font-weight="600">Maker</text><text x="65.0" y="106" font-size="11" text-anchor="middle" style="fill:#5b6072">baut in Dev,</text><text x="65.0" y="120" font-size="11" text-anchor="middle" style="fill:#5b6072">keine Rechte in Prod</text><text x="65.0" y="48" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">beantragt</text><rect x="140" y="60" width="125" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="202.5" y="90" font-size="12.5" text-anchor="middle" font-weight="600">Pipeline im Host</text><text x="202.5" y="106" font-size="11" text-anchor="middle" style="fill:#5b6072">prüft Abhängigkeiten</text><text x="202.5" y="120" font-size="11" text-anchor="middle" style="fill:#5b6072">und Verbindungen</text><text x="202.5" y="48" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">prüft</text><rect x="280" y="60" width="120" height="80" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340.0" y="98" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Genehmigung</text><text x="340.0" y="112" font-size="11" text-anchor="middle" style="fill:#5b6072">zweite Person</text><text x="340.0" y="48" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">gibt frei</text><rect x="415" y="60" width="125" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="477.5" y="90" font-size="12.5" text-anchor="middle" font-weight="600">Service Principal</text><text x="477.5" y="106" font-size="11" text-anchor="middle" style="fill:#5b6072">Application User,</text><text x="477.5" y="120" font-size="11" text-anchor="middle" style="fill:#5b6072">hohe Rolle nur in Prod</text><text x="477.5" y="48" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">importiert</text><rect x="555" y="60" width="120" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="615.0" y="98" font-size="12.5" text-anchor="middle" font-weight="600">Produktion</text><text x="615.0" y="112" font-size="11" text-anchor="middle" style="fill:#5b6072">managed Solution</text><text x="615.0" y="48" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">erhält</text><path d="M125 100 L138 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ws-a)"/><path d="M265 100 L278 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ws-a)"/><path d="M400 100 L413 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ws-a)"/><path d="M540 100 L553 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d18-ws-a)"/><rect x="140" y="180" width="400" height="46" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="340.0" y="200" font-size="12.5" text-anchor="middle" font-weight="600">Protokoll im Host</text><text x="340.0" y="216" font-size="11" text-anchor="middle" style="fill:#5b6072">Antrag, Genehmigung, Deployment</text><path d="M202 140 L202 178" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><path d="M477 140 L477 178" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="340" y="270" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Wer baut, liefert nicht selbst aus.</text></svg>