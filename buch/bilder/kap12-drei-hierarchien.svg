<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" role="img" aria-labelledby="d12-dh-title d12-dh-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d12-dh-title">Drei Hierarchien unter einem Tenant</title><desc id="d12-dh-desc">Der Tenant ist die gemeinsame Wurzel. Links die Azure-Hierarchie aus Subscription, Resource Group und Ressource, darunter als Unterbaum die Foundry-Ressource mit Projekt und Deployment; auf allen diesen Ebenen gilt Azure RBAC mit Vererbung nach unten. Rechts die Power Platform mit Umgebung, Dataverse und Sicherheitsrolle; auf Tenant-Ebene gilt eine Power-Platform-Admin-Rolle, in der Umgebung gelten Sicherheitsrollen.</desc><defs><marker id="d12-dh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker></defs><rect x="190" y="14" width="300" height="52" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="2.5"/><text x="340" y="37" font-size="14" text-anchor="middle" font-weight="600">Tenant</text><text x="340" y="55" font-size="11" text-anchor="middle" style="fill:#5b6072">gemeinsame Wurzel, hier liegen die Identitäten</text><path d="M340 66 L340 82 L225 82 L225 95" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-dh-a)"/><path d="M340 82 L562 82 L562 95" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-dh-a)"/><rect x="10" y="96" width="430" height="400" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="118" font-size="14" font-weight="600" style="fill:#2f5d8a">Azure</text><rect x="30" y="130" width="220" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="140" y="152" font-size="12.5" text-anchor="middle" font-weight="600">Subscription</text><line x1="140" y1="164" x2="140" y2="186" stroke="#2f5d8a" stroke-width="1.5"/><rect x="30" y="186" width="220" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="140" y="208" font-size="12.5" text-anchor="middle" font-weight="600">Resource Group</text><line x1="140" y1="220" x2="140" y2="242" stroke="#2f5d8a" stroke-width="1.5"/><rect x="30" y="242" width="220" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="140" y="264" font-size="12.5" text-anchor="middle" font-weight="600">Ressource</text><line x1="140" y1="276" x2="140" y2="324" stroke="#2f5d8a" stroke-width="1.5"/><rect x="22" y="296" width="236" height="190" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="34" y="479" font-size="11" style="fill:#5b6072">Foundry: Dienst innerhalb von Azure</text><rect x="34" y="324" width="210" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="139" y="344" font-size="12.5" text-anchor="middle" font-weight="600">Foundry-Ressource</text><text x="139" y="360" font-size="11" text-anchor="middle" style="fill:#5b6072">ist selbst eine Azure-Ressource</text><line x1="139" y1="368" x2="86" y2="394" stroke="#2f5d8a" stroke-width="1.5"/><line x1="139" y1="368" x2="196" y2="394" stroke="#2f5d8a" stroke-width="1.5"/><rect x="34" y="394" width="105" height="70" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="86" y="414" font-size="12.5" text-anchor="middle" font-weight="600">Projekt</text><text x="86" y="433" font-size="11" text-anchor="middle" style="fill:#5b6072">eigene Managed</text><text x="86" y="447" font-size="11" text-anchor="middle" style="fill:#5b6072">Identity</text><rect x="149" y="394" width="95" height="70" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="196" y="414" font-size="12" text-anchor="middle" font-weight="600">Deployment</text><text x="196" y="433" font-size="11" text-anchor="middle" style="fill:#5b6072">bereitgestelltes</text><text x="196" y="447" font-size="11" text-anchor="middle" style="fill:#5b6072">Modell</text><path d="M266 132 L266 472" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-dh-a)"/><rect x="276" y="130" width="160" height="84" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="356" y="151" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Azure RBAC</text><text x="356" y="170" font-size="11" text-anchor="middle">Rolle auf einem Scope</text><text x="356" y="185" font-size="11" text-anchor="middle">gilt auch für alles</text><text x="356" y="200" font-size="11" text-anchor="middle">darunter (Vererbung)</text><rect x="276" y="330" width="160" height="66" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="356" y="351" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Auch hier Azure RBAC:</text><text x="356" y="370" font-size="11" text-anchor="middle">Foundry-Ressource,</text><text x="356" y="385" font-size="11" text-anchor="middle">Projekt, Deployment</text><rect x="455" y="96" width="215" height="400" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="469" y="118" font-size="14" font-weight="600" style="fill:#2f5d8a">Power Platform</text><rect x="468" y="130" width="189" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="562" y="151" font-size="12.5" text-anchor="middle" font-weight="600">Umgebung</text><text x="562" y="168" font-size="11" text-anchor="middle" style="fill:#5b6072">eigene Region und Typ</text><line x1="562" y1="180" x2="562" y2="210" stroke="#2f5d8a" stroke-width="1.5"/><rect x="468" y="210" width="189" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="562" y="231" font-size="12.5" text-anchor="middle" font-weight="600">Dataverse</text><text x="562" y="248" font-size="11" text-anchor="middle" style="fill:#5b6072">Datenbank, bei Bedarf</text><line x1="562" y1="260" x2="562" y2="290" stroke="#2f5d8a" stroke-width="1.5"/><rect x="468" y="290" width="189" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="562" y="311" font-size="12.5" text-anchor="middle" font-weight="600">Sicherheitsrolle</text><text x="562" y="328" font-size="11" text-anchor="middle" style="fill:#5b6072">gilt in der Umgebung</text><rect x="468" y="362" width="189" height="48" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="562" y="381" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Tenant-Ebene</text><text x="562" y="399" font-size="11" text-anchor="middle">Power-Platform-Admin-Rolle</text><rect x="468" y="424" width="189" height="56" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="562" y="443" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">In der Umgebung</text><text x="562" y="461" font-size="11" text-anchor="middle">Sicherheitsrollen</text><rect x="20" y="512" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="533" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Gemeinsam ist nur der Tenant als Wurzel.</text><text x="340" y="551" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Foundry liegt ganz in der Azure-Hierarchie, Power Platform nicht.</text></svg>