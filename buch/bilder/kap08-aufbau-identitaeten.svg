<svg viewBox="0 0 680 565" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap08-aufbau-identitaeten-t kap08-aufbau-identitaeten-d" id="kap08-aufbau-identitaeten" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap08-aufbau-identitaeten-t">Der Aufbau: pro Pfeil ein eigenes Token</title><desc id="kap08-aufbau-identitaeten-d">Der Browser mit Web-App und MSAL meldet sich bei Entra ID an, ruft Graph API und Retrieval API mit einem delegierten Token der Audience Graph API auf und den eigenen Server mit einem delegierten Token der Audience eigene API. Der Server ruft das Modell mit seiner Managed Identity und einer Azure-Rolle auf. Eine gestrichelte Linie zeigt: Vom Server führt kein Weg zum SharePoint-Index.</desc><defs><marker id="kap08-aufbau-identitaeten-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap08-aufbau-identitaeten-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap08-aufbau-identitaeten-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><circle cx="140" cy="70" r="42" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="140" y="74.2" font-size="12" text-anchor="middle">Nutzer</text><circle cx="140" cy="280" r="72" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="140" y="267.6" font-size="13" text-anchor="middle">Browser</text><text x="140" y="284.6" font-size="13" text-anchor="middle">mit Web-App</text><text x="140" y="301.6" font-size="13" text-anchor="middle">und MSAL</text><circle cx="540" cy="70" r="48" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="540" y="74.2" font-size="12" text-anchor="middle">Entra ID</text><circle cx="540" cy="250" r="68" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="540" y="238.2" font-size="12" text-anchor="middle">Graph API</text><text x="540" y="254.2" font-size="12" text-anchor="middle">und</text><text x="540" y="270.2" font-size="12" text-anchor="middle">Retrieval API</text><rect x="485" y="306" width="110" height="24" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="540.0" y="321.9" font-size="11" text-anchor="middle">SharePoint-Index</text><circle cx="340" cy="500" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="340" y="496.1" font-size="13" text-anchor="middle">Eigener</text><text x="340" y="513.0" font-size="13" text-anchor="middle">Server</text><circle cx="610" cy="500" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="610" y="504.6" font-size="13" text-anchor="middle">Modell</text><line x1="140" y1="112" x2="140" y2="206" stroke="#5b6072" stroke-width="1.5"/><text x="150" y="165" font-size="12" style="fill:#5b6072">bedient</text><line x1="206" y1="245" x2="494" y2="94" stroke="#5b6072" stroke-width="1.5" marker-end="url(#kap08-aufbau-identitaeten-m)"/><text x="335" y="130" font-size="12" font-weight="600" text-anchor="end">Anmeldung</text><text x="335" y="146" font-size="12" text-anchor="end" style="fill:#5b6072">MSAL holt die Tokens</text><line x1="214" y1="270" x2="470" y2="254" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap08-aufbau-identitaeten-a)"/><text x="345" y="290" font-size="12" font-weight="600" text-anchor="middle">Web-App im Namen des Nutzers</text><text x="345" y="306" font-size="12" text-anchor="middle">delegiert, scp</text><text x="345" y="322" font-size="12" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Audience Graph API</text><line x1="190" y1="335" x2="300" y2="456" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap08-aufbau-identitaeten-a)"/><text x="225" y="400" font-size="12" font-weight="600" text-anchor="end">Web-App im Namen des Nutzers</text><text x="225" y="416" font-size="12" text-anchor="end">delegiert, scp access_as_user</text><text x="225" y="432" font-size="12" font-weight="600" text-anchor="end" style="fill:#2f5d8a">Audience eigene API</text><line x1="398" y1="500" x2="556" y2="500" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap08-aufbau-identitaeten-a)"/><text x="477" y="475" font-size="12" font-weight="600" text-anchor="middle">Managed Identity</text><text x="477" y="490" font-size="12" text-anchor="middle">des Servers</text><text x="477" y="518" font-size="12" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Azure-Rolle, kein Key</text><line x1="290" y1="375" x2="670" y2="375" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="396" font-size="12" font-weight="600" text-anchor="middle" style="fill:#b8472a">Kein Weg vom Server zu den Dateien</text><line x1="20" y1="511" x2="50" y2="511" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap08-aufbau-identitaeten-a)"/><text x="58" y="515" class="legend-text">Eigenes Token für genau einen Dienst</text><line x1="20" y1="531" x2="50" y2="531" stroke="#5b6072" stroke-width="1.5" marker-end="url(#kap08-aufbau-identitaeten-m)"/><text x="58" y="535" class="legend-text">Anmeldung bei Entra ID</text></svg>