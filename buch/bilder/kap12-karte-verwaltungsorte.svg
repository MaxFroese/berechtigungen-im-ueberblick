<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 570" role="img" aria-labelledby="d12-km-title d12-km-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d12-km-title">Verwaltungsorte nach Rechtesystem</title><desc id="d12-km-desc">Die Admin Center und Portale stehen gruppiert nach dem Rechtesystem, das dort gilt. Die Gruppe Entra-Rollen umfasst Entra, Microsoft 365 Admin Center, SharePoint, Teams, Exchange, Intune, Purview und Defender sowie das Power Platform Admin Center auf Tenant-Ebene. Azure RBAC gilt im Azure-Portal und im Foundry-Portal. Dataverse-Sicherheitsrollen gelten in den Maker-Portalen und in Umgebungen mit Dataverse. GitHub hat eigene GitHub-Rollen. Quer dazu liegen die Abrechnungsrollen, die im Microsoft 365 Admin Center und in Azure Cost Management und Billing gelten.</desc><rect x="10" y="10" width="660" height="196" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="24" y="32" font-size="14" font-weight="600" style="fill:#2f5d8a">Entra-Rollen</text><text x="130" y="32" font-size="11" style="fill:#5b6072">Admin Center, deren Rechte an Entra-Rollen hängen</text><rect x="24" y="46" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="180" y="66" font-size="12" text-anchor="middle">Entra Admin Center</text><rect x="344" y="46" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="66" font-size="12" text-anchor="middle">Microsoft 365 Admin Center</text><rect x="24" y="86" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="180" y="106" font-size="12" text-anchor="middle">SharePoint Admin Center</text><rect x="344" y="86" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="106" font-size="12" text-anchor="middle">Teams Admin Center</text><rect x="24" y="126" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="180" y="146" font-size="12" text-anchor="middle">Exchange Admin Center</text><rect x="344" y="126" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="146" font-size="12" text-anchor="middle">Intune</text><rect x="24" y="166" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="180" y="186" font-size="12" text-anchor="middle">Purview, Defender</text><rect x="344" y="166" width="312" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="186" font-size="12" text-anchor="middle">Power Platform Admin Center (Tenant-Ebene)</text><rect x="10" y="222" width="212" height="116" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="24" y="244" font-size="14" font-weight="600" style="fill:#2f5d8a">Azure RBAC</text><rect x="24" y="258" width="184" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="116" y="278" font-size="12" text-anchor="middle">Azure-Portal</text><rect x="24" y="298" width="184" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="116" y="318" font-size="12" text-anchor="middle">Foundry-Portal</text><rect x="234" y="222" width="212" height="116" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="246" y="244" font-size="13" font-weight="600" style="fill:#2f5d8a">Dataverse-Sicherheitsrollen</text><rect x="248" y="258" width="184" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340" y="278" font-size="12" text-anchor="middle">Maker-Portale</text><rect x="248" y="298" width="184" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340" y="318" font-size="12" text-anchor="middle">Umgebungen mit Dataverse</text><rect x="458" y="222" width="212" height="116" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="472" y="244" font-size="14" font-weight="600" style="fill:#2f5d8a">GitHub-Rollen</text><text x="472" y="262" font-size="11" style="fill:#5b6072">außerhalb von Entra</text><rect x="472" y="278" width="184" height="32" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="564" y="298" font-size="12" text-anchor="middle">GitHub</text><rect x="10" y="356" width="660" height="100" rx="6" fill="none" stroke="#b8472a" stroke-width="2.5"/><text x="24" y="378" font-size="14" font-weight="600" style="fill:#b8472a">Abrechnungsrollen</text><text x="170" y="378" font-size="11" style="fill:#5b6072">quer: eigene Rollenwelt neben allen anderen</text><rect x="24" y="394" width="312" height="48" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="180" y="414" font-size="12" text-anchor="middle">Microsoft 365 Admin Center</text><text x="180" y="431" font-size="11" text-anchor="middle" style="fill:#5b6072">Abrechnung der Microsoft-365-Produkte</text><rect x="344" y="394" width="312" height="48" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="500" y="414" font-size="12" text-anchor="middle">Azure-Portal</text><text x="500" y="431" font-size="11" text-anchor="middle" style="fill:#5b6072">Cost Management + Billing</text><rect x="20" y="476" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="497" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Das Portal sagt nicht, wo die Rolle vergeben wird.</text><text x="340" y="515" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Maßgeblich ist das Rechtesystem hinter dem Portal.</text><rect x="20" y="548" width="26" height="14" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="54" y="559" font-size="11" text-anchor="start" style="fill:#5b6072">Portal in einer Rechtegruppe</text><rect x="260" y="548" width="26" height="14" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="294" y="559" font-size="11" text-anchor="start" style="fill:#5b6072">Portal, in dem zusätzlich Abrechnungsrollen gelten</text></svg>