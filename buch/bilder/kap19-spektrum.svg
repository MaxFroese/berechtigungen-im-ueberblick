<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 325" role="img" aria-labelledby="d19-sp-title d19-sp-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d19-sp-title">Vom Agent Builder zur eigenen App</title><desc id="d19-sp-desc">Fünf Stufen von links nach rechts: Agent Builder, Copilot Studio, Copilot Studio mit eigenen Tools, Foundry, eigene App mit Agents SDK. Darunter für jede Stufe, wer orchestriert, wer betreibt und wer die Compliance trägt. Ein Pfeil zeigt: mehr Kontrolle, mehr Verantwortung.</desc><defs><marker id="d19-sp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d19-sp-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d19-sp-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="30" width="128" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="69.0" y="68" font-size="12.5" text-anchor="middle" font-weight="600">Agent Builder</text><text x="69.0" y="82" font-size="11" text-anchor="middle" style="fill:#5b6072">in M365 Copilot</text><rect x="138" y="30" width="128" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="202.0" y="68" font-size="12.5" text-anchor="middle" font-weight="600">Copilot Studio</text><text x="202.0" y="82" font-size="11" text-anchor="middle" style="fill:#5b6072">Low-Code</text><rect x="271" y="30" width="128" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="335.0" y="60" font-size="12.5" text-anchor="middle" font-weight="600">Copilot Studio</text><text x="335.0" y="76" font-size="11" text-anchor="middle" style="fill:#5b6072">+ Connector, API,</text><text x="335.0" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">MCP, Foundry</text><rect x="404" y="30" width="128" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="468.0" y="60" font-size="12.5" text-anchor="middle" font-weight="600">Foundry</text><text x="468.0" y="76" font-size="11" text-anchor="middle" style="fill:#5b6072">eigene</text><text x="468.0" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">Orchestrierung</text><rect x="537" y="30" width="128" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="601.0" y="68" font-size="12.5" text-anchor="middle" font-weight="600">Eigene App</text><text x="601.0" y="82" font-size="11" text-anchor="middle" style="fill:#5b6072">Agents SDK</text><line x1="5" y1="170" x2="665" y2="170" stroke="#c8ccd6" stroke-width="1"/><text x="5" y="140" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Wer orchestriert</text><text x="69.0" y="160" font-size="11.5" text-anchor="middle">Microsoft</text><text x="202.0" y="160" font-size="11.5" text-anchor="middle">Copilot Studio</text><text x="335.0" y="160" font-size="11.5" text-anchor="middle">Copilot Studio</text><text x="468.0" y="160" font-size="11.5" text-anchor="middle">eigener Code</text><text x="601.0" y="160" font-size="11.5" text-anchor="middle">eigener Code</text><line x1="5" y1="222" x2="665" y2="222" stroke="#c8ccd6" stroke-width="1"/><text x="5" y="192" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Wer betreibt</text><text x="69.0" y="212" font-size="11.5" text-anchor="middle">Microsoft</text><text x="202.0" y="212" font-size="11.5" text-anchor="middle">Microsoft</text><text x="335.0" y="212" font-size="11.5" text-anchor="middle">plus eigene API</text><text x="468.0" y="212" font-size="11.5" text-anchor="middle">eigenes Azure</text><text x="601.0" y="212" font-size="11.5" text-anchor="middle">alles selbst</text><line x1="5" y1="274" x2="665" y2="274" stroke="#c8ccd6" stroke-width="1"/><text x="5" y="244" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Compliance</text><text x="69.0" y="264" font-size="11.5" text-anchor="middle">von M365</text><text x="202.0" y="264" font-size="11.5" text-anchor="middle">Power Platform</text><text x="335.0" y="264" font-size="11.5" text-anchor="middle">geteilt</text><text x="468.0" y="264" font-size="11.5" text-anchor="middle">Betreiber</text><text x="601.0" y="264" font-size="11.5" text-anchor="middle">Betreiber</text><path d="M20 310 L660 310" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d19-sp-r)"/><text x="340" y="300" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">mehr Kontrolle, mehr Verantwortung</text></svg>