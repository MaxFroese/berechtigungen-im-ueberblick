<svg viewBox="0 0 680 484" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-t d1-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d1-t">Vom Commit zur laufenden App: drei Identitäten, zwei Rechtewelten</title><desc id="d1-d">Das GitHub-Konto schiebt vom Entwickler-Laptop ins Repository, der Runner handelt als Deployment-Identität gegenüber App Service und tauscht bei Entra ID ein Token, die App greift als Laufzeit-Identität auf Key Vault und weitere Dienste zu. Eine gestrichelte Grenze trennt GitHub und Tenant. Die Rechte der späteren Identitäten hängen faktisch davon ab, wer die früheren kontrolliert.</desc><defs><marker id="d1-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d1-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d1-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="20" y="26" text-anchor="start" font-size="13" font-weight="600" style="fill:#2f5d8a">Rechtewelt GitHub</text><circle cx="80" cy="105" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="80" y="102.1" text-anchor="middle" font-size="12">Entwickler-</text><text x="80" y="116.6" text-anchor="middle" font-size="12">Laptop</text><circle cx="290" cy="105" r="48" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="290" y="94.8" text-anchor="middle" font-size="12">Repository in</text><text x="290" y="109.3" text-anchor="middle" font-size="12">der GitHub</text><text x="290" y="123.8" text-anchor="middle" font-size="12">Organization</text><circle cx="500" cy="105" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="500" y="109.3" text-anchor="middle" font-size="12">Runner</text><line x1="124" y1="105" x2="241" y2="105" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)"/><text x="183" y="80" text-anchor="middle" font-size="11" style="fill:#5b6072">Identität 1</text><text x="183" y="96" text-anchor="middle" font-size="12" font-weight="700" style="fill:#b8472a">GitHub-Konto</text><line x1="339" y1="105" x2="455" y2="105" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)"/><text x="397" y="96" text-anchor="middle" font-size="11" style="fill:#5b6072">startet Job</text><line x1="14" y1="195" x2="666" y2="195" stroke="#5b6072" stroke-width="1.4" stroke-dasharray="6 5"/><text x="20" y="187" text-anchor="start" font-size="11" style="fill:#5b6072">Grenze zwischen GitHub und Tenant</text><text x="20" y="218" text-anchor="start" font-size="13" font-weight="600" style="fill:#2f5d8a">Rechtewelt Tenant: Entra ID und Azure</text><circle cx="500" cy="300" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="500" y="304.3" text-anchor="middle" font-size="12">App Service</text><circle cx="620" cy="300" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="620" y="304.3" text-anchor="middle" font-size="12">Entra ID</text><circle cx="290" cy="300" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="290" y="304.3" text-anchor="middle" font-size="12">Key Vault</text><circle cx="290" cy="415" r="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="290" y="412.1" text-anchor="middle" font-size="12">weitere</text><text x="290" y="426.6" text-anchor="middle" font-size="12">Dienste</text><line x1="500" y1="149" x2="500" y2="255" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)"/><text x="491" y="222" text-anchor="end" font-size="11" style="fill:#5b6072">Identität 2</text><text x="491" y="238" text-anchor="end" font-size="12" font-weight="700" style="fill:#b8472a">Deployment-Identität</text><line x1="523" y1="142" x2="596" y2="261" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)" marker-start="url(#d1-a)"/><text x="562" y="166" text-anchor="start" font-size="11" style="fill:#5b6072">Token-Tausch</text><line x1="456" y1="300" x2="335" y2="300" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)"/><text x="395" y="275" text-anchor="middle" font-size="11" style="fill:#5b6072">Identität 3</text><text x="395" y="291" text-anchor="middle" font-size="12" font-weight="700" style="fill:#b8472a">Laufzeit-Identität</text><line x1="462" y1="322" x2="326" y2="397" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d1-a)"/><text x="398" y="378" text-anchor="start" font-size="12" font-weight="700" style="fill:#b8472a">Laufzeit-Identität</text><text x="20" y="262" text-anchor="start" font-size="12" font-weight="700" style="fill:#b8472a">Faktische Abhängigkeit</text><text x="20" y="282" text-anchor="start" font-size="11.5">Wer das GitHub-Konto kontrolliert,</text><line x1="32" y1="289" x2="32" y2="309" stroke="#b8472a" stroke-width="1.6" marker-end="url(#d1-r)"/><text x="20" y="325" text-anchor="start" font-size="11.5">bestimmt, was die Deployment-</text><text x="20" y="340" text-anchor="start" font-size="11.5">Identität ausrollt,</text><line x1="32" y1="347" x2="32" y2="367" stroke="#b8472a" stroke-width="1.6" marker-end="url(#d1-r)"/><text x="20" y="383" text-anchor="start" font-size="11.5">und damit, was die Laufzeit-</text><text x="20" y="398" text-anchor="start" font-size="11.5">Identität tut.</text><text x="20" y="470" text-anchor="start" class="legend-text">Rot: handelnde Identität am Pfeil. Gestrichelt: Grenze der beiden Rechtewelten.</text></svg>