<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 362" role="img" aria-labelledby="d17-de-title d17-de-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d17-de-title">Delegation in einer Canvas App</title><desc id="d17-de-desc">Links filtert die Datenquelle mit 10.000 Zeilen selbst, und alle drei Treffer kommen in der App an. Rechts holt die App nur die ersten 500 Zeilen und filtert lokal; nur einer der drei Treffer kommt an, ohne Fehlermeldung.</desc><defs><marker id="d17-de-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d17-de-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d17-de-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="10" width="320" height="290" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="34" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">delegiert</text><rect x="30" y="50" width="280" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170.0" y="76" font-size="12.5" text-anchor="middle" font-weight="600">Datenquelle</text><text x="170.0" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">10.000 Zeilen, Treffer bei 120, 4.300 und 9.800</text><path d="M170 106 L170 188" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d17-de-a)"/><text x="180" y="152" font-size="11" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Filter läuft in der Quelle</text><rect x="30" y="190" width="280" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170.0" y="216" font-size="12.5" text-anchor="middle" font-weight="600">App</text><text x="170.0" y="230" font-size="11" text-anchor="middle" style="fill:#5b6072">erhält 3 von 3 Treffern</text><text x="170" y="276" font-size="12" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">vollständig</text><rect x="350" y="10" width="320" height="290" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="364" y="34" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">nicht delegiert</text><rect x="370" y="50" width="280" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="76" font-size="12.5" text-anchor="middle" font-weight="600">Datenquelle</text><text x="510.0" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">10.000 Zeilen, Treffer bei 120, 4.300 und 9.800</text><path d="M510 106 L510 188" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d17-de-r)"/><text x="520" y="152" font-size="11" text-anchor="start" font-weight="600" style="fill:#b8472a">nur die ersten 500 Zeilen</text><rect x="370" y="190" width="280" height="56" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="510.0" y="216" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">App filtert lokal</text><text x="510.0" y="230" font-size="11" text-anchor="middle" style="fill:#5b6072">erhält 1 von 3 Treffern</text><text x="510" y="276" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">unvollständig, ohne Fehlermeldung</text><rect x="10" y="312" width="660" height="40" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340.0" y="336" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Nicht delegiert heißt nicht langsam, sondern still falsch.</text></svg>