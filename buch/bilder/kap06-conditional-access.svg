<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 478" role="img" aria-labelledby="kap06-conditional-access-t kap06-conditional-access-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap06-conditional-access-t">Conditional Access entscheidet vor der Token-Ausstellung</title><desc id="kap06-conditional-access-d">Ablauf: Anmeldeversuch, Prüfung des ersten Faktors, Signale und Menge aller passenden Richtlinien. Daraus folgen Block, eine Auflage oder ein ausgestelltes Token. Eine erfüllte Auflage führt zum Token, eine nicht erfüllte zum Block. Unterhalb der Grenze der Token-Ausstellung steht getrennt die Rechteprüfung beim Zieldienst, die entscheidet, was das Token darf.</desc><defs><marker id="kap06-conditional-access-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="kap06-conditional-access-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8472a"/></marker><marker id="kap06-conditional-access-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6072"/></marker></defs><text x="16" y="20" font-size="13" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Conditional Access in Entra ID: Entsteht überhaupt ein Token?</text><rect x="16" y="62" width="120" height="48" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="76.0" y="90.2" font-size="12" text-anchor="middle">Anmeldeversuch</text><polyline points="136,86 170,86" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><rect x="170" y="62" width="120" height="48" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="230.0" y="82.7" font-size="12" text-anchor="middle">Prüfung des</text><text x="230.0" y="97.7" font-size="12" text-anchor="middle">ersten Faktors</text><polyline points="290,86 324,86" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><rect x="324" y="34" width="340" height="104" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="494" y="54" font-size="12.5" text-anchor="middle" font-weight="600">Signale</text><text x="494" y="73" font-size="12" text-anchor="middle">Nutzer und Rollen · Zieldienst oder Ziel-App</text><text x="494" y="92" font-size="12" text-anchor="middle">Gerätezustand mit Compliance von Intune</text><text x="494" y="111" font-size="12" text-anchor="middle">Standort · Risiko</text><polyline points="494,138 494,172" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><rect x="170" y="172" width="340" height="46" rx="8" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="199.4" font-size="12.5" text-anchor="middle" font-weight="600">Menge aller passenden Richtlinien</text><text x="164" y="188" font-size="11.5" text-anchor="end">Block trifft zu</text><polyline points="170,195 96,195 96,282" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-l)"/><text x="516" y="188" font-size="11.5" text-anchor="start">keine Auflage</text><polyline points="510,195 584,195 584,282" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><text x="348" y="256" font-size="11.5" text-anchor="start">Auflage verlangt</text><polyline points="340,218 340,282" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><rect x="16" y="282" width="160" height="56" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/><text x="96.0" y="306.4" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Block</text><text x="96.0" y="322.7" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">kein Token</text><rect x="260" y="282" width="160" height="56" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="306.7" font-size="12" text-anchor="middle">Auflage</text><text x="340.0" y="321.7" font-size="12" text-anchor="middle">MFA, konformes Gerät</text><rect x="504" y="282" width="160" height="56" rx="8" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1.5"/><text x="584.0" y="314.6" font-size="13" text-anchor="middle" font-weight="600" style="fill:#ffffff">Token ausgestellt</text><text x="218" y="303" font-size="11.5" text-anchor="middle" style="fill:#b8472a">nicht</text><text x="218" y="318" font-size="11.5" text-anchor="middle" style="fill:#b8472a">erfüllt</text><polyline points="260,328 176,328" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-l)"/><text x="462" y="303" font-size="11.5" text-anchor="middle">erfüllt</text><polyline points="420,310 504,310" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><line x1="16" y1="374" x2="664" y2="374" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5"/><text x="16" y="366" font-size="11.5" text-anchor="start" font-weight="600" style="fill:#b8472a">Grenze: Token-Ausstellung</text><polyline points="584,338 584,410" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-conditional-access-a)"/><text x="16" y="398" font-size="13" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Rechtesysteme beim Zieldienst: Was darf das Token?</text><rect x="324" y="410" width="340" height="56" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="494.0" y="434.6" font-size="12.5" text-anchor="middle">Rechteprüfung beim Zieldienst</text><text x="494.0" y="450.2" font-size="12.5" text-anchor="middle">Entscheidet erst hier, was das Token darf</text></svg>