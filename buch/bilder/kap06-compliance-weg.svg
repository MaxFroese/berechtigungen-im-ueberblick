<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 458" role="img" aria-labelledby="kap06-compliance-weg-t kap06-compliance-weg-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap06-compliance-weg-t">Der Weg des Compliance-Status</title><desc id="kap06-compliance-weg-d">Sequenz von oben nach unten: Das Gerät meldet Intune seinen vollen Zustand. Intune bewertet ihn anhand der Compliance-Richtlinien und schreibt nur das Ergebnis an das Geräteobjekt in Entra ID. Danach vergeht Zeit, und der Zustand des Geräts kann sich ändern. Bei einer späteren Anmeldung wertet Conditional Access das gespeicherte Ergebnis aus, das veraltet sein kann.</desc><defs><marker id="kap06-compliance-weg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="kap06-compliance-weg-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8472a"/></marker><marker id="kap06-compliance-weg-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6072"/></marker></defs><line x1="92" y1="66" x2="92" y2="452" stroke="#c8ccd6" stroke-width="1.5"/><line x1="262" y1="66" x2="262" y2="452" stroke="#c8ccd6" stroke-width="1.5"/><line x1="432" y1="66" x2="432" y2="452" stroke="#c8ccd6" stroke-width="1.5"/><line x1="592" y1="66" x2="592" y2="452" stroke="#c8ccd6" stroke-width="1.5"/><rect x="27.0" y="14" width="130" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="92" y="44" font-size="12.5" text-anchor="middle" font-weight="600">Gerät</text><rect x="187.0" y="14" width="150" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="262" y="36" font-size="12.5" text-anchor="middle" font-weight="600">Intune</text><text x="262" y="53" font-size="11" text-anchor="middle" style="fill:#5b6072">kennt den Zustand</text><rect x="354.0" y="14" width="156" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="432" y="36" font-size="12.5" text-anchor="middle" font-weight="600">Entra ID: Geräteobjekt</text><text x="432" y="53" font-size="11" text-anchor="middle" style="fill:#5b6072">kennt nur das Ergebnis</text><rect x="522.0" y="14" width="140" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="592" y="44" font-size="12.5" text-anchor="middle" font-weight="600">Conditional Access</text><text x="177" y="92" font-size="12" text-anchor="middle">Gerätebericht:</text><text x="177" y="107" font-size="12" text-anchor="middle">voller Zustand</text><polyline points="92,116 262,116" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-compliance-weg-a)"/><rect x="184" y="132" width="156" height="44" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="262.0" y="150.8" font-size="11.5" text-anchor="middle">Bewertung anhand der</text><text x="262.0" y="165.2" font-size="11.5" text-anchor="middle">Compliance-Richtlinien</text><text x="347" y="196" font-size="12" text-anchor="middle" font-weight="600">Nur das Ergebnis:</text><text x="347" y="211" font-size="12" text-anchor="middle">konform oder nicht</text><polyline points="262,220 432,220" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-compliance-weg-a)"/><rect x="366" y="234" width="132" height="30" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="432.0" y="253.2" font-size="12" text-anchor="middle">Status gesetzt</text><line x1="16" y1="292" x2="664" y2="292" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="222" y="282" width="248" height="20" fill="#fafaf7"/><text x="346" y="296" font-size="12" text-anchor="middle" style="fill:#5b6072">Zeit vergeht, der Status bleibt unverändert</text><rect x="20" y="316" width="144" height="44" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="92.0" y="334.8" font-size="11.5" text-anchor="middle">Zustand ändert sich,</text><text x="92.0" y="349.2" font-size="11.5" text-anchor="middle">Bericht steht noch aus</text><text x="512" y="344" font-size="12" text-anchor="middle">Anmeldung: Status</text><text x="512" y="359" font-size="12" text-anchor="middle">auswerten</text><polyline points="592,368 432,368" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-compliance-weg-a)"/><text x="512" y="392" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Ergebnis, das veraltet</text><text x="512" y="407" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">sein kann</text><polyline points="432,416 592,416" fill="none" stroke="#b8472a" stroke-width="2" marker-end="url(#kap06-compliance-weg-l)"/></svg>