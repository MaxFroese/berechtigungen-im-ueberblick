<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="d15-re-title d15-re-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d15-re-title">Vier Ebenen von Rollen</title><desc id="d15-re-desc">Vier Ebenen übereinander: Entra-Rollen im Tenant verwalten Umgebungen, Umgebungsrollen gelten ohne Dataverse, Sicherheitsrollen in Dataverse geben Datenzugriff, darüber Rollen einzelner Apps. Ein gestrichelter Pfeil von der Tenant-Ebene zu Dataverse steht für das protokollierte Selbst-Hochstufen.</desc><defs><marker id="d15-re-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d15-re-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d15-re-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="130" y="20" width="500" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="380.0" y="40" font-size="12.5" text-anchor="middle" font-weight="600">Tenant: Entra-Rollen</text><text x="380.0" y="56" font-size="11" text-anchor="middle" style="fill:#5b6072">Power Platform Administrator, Global Administrator</text><text x="380.0" y="70" font-size="11" text-anchor="middle" style="fill:#5b6072">verwalten Umgebungen</text><text x="20" y="54" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Ebene 1</text><rect x="130" y="96" width="500" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="380.0" y="124" font-size="12.5" text-anchor="middle" font-weight="600">Umgebung ohne Dataverse</text><text x="380.0" y="138" font-size="11" text-anchor="middle" style="fill:#5b6072">Environment Admin, Environment Maker</text><text x="20" y="130" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Ebene 2</text><rect x="130" y="172" width="500" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="380.0" y="200" font-size="12.5" text-anchor="middle" font-weight="600">Dataverse: Sicherheitsrollen</text><text x="380.0" y="214" font-size="11" text-anchor="middle" style="fill:#5b6072">System Administrator, System Customizer, Basic User, eigene Rollen</text><text x="20" y="206" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Ebene 3</text><rect x="130" y="248" width="500" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="380.0" y="276" font-size="12.5" text-anchor="middle" font-weight="600">App</text><text x="380.0" y="290" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen einer Dynamics-365-App, Web-Rollen in Power Pages</text><text x="20" y="282" font-size="11" text-anchor="start" font-weight="600" style="fill:#5b6072">Ebene 4</text><rect x="126" y="168" width="508" height="140" rx="6" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><text x="20" y="230" font-size="11" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Datenzugriff</text><text x="20" y="244" font-size="11" text-anchor="start" font-weight="600" style="fill:#2f5d8a">entsteht hier</text><path d="M630 50 L660 50 L660 196 L636 196" fill="none" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d15-re-r)"/><text x="380" y="335" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Vom Tenant-Admin zu den Daten nur durch Selbst-Hochstufen, und das wird protokolliert.</text></svg>