<svg viewBox="0 0 680 530" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap09-drei-ebenen-t kap09-drei-ebenen-d" id="kap09-drei-ebenen" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap09-drei-ebenen-t">Drei getrennte Anmeldungen rund um einen KI-Agenten</title><desc id="kap09-drei-ebenen-d">Auf dem Laptop läuft der KI-Agent als Prozess des Betriebssystem-Kontos und erreicht lokale Dateien und den Token-Cache von az. Mit dem Anbieterkonto erreicht er das Modell beim KI-Anbieter. Über den Token-Cache erreicht er mit einem Entra-Token den Tenant mit Entra ID, Graph API und Azure. Im Tenant gibt es kein Objekt für den KI-Agenten, Token und Log nennen nur den Menschen.</desc><defs><marker id="kap09-drei-ebenen-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap09-drei-ebenen-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap09-drei-ebenen-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><rect x="20" y="30" width="270" height="420" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><rect x="420" y="30" width="240" height="160" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><rect x="420" y="210" width="240" height="300" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5"/><text x="155" y="52" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Laptop</text><text x="155" y="70" font-size="11" text-anchor="middle" style="fill:#5b6072">Anmeldung 2: Betriebssystem-Konto</text><text x="540" y="52" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">KI-Anbieter</text><text x="540" y="232" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Tenant</text><rect x="55" y="95" width="200" height="28" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="155.0" y="112.8" font-size="11" text-anchor="middle">Lokale Dateien, etwa .env</text><rect x="55" y="370" width="200" height="28" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="155.0" y="387.9" font-size="11" text-anchor="middle">Token-Cache von az</text><text x="155" y="416" font-size="11" text-anchor="middle" style="fill:#5b6072">Sitzung aus az login</text><circle cx="155" cy="235" r="62" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/><text x="155" y="216.7" font-size="12" text-anchor="middle" font-weight="600">KI-Agent</text><text x="155" y="231.7" font-size="12" text-anchor="middle">Prozess des</text><text x="155" y="246.7" font-size="12" text-anchor="middle">Betriebssystem-</text><text x="155" y="261.7" font-size="12" text-anchor="middle">Kontos</text><line x1="155" y1="173" x2="155" y2="125" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-drei-ebenen-a)"/><text x="163" y="153" font-size="11" text-anchor="start" style="fill:#5b6072">liest</text><line x1="155" y1="297" x2="155" y2="368" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-drei-ebenen-a)"/><text x="163" y="337" font-size="11" text-anchor="start" style="fill:#5b6072">liest</text><circle cx="478" cy="110" r="38" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="478" y="114.2" font-size="12" text-anchor="middle">Modell</text><rect x="530" y="84" width="120" height="26" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="590.0" y="100.8" font-size="11" text-anchor="middle">Anbieterkonto</text><text x="590" y="128" font-size="11" text-anchor="middle" style="fill:#5b6072">Tarif, Daten-</text><text x="590" y="142" font-size="11" text-anchor="middle" style="fill:#5b6072">bedingungen</text><text x="590" y="170" font-size="11" text-anchor="middle" style="fill:#b8472a">keine Rechte im Tenant</text><line x1="212.8" y1="212.6" x2="441.6" y2="124.1" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-drei-ebenen-a)"/><text x="355" y="92" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Anmeldung 1</text><text x="355" y="106" font-size="11" text-anchor="middle">Anbieterkonto</text><circle cx="540" cy="285" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="540" y="289.2" font-size="12" text-anchor="middle">Entra ID</text><circle cx="470" cy="378" r="38" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="470" y="382.2" font-size="12" text-anchor="middle">Graph API</text><circle cx="610" cy="378" r="38" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="610" y="382.2" font-size="12" text-anchor="middle">Azure</text><line x1="518.4" y1="313.8" x2="493.5" y2="346.8" stroke="#5b6072" stroke-width="1.5" marker-end="url(#kap09-drei-ebenen-m)"/><line x1="561.6" y1="313.8" x2="586.5" y2="346.8" stroke="#5b6072" stroke-width="1.5" marker-end="url(#kap09-drei-ebenen-m)"/><text x="540" y="372" font-size="11" text-anchor="middle" style="fill:#5b6072">Tokens</text><line x1="255" y1="378" x2="431" y2="378" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-drei-ebenen-a)"/><text x="355" y="352" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Anmeldung 3</text><text x="355" y="366" font-size="11" text-anchor="middle">Entra-Token</text><text x="355" y="394" font-size="11" text-anchor="middle" style="fill:#b8472a">nennt nur</text><text x="355" y="408" font-size="11" text-anchor="middle" style="fill:#b8472a">den Menschen</text><rect x="432" y="436" width="216" height="28" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="540.0" y="453.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Kein Objekt für den KI-Agenten</text><rect x="432" y="470" width="216" height="28" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="540.0" y="487.9" font-size="11" text-anchor="middle">Im Log: der Mensch mit Azure CLI</text><text x="20" y="482" font-size="11" text-anchor="start" style="fill:#5b6072">Kreis: Prozess oder Dienst</text><text x="20" y="498" font-size="11" text-anchor="start" style="fill:#5b6072">Rechteck: Daten oder Feststellung</text><text x="20" y="514" font-size="11" text-anchor="start" style="fill:#5b6072">Rahmen: Bereich</text></svg>