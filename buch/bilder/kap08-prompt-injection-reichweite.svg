<svg viewBox="0 0 680 530" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap08-prompt-injection-reichweite-t kap08-prompt-injection-reichweite-d" id="kap08-prompt-injection-reichweite" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap08-prompt-injection-reichweite-t">Reichweite einer eingeschleusten Anweisung</title><desc id="kap08-prompt-injection-reichweite-d">Eine versteckte Anweisung läuft von der Person mit Schreibrecht über Index, Textstellen im Browser und Server zum Modell. Sie passiert dabei den Systemprompt, der das Risiko senkt, aber keine Grenze ist. Vom Modell geht die Ausgabe als Antwort zum Leser oder über einen Abzweig zu Agent oder Flow, die mit der Verbindung eines Nutzers handeln. Die Reichweite bestimmen die Rechte dieser Identität.</desc><defs><marker id="kap08-prompt-injection-reichweite-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap08-prompt-injection-reichweite-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap08-prompt-injection-reichweite-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="315" y="36" font-size="12" font-weight="600" text-anchor="middle" style="fill:#b8472a">Die versteckte Anweisung läuft als Text mit</text><circle cx="75" cy="110" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="75" y="91.7" font-size="12" text-anchor="middle">Person mit</text><text x="75" y="106.7" font-size="12" text-anchor="middle">Schreibrecht</text><text x="75" y="121.7" font-size="12" text-anchor="middle">auf ein</text><text x="75" y="136.7" font-size="12" text-anchor="middle">Dokument</text><circle cx="235" cy="110" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="235" y="114.2" font-size="12" text-anchor="middle">Index</text><circle cx="395" cy="110" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="395" y="106.7" font-size="12" text-anchor="middle">Textstellen</text><text x="395" y="121.7" font-size="12" text-anchor="middle">im Browser</text><circle cx="555" cy="110" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="555" y="114.2" font-size="12" text-anchor="middle">Server</text><circle cx="555" cy="275" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="555" y="279.6" font-size="13" text-anchor="middle">Modell</text><circle cx="300" cy="275" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="300" y="271.7" font-size="12" text-anchor="middle">Antwort</text><text x="300" y="286.7" font-size="12" text-anchor="middle">beim Leser</text><circle cx="555" cy="430" r="52" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="555" y="426.7" font-size="12" text-anchor="middle">Agent</text><text x="555" y="441.7" font-size="12" text-anchor="middle">oder Flow</text><circle cx="300" cy="430" r="58" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="300" y="411.7" font-size="12" text-anchor="middle">Verbindung</text><text x="300" y="426.7" font-size="12" text-anchor="middle">eines Nutzers</text><text x="300" y="441.7" font-size="12" text-anchor="middle">und deren</text><text x="300" y="456.7" font-size="12" text-anchor="middle">Rechte</text><line x1="129" y1="110" x2="181" y2="110" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><line x1="289" y1="110" x2="341" y2="110" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><line x1="449" y1="110" x2="501" y2="110" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><line x1="555" y1="162" x2="555" y2="217" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><line x1="490" y1="190" x2="620" y2="190" stroke="#5b6072" stroke-width="2" stroke-dasharray="7 5"/><text x="482" y="186" font-size="12" font-weight="600" text-anchor="end">Systemprompt</text><text x="482" y="202" font-size="12" text-anchor="end" style="fill:#5b6072">senkt das Risiko, keine Grenze</text><line x1="497" y1="275" x2="358" y2="275" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><text x="428" y="266" font-size="12" text-anchor="middle" style="fill:#5b6072">Modellausgabe</text><text x="232" y="270" font-size="12" text-anchor="end">wirkt auf das,</text><text x="232" y="286" font-size="12" text-anchor="end">was der Leser liest</text><line x1="555" y1="333" x2="555" y2="376" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><text x="568" y="350" font-size="12" style="fill:#5b6072">Abzweig bei</text><text x="568" y="365" font-size="12" style="fill:#5b6072">Agent oder Flow</text><line x1="501" y1="430" x2="360" y2="430" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><text x="430" y="421" font-size="12" text-anchor="middle" style="fill:#5b6072">handelt mit</text><text x="230" y="418" font-size="12" font-weight="600" text-anchor="end" style="fill:#b8472a">Reichweite:</text><text x="230" y="434" font-size="12" text-anchor="end" style="fill:#b8472a">was die Rechte dieser</text><text x="230" y="450" font-size="12" text-anchor="end" style="fill:#b8472a">Identität erlauben</text><line x1="20" y1="511" x2="50" y2="511" stroke="#b8472a" stroke-width="2" marker-end="url(#kap08-prompt-injection-reichweite-h)"/><text x="58" y="515" class="legend-text">Weg der eingeschleusten Anweisung</text><circle cx="298" cy="511" r="7" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/><text x="312" y="515" class="legend-text">Hier ziehen Rechte die Grenze</text></svg>