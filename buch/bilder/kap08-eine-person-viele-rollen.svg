<svg viewBox="0 0 680 420" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap08-eine-person-viele-rollen-t kap08-eine-person-viele-rollen-d" id="kap08-eine-person-viele-rollen" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap08-eine-person-viele-rollen-t">Ein Konto gegen getrennte Identitäten</title><desc id="kap08-eine-person-viele-rollen-d">Links vereint ein einziges Konto im Test-Tenant Admin-Rechte, Owner, Nutzer und Entwickler. Rechts sind dieselben Verantwortungen als Empfehlung für den Firmen-Tenant auf sechs Identitäten verteilt: normales Nutzerkonto, getrenntes Admin-Konto mit befristeter Rolle, IT als Stelle für Admin Consent, Deployment-Identität, Laufzeit-Identität und Testnutzer ohne Sonderrechte.</desc><defs><marker id="kap08-eine-person-viele-rollen-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap08-eine-person-viele-rollen-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap08-eine-person-viele-rollen-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="115" y="34" font-size="14" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Im Test-Tenant</text><text x="115" y="52" font-size="12" text-anchor="middle" style="fill:#5b6072">ein Konto, alle Rollen</text><text x="455" y="34" font-size="14" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Empfehlung im Firmen-Tenant</text><text x="455" y="52" font-size="12" text-anchor="middle" style="fill:#5b6072">jede Verantwortung bei einer eigenen Identität</text><circle cx="115" cy="230" r="88" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="115" y="174" font-size="13" font-weight="600" text-anchor="middle">Ein Konto</text><rect x="63" y="186" width="104" height="22" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="115.0" y="200.8" font-size="11" text-anchor="middle">Admin-Rechte</text><rect x="63" y="212" width="104" height="22" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="115.0" y="226.8" font-size="11" text-anchor="middle">Owner</text><rect x="63" y="238" width="104" height="22" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="115.0" y="252.8" font-size="11" text-anchor="middle">Nutzer</text><rect x="63" y="264" width="104" height="22" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="115.0" y="278.9" font-size="11" text-anchor="middle">Entwickler</text><line x1="208" y1="230" x2="254" y2="230" stroke="#5b6072" stroke-width="2" marker-end="url(#kap08-eine-person-viele-rollen-m)"/><text x="231" y="220" font-size="11" text-anchor="middle" style="fill:#5b6072">trennen</text><circle cx="315" cy="145" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="315" y="141.7" font-size="12" text-anchor="middle">Normales</text><text x="315" y="156.7" font-size="12" text-anchor="middle">Nutzerkonto</text><circle cx="455" cy="145" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="455" y="126.7" font-size="12" text-anchor="middle">Getrenntes</text><text x="455" y="141.7" font-size="12" text-anchor="middle">Admin-Konto</text><text x="455" y="156.7" font-size="12" text-anchor="middle">mit befristeter</text><text x="455" y="171.7" font-size="12" text-anchor="middle">Rolle</text><circle cx="595" cy="145" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="595" y="134.2" font-size="12" text-anchor="middle">IT</text><text x="595" y="149.2" font-size="12" text-anchor="middle">als Stelle für</text><text x="595" y="164.2" font-size="12" text-anchor="middle">Admin Consent</text><circle cx="315" cy="315" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="315" y="311.7" font-size="12" text-anchor="middle">Deployment-</text><text x="315" y="326.7" font-size="12" text-anchor="middle">Identität</text><circle cx="455" cy="315" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="455" y="311.7" font-size="12" text-anchor="middle">Laufzeit-</text><text x="455" y="326.7" font-size="12" text-anchor="middle">Identität</text><circle cx="595" cy="315" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="595" y="304.2" font-size="12" text-anchor="middle">Testnutzer</text><text x="595" y="319.2" font-size="12" text-anchor="middle">ohne</text><text x="595" y="334.2" font-size="12" text-anchor="middle">Sonderrechte</text><rect x="20" y="397" width="22" height="12" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="50" y="407" class="legend-text">Rolle, die dieses eine Konto zusätzlich hält</text></svg>