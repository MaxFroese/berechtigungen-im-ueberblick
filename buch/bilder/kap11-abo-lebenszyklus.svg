<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="d11-lc-title d11-lc-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d11-lc-title">Lebenszyklus eines Abos</title><desc id="d11-lc-desc">Eine Testversion wird am Ende mit eingeschalteter wiederkehrender Abrechnung zum bezahlten Abo. Mit ausgeschalteter wiederkehrender Abrechnung läuft sie ab, wird deaktiviert und schließlich gelöscht. „Cancel subscription“ führt dagegen sofort von der laufenden Testversion in den deaktivierten Zustand.</desc><defs><marker id="d11-lc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d11-lc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d11-lc-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><g transform="translate(0,-46)"><rect x="20" y="70" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="110" y="96" font-size="13" text-anchor="middle" font-weight="600">Testversion aktiv</text><text x="110" y="114" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">Graph: Enabled</text><rect x="480" y="70" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="570" y="96" font-size="13" text-anchor="middle" font-weight="600">Bezahltes Abo aktiv</text><text x="570" y="114" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">Graph: Enabled</text><rect x="20" y="230" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="110" y="256" font-size="13" text-anchor="middle" font-weight="600">Abgelaufen</text><text x="110" y="274" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">Graph: Warning</text><rect x="250" y="230" width="180" height="60" rx="14" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340" y="256" font-size="13" text-anchor="middle" font-weight="600">Deaktiviert</text><text x="340" y="274" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">Graph: Suspended</text><rect x="480" y="230" width="180" height="60" rx="14" fill="#ffffff" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="570" y="256" font-size="13" text-anchor="middle" font-weight="600">Gelöscht</text><text x="570" y="274" font-size="11.5" text-anchor="middle" style="fill:#5b6072">nicht mehr in der Abfrage</text><path d="M200 100 L478 100" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lc-a)"/><text x="340" y="78" font-size="11.5" text-anchor="middle" font-weight="600">Ende, wiederkehrende</text><text x="340" y="92" font-size="11.5" text-anchor="middle" font-weight="600">Abrechnung an</text><path d="M60 130 L60 228" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lc-a)"/><text x="70" y="166" font-size="11.5" text-anchor="start" font-weight="600">Ende, wiederkehrende</text><text x="70" y="180" font-size="11.5" text-anchor="start" font-weight="600">Abrechnung aus</text><path d="M185 130 L318 228" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d11-lc-l)"/><text x="250" y="156" font-size="12" text-anchor="start" font-weight="600" style="fill:#b8472a">„Cancel subscription“</text><text x="250" y="172" font-size="11.5" text-anchor="start" style="fill:#b8472a">wirkt sofort</text><path d="M200 260 L248 260" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lc-a)"/><path d="M430 260 L478 260" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lc-a)"/><text x="225" y="252" font-size="11" text-anchor="middle" style="fill:#5b6072">Frist</text><text x="455" y="252" font-size="11" text-anchor="middle" style="fill:#5b6072">Frist</text><text x="110" y="310" font-size="11" text-anchor="middle" style="fill:#5b6072">Nutzer arbeiten zunächst</text><text x="110" y="324" font-size="11" text-anchor="middle" style="fill:#5b6072">weiter, Hinweise im Portal</text><text x="340" y="310" font-size="11" text-anchor="middle" style="fill:#5b6072">nur noch Admins kommen</text><text x="340" y="324" font-size="11" text-anchor="middle" style="fill:#5b6072">an die Daten</text><text x="570" y="310" font-size="11" text-anchor="middle" style="fill:#5b6072">Daten weg, Abo verschwindet</text><text x="570" y="324" font-size="11" text-anchor="middle" style="fill:#5b6072">aus der Abfrage</text><rect x="20" y="350" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="371" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Am Ende der Testversion entscheidet die wiederkehrende Abrechnung, ob gekauft wird.</text><text x="340" y="389" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">„Cancel subscription“ ist ein anderer, sofort wirkender Weg.</text><line x1="20" y1="428" x2="58" y2="428" stroke="#2f5d8a" stroke-width="1.5"/><text x="66" y="432" font-size="11" text-anchor="start" style="fill:#5b6072">Übergang</text><line x1="160" y1="428" x2="198" y2="428" stroke="#b8472a" stroke-width="2.5"/><text x="206" y="432" font-size="11" text-anchor="start" style="fill:#5b6072">sofortiger Abbruch</text><rect x="340" y="421" width="22" height="14" rx="4" fill="#ffffff" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="370" y="432" font-size="11" text-anchor="start" style="fill:#5b6072">Abo existiert nicht mehr</text></g></svg>