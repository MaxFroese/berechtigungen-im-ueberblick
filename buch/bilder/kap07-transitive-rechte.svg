<svg viewBox="0 0 680 356" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2-t d2-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d2-t">Transitive Rechte von Write auf main bis zu den Daten</title><desc id="d2-d">Eine Kette führt von Write auf main über die Deployment-Identität und den Code in der App zur Laufzeit-Identität und zu den Daten im Key Vault. Der direkte Zugriff der Deployment-Identität auf die Daten ist durchgestrichen, der mittelbare Zugriff über den ausgerollten Code ist rot hervorgehoben.</desc><defs><marker id="d2-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d2-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d2-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="408" y="28" text-anchor="middle" font-size="12" font-weight="700" style="fill:#5b6072">Kein direkter Zugriff der Deployment-Identität auf die Daten</text><text x="408" y="45" text-anchor="middle" font-size="11" style="fill:#5b6072">Die Trennung verhindert den direkten Griff nach den Daten.</text><path d="M204 138 C204 60 612 60 612 108" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M604 112 L620 128 M620 112 L604 128" stroke="#b8472a" stroke-width="2.6" fill="none"/><circle cx="68" cy="190" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="68" y="187" text-anchor="middle" font-size="12">Write auf</text><text x="68" y="203" text-anchor="middle" font-size="12" style="font-family:ui-monospace,Menlo,Consolas,monospace">main</text><circle cx="204" cy="190" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="204" y="187.1" text-anchor="middle" font-size="12">Deployment-</text><text x="204" y="201.6" text-anchor="middle" font-size="12">Identität</text><circle cx="340" cy="190" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="340" y="187.1" text-anchor="middle" font-size="12">Code in</text><text x="340" y="201.6" text-anchor="middle" font-size="12">der App</text><circle cx="476" cy="190" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="476" y="173.1" text-anchor="middle" font-size="11.5">Laufzeit-</text><text x="476" y="187.1" text-anchor="middle" font-size="11.5">Identität</text><text x="476" y="201.1" text-anchor="middle" font-size="11.5">mit ihren</text><text x="476" y="215.1" text-anchor="middle" font-size="11.5">Rechten</text><circle cx="612" cy="190" r="50" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="612" y="178" text-anchor="middle" font-size="12">Daten im</text><text x="612" y="193" text-anchor="middle" font-size="12">Key Vault</text><rect x="594" y="201" width="36" height="14" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.4"/><line x1="118" y1="190" x2="154" y2="190" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d2-a)"/><line x1="254" y1="190" x2="290" y2="190" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d2-a)"/><line x1="390" y1="190" x2="426" y2="190" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d2-a)"/><line x1="526" y1="190" x2="562" y2="190" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d2-a)"/><text x="136" y="152" text-anchor="middle" font-size="11" style="fill:#5b6072">löst aus</text><text x="272" y="152" text-anchor="middle" font-size="11" style="fill:#5b6072">rollt aus</text><text x="408" y="152" text-anchor="middle" font-size="11" style="fill:#5b6072">läuft mit</text><text x="544" y="152" text-anchor="middle" font-size="11" style="fill:#5b6072">liest</text><path d="M204 242 C204 320 612 320 612 242" fill="none" stroke="#b8472a" stroke-width="2" marker-end="url(#d2-r)"/><text x="408" y="324" text-anchor="middle" font-size="12" font-weight="700" style="fill:#b8472a">Mittelbarer Zugriff über den ausgerollten Code:</text><text x="408" y="341" text-anchor="middle" font-size="12" font-weight="700" style="fill:#b8472a">Wer ausrollen darf, erbt die Rechte der Laufzeit-Identität.</text></svg>