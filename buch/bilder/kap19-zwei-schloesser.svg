<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img" aria-labelledby="d19-zs-title d19-zs-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d19-zs-title">Zwei Schlösser eines Agenten</title><desc id="d19-zs-desc">Eine Person in Teams passiert Schloss 1, die Anmeldung am Agenten, die regelt, wer chatten darf. Nach der Orchestrierung entscheidet Schloss 2, ob ein Tool mit den Rechten der Person oder mit denen des Makers handelt. Wissen aus SharePoint und Dataverse wird immer mit den Rechten der fragenden Person gefiltert.</desc><defs><marker id="d19-zs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d19-zs-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d19-zs-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="130" width="105" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="57.5" y="158" font-size="12.5" text-anchor="middle" font-weight="600">Person</text><text x="57.5" y="172" font-size="11" text-anchor="middle" style="fill:#5b6072">in Teams</text><rect x="128" y="118" width="134" height="84" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="195.0" y="150" font-size="12.5" text-anchor="middle" font-weight="600">Schloss 1</text><text x="195.0" y="166" font-size="11" text-anchor="middle" style="fill:#5b6072">Anmeldung am Agenten:</text><text x="195.0" y="180" font-size="11" text-anchor="middle" style="fill:#5b6072">wer darf chatten?</text><rect x="280" y="130" width="112" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="336.0" y="158" font-size="12.5" text-anchor="middle" font-weight="600">Agent</text><text x="336.0" y="172" font-size="11" text-anchor="middle" style="fill:#5b6072">Orchestrierung</text><rect x="410" y="118" width="134" height="84" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="477.0" y="150" font-size="12.5" text-anchor="middle" font-weight="600">Schloss 2</text><text x="477.0" y="166" font-size="11" text-anchor="middle" style="fill:#5b6072">mit wessen Rechten</text><text x="477.0" y="180" font-size="11" text-anchor="middle" style="fill:#5b6072">handelt das Tool?</text><rect x="562" y="40" width="113" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="618.5" y="66" font-size="12.5" text-anchor="middle" font-weight="600">Rechte Nutzer</text><text x="618.5" y="80" font-size="11" text-anchor="middle" style="fill:#5b6072">handelt als Person</text><rect x="562" y="224" width="113" height="56" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="618.5" y="242" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Rechte Maker</text><text x="618.5" y="258" font-size="11" text-anchor="middle" style="fill:#5b6072">alle handeln</text><text x="618.5" y="272" font-size="11" text-anchor="middle" style="fill:#5b6072">als Maker</text><path d="M110 160 L126 160" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d19-zs-a)"/><path d="M262 160 L278 160" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d19-zs-a)"/><path d="M392 160 L408 160" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d19-zs-a)"/><path d="M544 145 L560 70" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d19-zs-a)"/><path d="M544 175 L560 250" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d19-zs-r)"/><rect x="20" y="296" width="640" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="320" font-size="12.5" text-anchor="middle" font-weight="600">Wissen aus SharePoint und Dataverse: immer mit den Rechten der fragenden Person</text></svg>