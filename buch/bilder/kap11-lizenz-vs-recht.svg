<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 534" role="img" aria-labelledby="d11-lz-title d11-lz-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d11-lz-title">Lizenz und Recht: zwei getrennte Prüfungen</title><desc id="d11-lz-desc">Links schaltet die Kette aus Produkt, Service Plans und Lizenz den Dienst für ein Konto ein. Rechts entscheidet die Kette aus Site und Mitgliedschaft oder Freigabelink über den Zugriff auf die Daten. Nur wenn beide Prüfungen bestanden sind, kann das Konto mit der Datei arbeiten.</desc><defs><marker id="d11-lz-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d11-lz-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d11-lz-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><line x1="340" y1="18" x2="340" y2="356" stroke="#c8ccd6" stroke-width="1.5"/><text x="175" y="30" font-size="15" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Prüfung 1: Lizenz</text><text x="175" y="48" font-size="12" text-anchor="middle" style="fill:#5b6072">Dienst eingeschaltet?</text><text x="505" y="30" font-size="15" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Prüfung 2: Recht</text><text x="505" y="48" font-size="12" text-anchor="middle" style="fill:#5b6072">Zugriff auf die Daten?</text><rect x="75" y="66" width="200" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="91" font-size="12.5" text-anchor="middle" font-weight="600">Produkt (SKU)</text><path d="M175 106 L175 126" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lz-a)"/><rect x="55" y="128" width="240" height="66" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="147" font-size="12.5" text-anchor="middle" font-weight="600">Service Plans</text><rect x="65" y="158" width="68" height="24" rx="2" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="99" y="174" font-size="11" text-anchor="middle">Exchange</text><rect x="141" y="158" width="68" height="24" rx="2" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="175" y="174" font-size="11" text-anchor="middle">SharePoint</text><rect x="217" y="158" width="68" height="24" rx="2" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="251" y="174" font-size="11" text-anchor="middle">Teams</text><path d="M175 194 L175 214" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lz-a)"/><rect x="75" y="216" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="234" font-size="12.5" text-anchor="middle" font-weight="600">Lizenz</text><text x="175" y="251" font-size="11" text-anchor="middle" style="fill:#5b6072">ein Platz aus dem Abo</text><path d="M175 260 L175 282" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lz-a)"/><circle cx="175" cy="318" r="34" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="322" font-size="12.5" text-anchor="middle" font-weight="600">Konto</text><rect x="405" y="66" width="200" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="505" y="91" font-size="12.5" text-anchor="middle" font-weight="600">Site</text><path d="M505 106 L505 166" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lz-a)"/><rect x="405" y="168" width="200" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="505" y="189" font-size="12.5" text-anchor="middle" font-weight="600">Mitgliedschaft oder</text><text x="505" y="206" font-size="12.5" text-anchor="middle" font-weight="600">Freigabelink</text><path d="M505 218 L505 282" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d11-lz-a)"/><circle cx="505" cy="318" r="34" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="505" y="322" font-size="12.5" text-anchor="middle" font-weight="600">Konto</text><text x="340" y="384" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#5b6072">Beide Prüfungen sind getrennt nötig</text><rect x="20" y="398" width="200" height="66" rx="4" fill="#ffffff" stroke="#5b6072" stroke-width="1.5"/><text x="120" y="421" font-size="12" text-anchor="middle" font-weight="600">Lizenz ja, Recht nein</text><text x="120" y="442" font-size="12" text-anchor="middle" style="fill:#5b6072">sieht nichts</text><rect x="240" y="398" width="200" height="66" rx="4" fill="#ffffff" stroke="#5b6072" stroke-width="1.5"/><text x="340" y="421" font-size="12" text-anchor="middle" font-weight="600">Lizenz nein, Recht ja</text><text x="340" y="440" font-size="12" text-anchor="middle" style="fill:#5b6072">eingetragen, kann</text><text x="340" y="455" font-size="12" text-anchor="middle" style="fill:#5b6072">aber nicht arbeiten</text><rect x="460" y="398" width="200" height="66" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="2.5"/><text x="560" y="421" font-size="12" text-anchor="middle" font-weight="600">Lizenz ja, Recht ja</text><text x="560" y="442" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">arbeitet</text><rect x="20" y="482" width="640" height="36" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="505" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Lizenz schaltet den Dienst frei, die Rechte entscheiden über die Daten.</text></svg>