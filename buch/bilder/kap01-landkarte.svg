<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 425" role="img" aria-labelledby="kap01-landkarte-title kap01-landkarte-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap01-landkarte-title">Gesamtkarte: Tenant, Entra ID, Microsoft 365, Azure, GitHub und Laptop</title><desc id="kap01-landkarte-desc">Ein großer Rahmen steht für den Tenant. Darin liegt Entra ID als gemeinsamer Ausweisdienst, dem Microsoft 365 und Azure vertrauen; beide sind durch eine gestrichelte Linie getrennt. GitHub und der Laptop stehen außerhalb des Rahmens.</desc><defs><marker id="d1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker></defs><rect x="16" y="16" width="470" height="370" rx="12" fill="none" stroke="#2f5d8a" stroke-width="2.5"/><text x="34" y="42" text-anchor="start" font-size="15" font-weight="700" style="fill:#2f5d8a;">Tenant</text><rect x="126" y="56" width="250" height="72" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="251" y="86" text-anchor="middle" font-size="16" font-weight="700">Entra ID</text><text x="251" y="108" text-anchor="middle" font-size="12.5">gemeinsamer Ausweisdienst</text><line x1="133.5" y1="200" x2="188" y2="130" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d1a)"/><line x1="368.5" y1="200" x2="314" y2="130" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d1a)"/><text x="148" y="160" text-anchor="end" font-size="12" style="fill:#2f5d8a;">vertraut</text><text x="354" y="160" text-anchor="start" font-size="12" style="fill:#2f5d8a;">vertraut</text><text x="251" y="172" text-anchor="middle" font-size="12" font-weight="600" style="fill:#b8472a;">getrennte Welten</text><line x1="251" y1="182" x2="251" y2="372" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="36" y="200" width="195" height="165" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="133.5" y="226" text-anchor="middle" font-size="14" font-weight="700">Microsoft 365</text><text x="133.5" y="254" text-anchor="middle" font-size="12.5">SharePoint</text><text x="133.5" y="277" text-anchor="middle" font-size="12.5">OneDrive</text><text x="133.5" y="300" text-anchor="middle" font-size="12.5">Teams</text><text x="133.5" y="323" text-anchor="middle" font-size="12.5">Exchange Online</text><rect x="271" y="200" width="195" height="165" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="368.5" y="226" text-anchor="middle" font-size="14" font-weight="700">Azure</text><text x="368.5" y="254" text-anchor="middle" font-size="12.5">Web-Apps</text><text x="368.5" y="277" text-anchor="middle" font-size="12.5">Datenbanken</text><text x="368.5" y="300" text-anchor="middle" font-size="12.5">Modelle</text><text x="585" y="42" text-anchor="middle" font-size="12" font-weight="600" style="fill:#b8472a;">außerhalb des Tenants</text><rect x="510" y="56" width="150" height="130" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="585" y="86" text-anchor="middle" font-size="14" font-weight="700">GitHub</text><text x="585" y="112" text-anchor="middle" font-size="12">eigene Konten</text><text x="585" y="133" text-anchor="middle" font-size="12">eigene Rechte</text><text x="585" y="154" text-anchor="middle" font-size="12">eigene Anmeldung</text><rect x="510" y="216" width="150" height="110" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="585" y="246" text-anchor="middle" font-size="14" font-weight="700">Laptop</text><text x="585" y="272" text-anchor="middle" font-size="12">Browser</text><text x="585" y="293" text-anchor="middle" font-size="12">Kommandozeile</text><text x="16" y="412" text-anchor="start" class="legend-text">Roter Rand: der eine Ausweisdienst. Gestrichelt: Trennung der beiden Welten. Dicker Rahmen: Tenant-Grenze.</text></svg>