<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img" aria-labelledby="d12-sk-title d12-sk-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d12-sk-title">Schlüssel gegen Entra-Token</title><desc id="d12-sk-desc">Links der Weg mit Entra-Token: Der Principal holt ein Token mit der Audience https://cognitiveservices.azure.com, der Endpunkt der Foundry-Ressource prüft die Rollenzuweisung nach Azure RBAC, Zugriff gibt es nur bei passender Rolle. Rechts der Weg mit Schlüssel: Der Endpunkt prüft keine Rolle, der Aufrufer erhält vollen Data-Plane-Zugriff. Der Schalter disableLocalAuth auf true schließt diesen zweiten Weg.</desc><defs><marker id="d12-sk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d12-sk-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><line x1="340" y1="14" x2="340" y2="420" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 4"/><text x="170" y="30" font-size="14" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Weg 1: Entra-Token</text><text x="510" y="30" font-size="14" text-anchor="middle" font-weight="600" style="fill:#b8472a">Weg 2: Schlüssel</text><circle cx="170" cy="96" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170" y="100" font-size="12.5" text-anchor="middle" font-weight="600">Principal</text><circle cx="510" cy="96" r="36" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510" y="100" font-size="12.5" text-anchor="middle" font-weight="600">Aufrufer</text><path d="M170 132 L170 164" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-sk-a)"/><path d="M510 132 L510 164" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d12-sk-l)"/><rect x="40" y="166" width="260" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170" y="187" font-size="12.5" text-anchor="middle" font-weight="600">Entra-Token holen</text><text x="170" y="204" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Audience https://cognitiveservices.azure.com</text><rect x="380" y="166" width="260" height="50" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="510" y="187" font-size="12.5" text-anchor="middle" font-weight="600">Schlüssel mitsenden</text><text x="510" y="204" font-size="11" text-anchor="middle" style="fill:#5b6072">statisches Zugangsgeheimnis</text><path d="M170 216 L170 262" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-sk-a)"/><path d="M510 216 L510 262" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d12-sk-l)"/><line x1="488" y1="239" x2="532" y2="239" stroke="#b8472a" stroke-width="5" stroke-linecap="round"/><text x="542" y="229" font-size="11" text-anchor="start" style="fill:#b8472a">geschlossen bei</text><text x="542" y="243" font-size="11" text-anchor="start" font-weight="600" style="fill:#b8472a">disableLocalAuth:</text><text x="542" y="257" font-size="11" text-anchor="start" font-weight="600" style="fill:#b8472a">true</text><rect x="40" y="264" width="260" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170" y="285" font-size="12" text-anchor="middle" font-weight="600">Endpunkt der Foundry-Ressource</text><text x="170" y="302" font-size="11" text-anchor="middle" style="fill:#5b6072">prüft die Rollenzuweisung (Azure RBAC)</text><rect x="380" y="264" width="260" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510" y="285" font-size="12" text-anchor="middle" font-weight="600">Endpunkt der Foundry-Ressource</text><text x="510" y="302" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">prüft keine Rolle</text><path d="M170 314 L170 358" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-sk-a)"/><path d="M510 314 L510 358" fill="none" stroke="#b8472a" stroke-width="2.5" marker-end="url(#d12-sk-l)"/><rect x="40" y="360" width="260" height="50" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="2.5"/><text x="170" y="390" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Zugriff nur bei passender Rolle</text><rect x="380" y="360" width="260" height="50" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/><text x="510" y="382" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Voller Data-Plane-Zugriff</text><text x="510" y="399" font-size="11" text-anchor="middle" style="fill:#5b6072">auf diese Ressource</text><rect x="20" y="440" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="461" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Schlüssel umgeht Azure RBAC.</text><text x="340" y="479" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Nur disableLocalAuth: true schließt diesen Weg.</text></svg>