<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" role="img" aria-labelledby="d12-ab-title d12-ab-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d12-ab-title">Abrechnungsverknüpfungen zwischen den Welten</title><desc id="d12-ab-desc">Beispiel Test-Tenant. Links das Rechnungskonto Business mit den Microsoft-365-Abonnements und die Power-Platform-Umgebung mit Pay-as-you-go-Verknüpfung. Rechts das Rechnungskonto Individual mit der Azure-Subscription, darin zwei Resource Groups: eine mit der Foundry-Ressource, deren Tokenkosten anfallen, eine mit Microsoft.PowerPlatform/accounts. Die Umgebung ist über die Abrechnungsrichtlinie mit dieser Azure-Ressource verbunden. Die Rechte der beteiligten Welten sind getrennt und nicht verknüpft.</desc><defs><marker id="d12-ab-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker></defs><line x1="315" y1="10" x2="315" y2="366" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="20" y="16" width="280" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="160" y="38" font-size="12.5" text-anchor="middle" font-weight="600">Rechnungskonto Business</text><text x="160" y="56" font-size="11" text-anchor="middle" style="fill:#5b6072">Microsoft-365-Abonnements</text><rect x="380" y="16" width="280" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="520" y="38" font-size="12.5" text-anchor="middle" font-weight="600">Rechnungskonto Individual</text><text x="520" y="56" font-size="11" text-anchor="middle" style="fill:#5b6072">trägt die Azure-Subscription</text><path d="M520 104 L520 74" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d12-ab-a)"/><text x="530" y="93" font-size="11" text-anchor="start" style="fill:#5b6072">abgerechnet über</text><rect x="330" y="104" width="340" height="262" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="344" y="122" font-size="13" font-weight="600" style="fill:#2f5d8a">Azure-Subscription</text><rect x="345" y="136" width="310" height="94" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="358" y="153" font-size="11" style="fill:#5b6072">Resource Group</text><rect x="360" y="160" width="280" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="181" font-size="12.5" text-anchor="middle" font-weight="600">Foundry-Ressource</text><text x="500" y="199" font-size="11" text-anchor="middle" style="fill:#5b6072">Tokenkosten je Modell und Richtung</text><rect x="345" y="244" width="310" height="94" rx="6" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="358" y="261" font-size="11" style="fill:#5b6072">Resource Group</text><rect x="360" y="268" width="280" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="500" y="289" font-size="12" text-anchor="middle" font-weight="600">Microsoft.PowerPlatform/accounts</text><text x="500" y="307" font-size="11" text-anchor="middle" style="fill:#5b6072">Azure-Seite der Verknüpfung</text><rect x="20" y="268" width="210" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="125" y="289" font-size="12.5" text-anchor="middle" font-weight="600">Power-Platform-Umgebung</text><text x="125" y="307" font-size="11" text-anchor="middle" style="fill:#5b6072">Pay-as-you-go-Verknüpfung</text><path d="M230 298 L358 298" fill="none" stroke="#2f5d8a" stroke-width="2.5" marker-end="url(#d12-ab-a)"/><text x="272" y="283" font-size="11" text-anchor="middle" style="fill:#2f5d8a;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">Abrechnungs-</text><text x="272" y="295" font-size="11" text-anchor="middle" style="fill:#2f5d8a;paint-order:stroke;stroke:#fafaf7;stroke-width:5px;stroke-linejoin:round">richtlinie</text><rect x="20" y="110" width="280" height="96" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="160" y="131" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Rechte sind nicht verknüpft</text><text x="160" y="151" font-size="11" text-anchor="middle">Abrechnungsrollen am Rechnungskonto</text><text x="160" y="168" font-size="11" text-anchor="middle">Umgebungsrollen in der Power Platform</text><text x="160" y="185" font-size="11" text-anchor="middle">Azure RBAC an der Subscription</text><rect x="20" y="392" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="413" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Kosten laufen über Verknüpfungen zur Azure-Subscription.</text><text x="340" y="431" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Rechte in den beteiligten Welten sind nicht verknüpft.</text><line x1="20" y1="470" x2="58" y2="470" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 4"/><text x="66" y="474" font-size="11" text-anchor="start" style="fill:#5b6072">getrennte Welten</text><line x1="190" y1="470" x2="228" y2="470" stroke="#2f5d8a" stroke-width="2.5"/><text x="236" y="474" font-size="11" text-anchor="start" style="fill:#5b6072">Abrechnungsverknüpfung</text><text x="660" y="474" font-size="11" text-anchor="end" style="fill:#5b6072">Beispiel: Test-Tenant</text></svg>