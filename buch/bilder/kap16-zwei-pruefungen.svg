<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 315" role="img" aria-labelledby="d16-zp-title d16-zp-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d16-zp-title">Zwei Prüfungen bei jedem Zugriff</title><desc id="d16-zp-desc">Eine Anfrage auf Zeile X passiert zuerst die Privileg-Prüfung, dann die Zugriffs-Prüfung über Besitz, Rollen-Ebene, Teilen oder Hierarchie. Danach filtert die Spaltensicherheit, und erst dann steht das Ergebnis fest.</desc><defs><marker id="d16-zp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d16-zp-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d16-zp-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="120" width="115" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="62.5" y="148" font-size="12.5" text-anchor="middle" font-weight="600">Anfrage</text><text x="62.5" y="162" font-size="11" text-anchor="middle" style="fill:#5b6072">Read auf Zeile X</text><rect x="148" y="120" width="124" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="210.0" y="140" font-size="12.5" text-anchor="middle" font-weight="600">1 Privileg</text><text x="210.0" y="156" font-size="11" text-anchor="middle" style="fill:#5b6072">irgendeine Rolle</text><text x="210.0" y="170" font-size="11" text-anchor="middle" style="fill:#5b6072">mit Read?</text><rect x="300" y="36" width="164" height="230" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="382" y="58" font-size="12.5" text-anchor="middle" font-weight="600">2 Zugriff</text><text x="382" y="73" font-size="10.5" text-anchor="middle" style="fill:#5b6072">über einen dieser Wege</text><rect x="312" y="84" width="140" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="382.0" y="106" font-size="12.5" text-anchor="middle" font-weight="600">Besitz</text><rect x="312" y="128" width="140" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="382.0" y="150" font-size="12.5" text-anchor="middle" font-weight="600">Rollen-Ebene</text><rect x="312" y="172" width="140" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="382.0" y="194" font-size="12.5" text-anchor="middle" font-weight="600">Teilen</text><rect x="312" y="216" width="140" height="34" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="382.0" y="238" font-size="12.5" text-anchor="middle" font-weight="600">Hierarchie</text><rect x="490" y="120" width="92" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="536.0" y="148" font-size="12.5" text-anchor="middle" font-weight="600">Spalten-</text><text x="536.0" y="162" font-size="11" text-anchor="middle" style="fill:#5b6072">sicherheit</text><rect x="598" y="120" width="77" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="636.5" y="154" font-size="12.5" text-anchor="middle" font-weight="600">Ergebnis</text><path d="M120 150 L146 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-zp-a)"/><path d="M272 150 L298 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-zp-a)"/><path d="M464 150 L488 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-zp-a)"/><path d="M582 150 L596 150" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d16-zp-a)"/><text x="210" y="200" font-size="11" text-anchor="middle" style="fill:#5b6072">nein: abgelehnt</text><text x="340" y="300" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Ein Privileg allein reicht nicht: erst Besitz, Ebene oder Freigabe öffnen die Zeile.</text></svg>