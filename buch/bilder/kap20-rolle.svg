<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="d20-ro-title d20-ro-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d20-ro-title">Vom Berechtigungsobjekt zum Benutzer</title><desc id="d20-ro-desc">Feldwerte Buchungskreis 1000 und Aktivität 03 bilden eine Berechtigung im Objekt F_BKPF_BUK. Sie steht in einer Einzelrolle in PFCG, aus der ein Profil generiert wird. Die Einzelrolle steckt in einer Sammelrolle, die einem Benutzer im Mandanten zugeordnet ist. Darunter eine Masterrolle mit zwei abgeleiteten Rollen für die Buchungskreise 1000 und 2000.</desc><defs><marker id="d20-ro-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d20-ro-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d20-ro-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="40" width="120" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="65.0" y="62" font-size="12.5" text-anchor="middle" font-weight="600">Feldwerte</text><text x="65.0" y="78" font-size="11" text-anchor="middle" style="fill:#5b6072">Buchungskreis 1000</text><text x="65.0" y="92" font-size="11" text-anchor="middle" style="fill:#5b6072">Aktivität 03</text><rect x="140" y="40" width="125" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="202.5" y="70" font-size="12.5" text-anchor="middle" font-weight="600">F_BKPF_BUK</text><text x="202.5" y="84" font-size="11" text-anchor="middle" style="fill:#5b6072">Berechtigungsobjekt</text><rect x="280" y="40" width="125" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="342.5" y="62" font-size="12.5" text-anchor="middle" font-weight="600">Einzelrolle</text><text x="342.5" y="78" font-size="11" text-anchor="middle" style="fill:#5b6072">PFCG: Menü und</text><text x="342.5" y="92" font-size="11" text-anchor="middle" style="fill:#5b6072">Berechtigungen</text><rect x="420" y="40" width="115" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="477.5" y="70" font-size="12.5" text-anchor="middle" font-weight="600">Sammelrolle</text><text x="477.5" y="84" font-size="11" text-anchor="middle" style="fill:#5b6072">bündelt Rollen</text><rect x="550" y="40" width="125" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="612.5" y="70" font-size="12.5" text-anchor="middle" font-weight="600">Benutzer</text><text x="612.5" y="84" font-size="11" text-anchor="middle" style="fill:#5b6072">im Mandanten</text><path d="M125 72 L138 72" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><path d="M265 72 L278 72" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><path d="M405 72 L418 72" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><path d="M535 72 L548 72" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><rect x="280" y="130" width="125" height="46" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="342.5" y="150" font-size="12.5" text-anchor="middle" font-weight="600">Profil</text><text x="342.5" y="166" font-size="11" text-anchor="middle" style="fill:#5b6072">wird generiert</text><path d="M342 104 L342 128" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><rect x="30" y="222" width="200" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="130.0" y="248" font-size="12.5" text-anchor="middle" font-weight="600">Masterrolle</text><text x="130.0" y="262" font-size="11" text-anchor="middle" style="fill:#5b6072">Kreditorenbuchhaltung</text><rect x="290" y="200" width="170" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="375.0" y="220" font-size="12.5" text-anchor="middle" font-weight="600">Abgeleitete Rolle</text><text x="375.0" y="234" font-size="11" text-anchor="middle" style="fill:#5b6072">Buchungskreis 1000</text><rect x="290" y="262" width="170" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="375.0" y="282" font-size="12.5" text-anchor="middle" font-weight="600">Abgeleitete Rolle</text><text x="375.0" y="296" font-size="11" text-anchor="middle" style="fill:#5b6072">Buchungskreis 2000</text><path d="M230 242 L288 222" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><path d="M230 258 L288 284" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-ro-a)"/><text x="575" y="230" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Geprüft wird das Profil,</text><text x="575" y="246" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">dort, wo das Programm</text><text x="575" y="262" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">ausdrücklich fragt.</text></svg>