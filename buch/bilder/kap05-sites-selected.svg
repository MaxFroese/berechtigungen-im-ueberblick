<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" role="img" aria-labelledby="kap05-sites-selected-t kap05-sites-selected-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap05-sites-selected-t">Sites.Selected in zwei Schritten</title><desc id="kap05-sites-selected-d">Zeigt die zwei Schritte, mit denen eine App über Sites.Selected Zugriff auf genau eine Site erhält.</desc><defs><marker id="kap05-sites-selected-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="kap05-sites-selected-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="kap05-sites-selected-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs>
<rect x="15" y="16" width="200" height="158" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="115" y="38" text-anchor="middle" font-size="12" font-weight="600" style="fill:#2f5d8a">Schritt 1</text>
<text x="115" y="56" text-anchor="middle" font-size="13" font-weight="600">Admin Consent</text>
<text x="115" y="80" text-anchor="middle" font-size="11.5">App-Registrierung fordert</text>
<text x="115" y="96" text-anchor="middle" font-size="11.5">Sites.Selected an, ein Admin</text>
<text x="115" y="112" text-anchor="middle" font-size="11.5">erteilt Admin Consent.</text>
<text x="115" y="144" text-anchor="middle" font-size="10.5" style="fill:#2f5d8a;font-family:ui-monospace,Menlo,Consolas,monospace">roles: Sites.Selected</text>
<rect x="240" y="16" width="200" height="158" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="340" y="38" text-anchor="middle" font-size="12" font-weight="600" style="fill:#2f5d8a">Schritt 2</text>
<text x="340" y="56" text-anchor="middle" font-size="13" font-weight="600">Freigabe je Site</text>
<text x="340" y="80" text-anchor="middle" font-size="11.5">Eine berechtigte Identität</text>
<text x="340" y="96" text-anchor="middle" font-size="11.5">gibt der App eine konkrete</text>
<text x="340" y="112" text-anchor="middle" font-size="11.5">Site frei.</text>
<text x="340" y="144" text-anchor="middle" font-size="10.5" style="fill:#2f5d8a;font-family:ui-monospace,Menlo,Consolas,monospace">POST /sites/&lt;site-id&gt;</text>
<text x="340" y="159" text-anchor="middle" font-size="10.5" style="fill:#2f5d8a;font-family:ui-monospace,Menlo,Consolas,monospace">/permissions</text>
<rect x="465" y="16" width="200" height="158" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="565" y="38" text-anchor="middle" font-size="12" font-weight="600" style="fill:#2f5d8a">Ergebnis</text>
<text x="565" y="56" text-anchor="middle" font-size="13" font-weight="600">Zugriff auf genau eine Site</text>
<text x="565" y="80" text-anchor="middle" font-size="11.5">Die App hat Rechte auf</text>
<text x="565" y="96" text-anchor="middle" font-size="11.5">dieser Site, alle anderen</text>
<text x="565" y="112" text-anchor="middle" font-size="11.5">Sites bleiben gesperrt.</text>
<line x1="215" y1="95" x2="240" y2="95" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-sites-selected-a)"/>
<line x1="440" y1="95" x2="465" y2="95" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-sites-selected-a)"/>
