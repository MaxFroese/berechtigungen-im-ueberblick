<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img" aria-labelledby="d17-wv-title d17-wv-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d17-wv-title">Wessen Verbindung ein Flow benutzt</title><desc id="d17-wv-desc">Person A ohne Leserecht startet einen Flow. Mit der Verbindung von Besitzer B gelingt das Lesen, A sieht den Inhalt, und im Protokoll steht B. Mit der eigenen Verbindung von A scheitert das Lesen, und im Protokoll steht A.</desc><defs><marker id="d17-wv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d17-wv-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d17-wv-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="5" y="130" width="135" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="72.5" y="152" font-size="12.5" text-anchor="middle" font-weight="600">Person A</text><text x="72.5" y="168" font-size="11" text-anchor="middle" style="fill:#5b6072">darf Bibliothek</text><text x="72.5" y="182" font-size="11" text-anchor="middle" style="fill:#5b6072">nicht lesen</text><rect x="170" y="130" width="110" height="64" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="225.0" y="160" font-size="12.5" text-anchor="middle" font-weight="600">Flow</text><text x="225.0" y="174" font-size="11" text-anchor="middle" style="fill:#5b6072">wird gestartet</text><rect x="320" y="40" width="180" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="410.0" y="68" font-size="12.5" text-anchor="middle" font-weight="600">Verbindung von B</text><text x="410.0" y="82" font-size="11" text-anchor="middle" style="fill:#5b6072">Besitzer, darf lesen</text><rect x="320" y="224" width="180" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="410.0" y="252" font-size="12.5" text-anchor="middle" font-weight="600">Verbindung von A</text><text x="410.0" y="266" font-size="11" text-anchor="middle" style="fill:#5b6072">vom ausführenden Nutzer</text><rect x="530" y="40" width="145" height="60" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="602.5" y="60" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Lesen gelingt</text><text x="602.5" y="76" font-size="11" text-anchor="middle" style="fill:#5b6072">A sieht den Inhalt</text><text x="602.5" y="90" font-size="11" text-anchor="middle" style="fill:#5b6072">Protokoll: B</text><rect x="530" y="224" width="145" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="602.5" y="252" font-size="12.5" text-anchor="middle" font-weight="600">Lesen scheitert</text><text x="602.5" y="266" font-size="11" text-anchor="middle" style="fill:#5b6072">Protokoll: A</text><path d="M140 162 L168 162" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d17-wv-a)"/><path d="M280 152 L318 72" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d17-wv-r)"/><path d="M280 172 L318 252" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d17-wv-a)"/><path d="M500 70 L528 70" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d17-wv-r)"/><path d="M500 254 L528 254" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d17-wv-a)"/><text x="410" y="28" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">„Diese Verbindung verwenden“</text><text x="410" y="302" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">„Vom ausführenden Nutzer bereitgestellt“</text><text x="340" y="330" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Identität steckt in der Verbindung, nicht im Flow.</text></svg>