<svg viewBox="0 0 680 672" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap10-weg-zur-freigabe-t kap10-weg-zur-freigabe-d" id="kap10-weg-zur-freigabe" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap10-weg-zur-freigabe-t">Elf Schritte vom Test-Tenant zur Freigabe</title><desc id="kap10-weg-zur-freigabe-d">Elf Schritte laufen von oben nach unten vom Test-Tenant bis zum abgeschlossenen Auswertungslauf. Bei Schritt 2 und 4 kann der Weg enden, bei Schritt 5 und 8 scheiden nur einzelne Projekte aus, und der Lauf geht weiter. Eine Linie zwischen Schritt 9 und 10 markiert, dass erst ab Schritt 10 Kundendaten ans Modell gehen.</desc><defs><marker id="kap10-weg-zur-freigabe-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap10-weg-zur-freigabe-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap10-weg-zur-freigabe-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="205" y="22" font-size="11" text-anchor="middle" style="fill:#5b6072">Start im Test-Tenant</text><line x1="205" y1="70" x2="205" y2="85" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="122" x2="205" y2="137" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="174" x2="205" y2="189" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="226" x2="205" y2="241" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="278" x2="205" y2="293" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="330" x2="205" y2="345" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="382" x2="205" y2="397" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="434" x2="205" y2="449" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-a)"/><line x1="205" y1="486" x2="205" y2="521" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-h)"/><line x1="205" y1="558" x2="205" y2="573" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-h)"/><rect x="30" y="34" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="52" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="56" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">1</text><text x="72" y="56" font-size="12.5">Nutzen und Datenfluss beschreiben</text><rect x="30" y="86" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="104" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="108" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">2</text><text x="72" y="108" font-size="12.5">Tarif und Vertrag klären</text><rect x="30" y="138" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="156" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="160" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">3</text><text x="72" y="160" font-size="12.5">Projektliste ohne Inhalte, Datenarten vermutet</text><rect x="30" y="190" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="208" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="212" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">4</text><text x="72" y="212" font-size="12.5">Datenschutz prüft</text><rect x="30" y="242" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="260" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="264" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">5</text><text x="72" y="264" font-size="12.5">Verträge je Projekt prüfen</text><rect x="30" y="294" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="312" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="316" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">6</text><text x="72" y="316" font-size="12.5">Probelauf mit erfundenen, dann internen Daten</text><rect x="30" y="346" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="364" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="368" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">7</text><text x="72" y="368" font-size="12.5">Kunden anfragen, falls nötig</text><rect x="30" y="398" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="416" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="420" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">8</text><text x="72" y="420" font-size="12.5">Kundenantwort abwarten</text><rect x="30" y="450" width="350" height="36" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><circle cx="52" cy="468" r="12" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="52" y="472" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">9</text><text x="72" y="472" font-size="12.5">Schriftliche Freigabe</text><rect x="30" y="522" width="350" height="36" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><circle cx="52" cy="540" r="12" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="52" y="544" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">10</text><text x="72" y="544" font-size="12.5">Lauf über freigegebene Kopie</text><rect x="30" y="574" width="350" height="36" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><circle cx="52" cy="592" r="12" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="52" y="596" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">11</text><text x="72" y="596" font-size="12.5">Ergebnis prüfen, aufräumen, dokumentieren</text><line x1="380" y1="104" x2="428" y2="104" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-h)"/><rect x="430" y="86" width="230" height="36" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="545" y="108" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:#b8472a">Stopp ohne Firmenvertrag</text><line x1="380" y1="208" x2="428" y2="208" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-h)"/><rect x="430" y="190" width="230" height="36" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="545" y="212" font-size="11.5" font-weight="600" text-anchor="middle" style="fill:#b8472a">Stopp oder Auflagen</text><line x1="380" y1="260" x2="428" y2="260" stroke="#5b6072" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-m)"/><rect x="430" y="242" width="230" height="36" rx="8" fill="#ffffff" stroke="#5b6072" stroke-width="1.5"/><text x="545" y="257" font-size="11" text-anchor="middle">Projekt scheidet aus oder wird für</text><text x="545" y="271" font-size="11" text-anchor="middle">die Kundenanfrage vorgemerkt</text><line x1="380" y1="416" x2="428" y2="416" stroke="#5b6072" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-m)"/><rect x="430" y="398" width="230" height="36" rx="8" fill="#ffffff" stroke="#5b6072" stroke-width="1.5"/><text x="545" y="413" font-size="11" text-anchor="middle">Ohne Zustimmung scheidet</text><text x="545" y="427" font-size="11" text-anchor="middle">das Projekt aus</text><text x="392" y="309" font-size="11" style="fill:#5b6072">Voraussetzung für interne Daten:</text><text x="392" y="323" font-size="11" style="fill:#5b6072">Zustimmung, Business-Tarif</text><line x1="20" y1="502" x2="660" y2="502" stroke="#b8472a" stroke-width="2" stroke-dasharray="7 5"/><text x="660" y="495" font-size="12" text-anchor="end" style="fill:#5b6072">Bis hier keine Kundendaten am Modell</text><text x="660" y="519" font-size="12" font-weight="600" text-anchor="end" style="fill:#b8472a">Erst ab hier Kundendaten am Modell</text><line x1="20" y1="634" x2="50" y2="634" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-h)"/><text x="58" y="638" class="legend-text">Der Weg endet hier oder läuft nur mit Auflagen weiter</text><line x1="20" y1="654" x2="50" y2="654" stroke="#5b6072" stroke-width="2" marker-end="url(#kap10-weg-zur-freigabe-m)"/><text x="58" y="658" class="legend-text">Einzelnes Projekt scheidet aus, der Lauf geht ohne es weiter</text></svg>