<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" width="680" height="375" role="img" aria-labelledby="k2-title k2-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="k2-title">Vererbung über den Scope (Azure)</title><desc id="k2-desc">Management Group, Subscription, Resource Group und Ressource stehen untereinander. Eine Rollenzuweisung Reader setzt auf der Subscription an und wirkt nach unten auf Resource Group und Ressource. Die Management Group darüber ist nicht betroffen.</desc><defs><marker id="k2-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="k2-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="k2-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs>
<line x1="200" y1="86" x2="200" y2="120" stroke="#5b6072" stroke-width="1.2"/>
<rect x="60" y="30" width="280" height="56" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="200" y="63" text-anchor="middle" font-size="14" font-weight="600">Management Group</text>
<text x="358" y="54" text-anchor="start" font-size="12" style="fill:#5b6072">Nicht betroffen: liegt über dem</text>
<text x="358" y="71" text-anchor="start" font-size="12" style="fill:#5b6072">gewählten Scope (Azure)</text>
<rect x="60" y="120" width="280" height="56" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/>
<text x="200" y="143" text-anchor="middle" font-size="14" font-weight="600">Subscription</text>
<text x="200" y="162" text-anchor="middle" font-size="11" style="fill:#b8472a">gewählter Scope (Azure)</text>
<rect x="60" y="210" width="280" height="56" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/>
<text x="200" y="243" text-anchor="middle" font-size="14" font-weight="600">Resource Group</text>
<rect x="60" y="300" width="280" height="56" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/>
<text x="200" y="333" text-anchor="middle" font-size="14" font-weight="600">Ressource</text>
<line x1="200" y1="176" x2="200" y2="209" stroke="#b8472a" stroke-width="2" marker-end="url(#k2-r)"/>
<text x="212" y="197" text-anchor="start" font-size="12" style="fill:#b8472a">wird vererbt</text>
<line x1="200" y1="266" x2="200" y2="299" stroke="#b8472a" stroke-width="2" marker-end="url(#k2-r)"/>
<text x="212" y="287" text-anchor="start" font-size="12" style="fill:#b8472a">wird vererbt</text>
<rect x="450" y="120" width="210" height="56" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/>
<text x="555" y="143" text-anchor="middle" font-size="14" font-weight="600">Rollenzuweisung</text>
<text x="555" y="162" text-anchor="middle" font-size="12">Reader auf der Subscription</text>
<line x1="450" y1="148" x2="342" y2="148" stroke="#b8472a" stroke-width="2" marker-end="url(#k2-r)"/>
<text x="396" y="140" text-anchor="middle" font-size="12" style="fill:#b8472a">setzt hier an</text>
<path d="M350 210 H362 V356 H350" fill="none" stroke="#b8472a" stroke-width="1.6"/>
<text x="374" y="279" text-anchor="start" font-size="12" style="fill:#b8472a">Reader gilt auch hier,</text>
<text x="374" y="296" text-anchor="start" font-size="12" style="fill:#b8472a">ohne eigene Zuweisung</text>
</svg>