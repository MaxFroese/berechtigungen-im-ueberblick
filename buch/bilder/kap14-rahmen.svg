<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" aria-labelledby="d14-rh-title d14-rh-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d14-rh-title">Rahmen für KI-Versuche im Tenant der Firma</title><desc id="d14-rh-desc">Im Tenant der Firma liegt ein hervorgehobener Rahmen mit Entwicklungsumgebung (Environment Maker, eigene DLP-Richtlinie), Resource Group rg-ki-test (Contributor, Budget mit Alarm), vom Dienstleister angelegten App-Registrierungen mit Admin Consent pro App und Regeln für Agenten. Außerhalb liegen Standardumgebung, produktive Subscription und Firmendaten, erreichbar nur über eine neue Freigabe.</desc><defs><marker id="d14-rh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d14-rh-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d14-rh-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="10" width="660" height="400" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="34" font-size="14" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Tenant der Firma</text><rect x="30" y="50" width="400" height="310" rx="6" fill="#d9e4ef" fill-opacity="0.35" stroke="#2f5d8a" stroke-width="2.5"/><text x="46" y="74" font-size="13" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Rahmen für KI-Versuche</text><rect x="45" y="88" width="180" height="90" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="135.0" y="124" font-size="12.5" text-anchor="middle" font-weight="600">Umgebung Entwicklung</text><text x="135.0" y="138" font-size="11" text-anchor="middle" style="fill:#5b6072">Environment Maker</text><text x="135.0" y="152" font-size="11" text-anchor="middle" style="fill:#5b6072">eigene DLP-Richtlinie</text><rect x="235" y="88" width="180" height="90" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="325.0" y="124" font-size="12.5" text-anchor="middle" font-weight="600">rg-ki-test</text><text x="325.0" y="138" font-size="11" text-anchor="middle" style="fill:#5b6072">Contributor</text><text x="325.0" y="152" font-size="11" text-anchor="middle" style="fill:#5b6072">Budget mit Alarm</text><rect x="45" y="190" width="180" height="90" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="135.0" y="226" font-size="12.5" text-anchor="middle" font-weight="600">App-Registrierungen</text><text x="135.0" y="240" font-size="11" text-anchor="middle" style="fill:#5b6072">vom Dienstleister angelegt</text><text x="135.0" y="254" font-size="11" text-anchor="middle" style="fill:#5b6072">Admin Consent pro App</text><rect x="235" y="190" width="180" height="90" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="325.0" y="226" font-size="12.5" text-anchor="middle" font-weight="600">Regeln für Agenten</text><text x="325.0" y="240" font-size="11" text-anchor="middle" style="fill:#5b6072">wer veröffentlicht,</text><text x="325.0" y="254" font-size="11" text-anchor="middle" style="fill:#5b6072">für wen, welche Quellen</text><text x="230" y="310" font-size="11.5" text-anchor="middle" font-weight="600">Die bauende Person arbeitet hier</text><text x="230" y="326" font-size="11.5" text-anchor="middle" font-weight="600">ohne Einzelanfragen.</text><text x="560" y="74" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">außerhalb des Rahmens</text><rect x="460" y="88" width="200" height="50" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="560.0" y="110" font-size="12.5" text-anchor="middle" font-weight="600">Standardumgebung</text><text x="560.0" y="126" font-size="11" text-anchor="middle" style="fill:#5b6072">Power Platform</text><rect x="460" y="150" width="200" height="50" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="560.0" y="172" font-size="12.5" text-anchor="middle" font-weight="600">Produktive Subscription</text><text x="560.0" y="188" font-size="11" text-anchor="middle" style="fill:#5b6072">Azure</text><rect x="460" y="212" width="200" height="50" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="560.0" y="234" font-size="12.5" text-anchor="middle" font-weight="600">Firmendaten</text><text x="560.0" y="250" font-size="11" text-anchor="middle" style="fill:#5b6072">SharePoint, Teams, Mail</text><path d="M432 237 L458 237" fill="none" stroke="#b8472a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d14-rh-r)"/><text x="560" y="290" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">erreichbar nur über</text><text x="560" y="306" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">eine neue Freigabe</text><text x="340" y="388" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Der Dienstleister öffnet und bewacht den Rahmen; er baut nicht mit.</text></svg>