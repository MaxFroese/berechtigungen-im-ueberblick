<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" role="img" aria-labelledby="kap06-lokale-reichweite-t kap06-lokale-reichweite-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap06-lokale-reichweite-t">Lokale Reichweite der Programme eines Nutzers</title><desc id="kap06-lokale-reichweite-d">Im Betriebssystem-Konto auf dem Laptop laufen Terminal, lokales Skript, Paket aus einer Abhängigkeit und KI-Agent. Keine Grenze trennt sie: Alle erreichen Token-Cache, MSAL-Cache, Keychain, .env-Dateien und OneDrive-Ordner, und die Tokens führen zu Azure und zur Graph API. Als Gegenbeispiel sieht ein KI-Agent im Container nur den Projektordner.</desc><defs><marker id="kap06-lokale-reichweite-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="kap06-lokale-reichweite-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8472a"/></marker><marker id="kap06-lokale-reichweite-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6072"/></marker></defs><rect x="12" y="12" width="484" height="264" rx="10" fill="none" stroke="#b8472a" stroke-width="2.5"/><text x="26" y="34" font-size="13" text-anchor="start" font-weight="600" style="fill:#b8472a">Laptop: Betriebssystem-Konto des Nutzers</text><rect x="26" y="46" width="108" height="46" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="80.0" y="65.7" font-size="12" text-anchor="middle">Terminal des</text><text x="80.0" y="80.7" font-size="12" text-anchor="middle">Menschen</text><polyline points="80,92 80,116" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="142" y="46" width="108" height="46" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="196.0" y="65.7" font-size="12" text-anchor="middle">Lokales</text><text x="196.0" y="80.7" font-size="12" text-anchor="middle">Skript</text><polyline points="196,92 196,116" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="258" y="46" width="108" height="46" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="312.0" y="65.7" font-size="12" text-anchor="middle">Paket aus</text><text x="312.0" y="80.7" font-size="12" text-anchor="middle">Abhängigkeit</text><polyline points="312,92 312,116" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="374" y="46" width="108" height="46" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="428.0" y="73.2" font-size="12" text-anchor="middle">KI-Agent</text><polyline points="428,92 428,116" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="26" y="116" width="456" height="30" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1.5"/><text x="254.0" y="135.2" font-size="12" text-anchor="middle" font-weight="600">Keine Grenze zwischen den Programmen: gleicher Zugriff für alle</text><polyline points="69,146 69,170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="26" y="170" width="86" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="69.0" y="189.8" font-size="11.5" text-anchor="middle">Token-Cache</text><text x="69.0" y="204.2" font-size="11.5" text-anchor="middle">in ~/.azure</text><polyline points="161.5,146 161.5,170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="118.5" y="170" width="86" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="161.5" y="189.8" font-size="11.5" text-anchor="middle">MSAL-</text><text x="161.5" y="204.2" font-size="11.5" text-anchor="middle">Cache</text><polyline points="254.0,146 254.0,170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="211.0" y="170" width="86" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="254.0" y="197.0" font-size="11.5" text-anchor="middle">Keychain</text><polyline points="346.5,146 346.5,170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="303.5" y="170" width="86" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="346.5" y="197.0" font-size="11.5" text-anchor="middle">.env</text><polyline points="439.0,146 439.0,170" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="396.0" y="170" width="86" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="439.0" y="189.8" font-size="11.5" text-anchor="middle">OneDrive-</text><text x="439.0" y="204.2" font-size="11.5" text-anchor="middle">Ordner</text><line x1="69" y1="216" x2="69" y2="262" stroke="#2f5d8a" stroke-width="1.5"/><line x1="161.5" y1="216" x2="161.5" y2="262" stroke="#2f5d8a" stroke-width="1.5"/><line x1="69" y1="262" x2="518" y2="262" stroke="#2f5d8a" stroke-width="1.5"/><text x="176" y="254" font-size="11.5" text-anchor="start">Tokens führen über das Konto hinaus in die Cloud</text><line x1="518" y1="262" x2="518" y2="88" stroke="#2f5d8a" stroke-width="1.5"/><polyline points="518,88 548,88" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><polyline points="518,152 548,152" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><text x="606" y="50" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#5b6072">Cloud-Dienste</text><rect x="548" y="62" width="116" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="606.0" y="92.5" font-size="13" text-anchor="middle">Azure</text><rect x="548" y="126" width="116" height="52" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="606.0" y="156.6" font-size="13" text-anchor="middle">Graph API</text><rect x="12" y="298" width="484" height="94" rx="10" fill="none" stroke="#b8472a" stroke-width="2.5"/><text x="26" y="320" font-size="13" text-anchor="start" font-weight="600" style="fill:#b8472a">Gegenbeispiel: Container</text><rect x="26" y="332" width="108" height="46" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="80.0" y="359.2" font-size="12" text-anchor="middle">KI-Agent</text><polyline points="134,355 172,355" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#kap06-lokale-reichweite-a)"/><rect x="172" y="332" width="104" height="46" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="224.0" y="351.8" font-size="11.5" text-anchor="middle">Nur der</text><text x="224.0" y="366.2" font-size="11.5" text-anchor="middle">Projektordner</text><text x="292" y="351" font-size="12" text-anchor="start" style="fill:#5b6072">~/.azure und OneDrive</text><text x="292" y="367" font-size="12" text-anchor="start" style="fill:#5b6072">sind hier nicht erreichbar</text><rect x="512" y="304" width="22" height="12" rx="3" fill="none" stroke="#b8472a" stroke-width="2.5"/><text x="512" y="334" class="legend-text" text-anchor="start">Rot: die wirksame Grenze,</text><text x="512" y="349" class="legend-text" text-anchor="start">also Konto und Umgebung</text></svg>