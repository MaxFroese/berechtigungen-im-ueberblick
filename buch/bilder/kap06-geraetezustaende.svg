<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" role="img" aria-labelledby="kap06-geraetezustaende-t kap06-geraetezustaende-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap06-geraetezustaende-t">Drei Gerätezustände im Vergleich</title><desc id="kap06-geraetezustaende-d">Tabelle mit den Spalten Entra Join, Entra-Registrierung und nicht verbunden. Die Anmeldung mit dem Firmenkonto ist in allen drei Fällen möglich. Hervorgehoben sind die Zeilen Besitz (Firma, privat, unbekannt) und belegbare Geräteidentität (ja, ja, nein). Weitere Zeilen: Anmeldung am Betriebssystem, Geräteobjekt im Tenant und typische Verwaltung durch Intune.</desc><defs><marker id="kap06-geraetezustaende-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="kap06-geraetezustaende-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8472a"/></marker><marker id="kap06-geraetezustaende-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6072"/></marker></defs><rect x="194" y="14" width="150" height="38" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="269.0" y="37.5" font-size="13" text-anchor="middle" font-weight="600">Entra Join</text><rect x="352" y="14" width="150" height="38" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="427.0" y="37.5" font-size="13" text-anchor="middle" font-weight="600">Entra-Registrierung</text><rect x="510" y="14" width="150" height="38" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="585.0" y="37.5" font-size="13" text-anchor="middle" font-weight="600">Nicht verbunden</text><text x="16" y="74" font-size="12" text-anchor="start" font-weight="600">Anmeldung mit dem</text><text x="16" y="89" font-size="12" text-anchor="start" font-weight="600">Firmenkonto</text><rect x="194" y="62" width="466" height="34" rx="8" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1.5"/><text x="427.0" y="83.5" font-size="13" text-anchor="middle" font-weight="600">In allen drei Fällen möglich</text><rect x="8" y="108" width="660" height="40" rx="6" fill="none" stroke="#b8472a" stroke-width="2"/><text x="16" y="132.0" font-size="12" text-anchor="start" font-weight="600">Besitz</text><text x="269.0" y="132.5" font-size="12.5" text-anchor="middle" font-weight="600">Firma</text><text x="427.0" y="132.5" font-size="12.5" text-anchor="middle" font-weight="600">privat</text><text x="585.0" y="132.5" font-size="12.5" text-anchor="middle" font-weight="600">unbekannt</text><line x1="16" y1="197" x2="660" y2="197" stroke="#c8ccd6" stroke-width="1"/><text x="16" y="170.5" font-size="12" text-anchor="start">Anmeldung am</text><text x="16" y="185.5" font-size="12" text-anchor="start">Betriebssystem</text><text x="269.0" y="178.5" font-size="12.5" text-anchor="middle">Entra-Konto</text><text x="427.0" y="178.5" font-size="12.5" text-anchor="middle">privates Konto</text><text x="585.0" y="178.5" font-size="12.5" text-anchor="middle">privates Konto</text><line x1="16" y1="243" x2="660" y2="243" stroke="#c8ccd6" stroke-width="1"/><text x="16" y="224.0" font-size="12" text-anchor="start">Geräteobjekt im Tenant</text><text x="269.0" y="224.5" font-size="12.5" text-anchor="middle">ja</text><text x="427.0" y="224.5" font-size="12.5" text-anchor="middle">ja</text><text x="585.0" y="224.5" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">nein</text><rect x="8" y="246" width="660" height="40" rx="6" fill="none" stroke="#b8472a" stroke-width="2"/><text x="16" y="262.5" font-size="12" text-anchor="start" font-weight="600">Belegbare Geräteidentität</text><text x="16" y="277.5" font-size="12" text-anchor="start" font-weight="600">bei der Anmeldung</text><text x="269.0" y="270.5" font-size="12.5" text-anchor="middle" font-weight="600">ja</text><text x="427.0" y="270.5" font-size="12.5" text-anchor="middle" font-weight="600">ja</text><text x="585.0" y="270.5" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">nein</text><line x1="16" y1="335" x2="660" y2="335" stroke="#c8ccd6" stroke-width="1"/><text x="16" y="308.5" font-size="12" text-anchor="start">Typische Verwaltung</text><text x="16" y="323.5" font-size="12" text-anchor="start">durch Intune</text><text x="269.0" y="316.5" font-size="12.5" text-anchor="middle">voll</text><text x="427.0" y="309.0" font-size="12.5" text-anchor="middle">optional oder</text><text x="427.0" y="324.0" font-size="12.5" text-anchor="middle">nur App-bezogen</text><text x="585.0" y="316.5" font-size="12.5" text-anchor="middle">keine</text><rect x="16" y="344" width="22" height="12" rx="3" fill="none" stroke="#b8472a" stroke-width="2"/><text x="46" y="354" class="legend-text" text-anchor="start">Rot umrandet: Hier liegt der Unterschied, also wem das Gerät gehört und ob Entra ID seine Identität prüfen kann.</text></svg>