<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 562" role="img" aria-labelledby="d11-hi-title d11-hi-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d11-hi-title">Abrechnungshierarchie unter einer MCA</title><desc id="d11-hi-desc">Unter einer Microsoft Customer Agreement liegen Rechnungskonto, Rechnungsprofil und Rechnungsabschnitt untereinander, darunter die Abos. Auf jeder Ebene gibt es eigene Abrechnungsrollen. Entra-Rollen werden auf das Rechnungskonto abgebildet, wirken im Checkout aber nicht immer.</desc><defs><marker id="d11-hi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d11-hi-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d11-hi-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><rect x="10" y="70" width="660" height="410" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="660" y="92" font-size="11.5" text-anchor="end" font-weight="600" style="fill:#5b6072">Microsoft Customer Agreement (MCA)</text><rect x="30" y="16" width="150" height="34" rx="4" fill="#ffffff" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="5 4"/><text x="105" y="38" font-size="12.5" text-anchor="middle" font-weight="600">Entra-Rollen</text><path d="M105 50 L105 108" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d11-hi-l)"/><text x="115" y="82" font-size="11" text-anchor="start" style="fill:#b8472a">abgebildet, im Checkout</text><text x="115" y="96" font-size="11" text-anchor="start" style="fill:#b8472a">nicht immer wirksam</text><rect x="40" y="110" width="270" height="66" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="131" font-size="13" text-anchor="middle" font-weight="600">Rechnungskonto</text><text x="175" y="148" font-size="11.5" text-anchor="middle" style="fill:#5b6072">Billing account</text><text x="175" y="164" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">der Vertrag, Unterschriftsrecht</text><line x1="310" y1="143" x2="390" y2="143" stroke="#5b6072" stroke-width="1.5"/><text x="350" y="137" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen</text><rect x="390" y="110" width="270" height="66" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="405" y="129" font-size="11.5" text-anchor="start">Billing account owner</text><text x="405" y="146" font-size="11.5" text-anchor="start">Billing account contributor</text><text x="405" y="163" font-size="11.5" text-anchor="start">Billing account reader</text><line x1="175" y1="176" x2="175" y2="210" stroke="#2f5d8a" stroke-width="1.5"/><rect x="40" y="210" width="270" height="66" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="231" font-size="13" text-anchor="middle" font-weight="600">Rechnungsprofil</text><text x="175" y="248" font-size="11.5" text-anchor="middle" style="fill:#5b6072">Billing profile</text><text x="175" y="264" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">eine Rechnung, ein Zahlungsmittel</text><line x1="310" y1="243" x2="390" y2="243" stroke="#5b6072" stroke-width="1.5"/><text x="350" y="237" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen</text><rect x="390" y="210" width="270" height="66" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="405" y="229" font-size="11.5" text-anchor="start">Billing profile owner</text><text x="405" y="246" font-size="11.5" text-anchor="start">Billing profile contributor, reader</text><text x="405" y="263" font-size="11.5" text-anchor="start">Invoice manager</text><line x1="175" y1="276" x2="175" y2="310" stroke="#2f5d8a" stroke-width="1.5"/><rect x="40" y="310" width="270" height="66" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="175" y="331" font-size="13" text-anchor="middle" font-weight="600">Rechnungsabschnitt</text><text x="175" y="348" font-size="11.5" text-anchor="middle" style="fill:#5b6072">Invoice section</text><text x="175" y="364" font-size="11.5" text-anchor="middle" style="fill:#2f5d8a">gruppiert Kosten</text><line x1="310" y1="343" x2="390" y2="343" stroke="#5b6072" stroke-width="1.5"/><text x="350" y="337" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen</text><rect x="390" y="310" width="270" height="66" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="405" y="329" font-size="11.5" text-anchor="start">Invoice section owner</text><text x="405" y="346" font-size="11.5" text-anchor="start">Invoice section contributor, reader</text><text x="405" y="363" font-size="11.5" text-anchor="start">Azure subscription creator</text><line x1="175" y1="376" x2="67" y2="410" stroke="#2f5d8a" stroke-width="1.5"/><line x1="175" y1="376" x2="172" y2="410" stroke="#2f5d8a" stroke-width="1.5"/><line x1="175" y1="376" x2="290" y2="410" stroke="#2f5d8a" stroke-width="1.5"/><rect x="20" y="410" width="95" height="40" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/><text x="67" y="434" font-size="11" text-anchor="middle">M365-Produkt</text><rect x="125" y="410" width="95" height="40" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/><text x="172" y="434" font-size="11" text-anchor="middle">M365-Produkt</text><rect x="230" y="410" width="120" height="40" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1" stroke-dasharray="4 3"/><text x="290" y="426" font-size="11" text-anchor="middle">Azure-Subscription</text><text x="290" y="441" font-size="11" text-anchor="middle" style="fill:#5b6072">(optional)</text><text x="185" y="468" font-size="11" text-anchor="middle" style="fill:#5b6072">Abos, je einem Rechnungsabschnitt zugeordnet</text><rect x="20" y="494" width="640" height="52" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="515" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Abrechnung hat eine eigene Hierarchie mit eigenen Rollen.</text><text x="340" y="533" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Ebene der Rolle entscheidet: kaufen, bezahlen oder unterschreiben.</text></svg>