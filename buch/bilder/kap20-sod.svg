<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 335" role="img" aria-labelledby="d20-sd-title d20-sd-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d20-sd-title">Funktionstrennung</title><desc id="d20-sd-desc">Links hat Person A die Rechte Lieferant anlegen und Zahlung freigeben und kann damit an sich selbst zahlen. Rechts sind die Rechte auf Person A und Person B verteilt, es gibt keinen Konflikt. Darunter: Ein Regelwerk in GRC oder IAG warnt schon vor der Zuordnung.</desc><defs><marker id="d20-sd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d20-sd-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d20-sd-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="170" y="28" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Eine Person</text><text x="510" y="28" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Getrennt</text><rect x="10" y="40" width="320" height="222" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><rect x="350" y="40" width="320" height="222" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><rect x="100" y="60" width="140" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="170.0" y="86" font-size="12.5" text-anchor="middle" font-weight="600">Person A</text><rect x="25" y="140" width="140" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="95.0" y="170" font-size="12.5" text-anchor="middle" font-weight="600">Lieferant anlegen</text><rect x="175" y="140" width="140" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="245.0" y="170" font-size="12.5" text-anchor="middle" font-weight="600">Zahlung freigeben</text><path d="M150 104 L95 138" fill="none" stroke="#5b6072" stroke-width="1.5"/><path d="M190 104 L245 138" fill="none" stroke="#5b6072" stroke-width="1.5"/><rect x="25" y="210" width="290" height="38" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="170.0" y="234" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">kann an sich selbst zahlen</text><rect x="370" y="60" width="135" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="437.5" y="86" font-size="12.5" text-anchor="middle" font-weight="600">Person A</text><rect x="515" y="60" width="135" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="582.5" y="86" font-size="12.5" text-anchor="middle" font-weight="600">Person B</text><rect x="370" y="140" width="135" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="437.5" y="170" font-size="12.5" text-anchor="middle" font-weight="600">Lieferant anlegen</text><rect x="515" y="140" width="135" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="582.5" y="170" font-size="12.5" text-anchor="middle" font-weight="600">Zahlung freigeben</text><path d="M437 104 L437 138" fill="none" stroke="#5b6072" stroke-width="1.5"/><path d="M582 104 L582 138" fill="none" stroke="#5b6072" stroke-width="1.5"/><rect x="370" y="210" width="280" height="38" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="510.0" y="234" font-size="12.5" text-anchor="middle" font-weight="600">kein Konflikt</text><rect x="100" y="282" width="480" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="306" font-size="12.5" text-anchor="middle" font-weight="600">Ein Regelwerk in GRC oder IAG warnt schon vor der Zuordnung.</text></svg>