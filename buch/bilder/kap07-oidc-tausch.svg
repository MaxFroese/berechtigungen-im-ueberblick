<svg viewBox="0 0 680 664" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-t d3-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d3-t">OIDC-Tausch vom Runner bis zum App Service</title><desc id="d3-d">Sequenz: Der Runner fordert beim GitHub-OIDC-Dienst ein Token an und erhält ein signiertes OIDC-Token. Entra ID prüft beim Tausch Signatur, Issuer, Subject und Audience gegen das Federated Credential und stellt ein Access Token für die Azure-Verwaltung aus. Beim Deployment-Aufruf prüft Azure die Rollenzuweisung und rollt auf den App Service aus. GitHub liefert nur den Herkunftsnachweis, entschieden wird zweimal auf Microsoft-Seite.</desc><defs><marker id="d3-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d3-r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d3-m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><line x1="55" y1="80" x2="55" y2="628" stroke="#5b6072" stroke-width="1" stroke-dasharray="2 4"/><line x1="185" y1="80" x2="185" y2="628" stroke="#5b6072" stroke-width="1" stroke-dasharray="2 4"/><line x1="360" y1="80" x2="360" y2="628" stroke="#5b6072" stroke-width="1" stroke-dasharray="2 4"/><line x1="510" y1="80" x2="510" y2="628" stroke="#5b6072" stroke-width="1" stroke-dasharray="2 4"/><line x1="625" y1="80" x2="625" y2="628" stroke="#5b6072" stroke-width="1" stroke-dasharray="2 4"/><line x1="258" y1="8" x2="258" y2="628" stroke="#5b6072" stroke-width="1.4" stroke-dasharray="6 5"/><text x="250" y="22" text-anchor="end" font-size="12" font-weight="600" style="fill:#2f5d8a">GitHub: nur Herkunftsnachweis</text><text x="266" y="22" text-anchor="start" font-size="12" font-weight="600" style="fill:#b8472a">Microsoft-Seite: zwei Entscheidungen</text><circle cx="55" cy="80" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="55" y="84.3" text-anchor="middle" font-size="12">Runner</text><circle cx="185" cy="80" r="46" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="185" y="77.1" text-anchor="middle" font-size="11.5">GitHub-</text><text x="185" y="91.1" text-anchor="middle" font-size="11.5">OIDC-Dienst</text><circle cx="360" cy="80" r="46" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="360" y="70.1" text-anchor="middle" font-size="11.5">Entra ID</text><text x="360" y="84.1" text-anchor="middle" font-size="11.5">mit Federated</text><text x="360" y="98.1" text-anchor="middle" font-size="11.5">Credential</text><circle cx="510" cy="80" r="46" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="510" y="70.1" text-anchor="middle" font-size="11.5">Azure-</text><text x="510" y="84.1" text-anchor="middle" font-size="11.5">Verwaltungs-</text><text x="510" y="98.1" text-anchor="middle" font-size="11.5">schnittstelle</text><circle cx="625" cy="80" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.8"/><text x="625" y="84.1" text-anchor="middle" font-size="11.5">App Service</text><text x="120" y="167" text-anchor="middle" font-size="11">Token anfordern</text><line x1="55" y1="175" x2="185" y2="175" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><text x="120" y="204" text-anchor="middle" font-size="11">signiertes</text><text x="120" y="219" text-anchor="middle" font-size="11">OIDC-Token</text><line x1="185" y1="226" x2="55" y2="226" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><text x="120" y="259" text-anchor="middle" font-size="11">Tausch: OIDC-Token</text><text x="120" y="274" text-anchor="middle" font-size="11">an Entra ID</text><line x1="55" y1="281" x2="360" y2="281" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><rect x="268" y="298" width="184" height="86" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="360" y="317" text-anchor="middle" font-size="11" font-weight="700" style="fill:#b8472a">Entscheidung 1: Vertrauensregel</text><text x="360" y="334" text-anchor="middle" font-size="11">Prüfung von Signatur und</text><text x="360" y="350" text-anchor="middle" font-size="11">Issuer, Subject, Audience</text><text x="360" y="372" text-anchor="middle" font-size="10.5" style="fill:#5b6072">Wer darf die Identität annehmen?</text><text x="120" y="413" text-anchor="middle" font-size="11">Access Token für</text><text x="120" y="428" text-anchor="middle" font-size="11">die Azure-Verwaltung</text><line x1="360" y1="435" x2="55" y2="435" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><text x="120" y="472" text-anchor="middle" font-size="11">Deployment-Aufruf</text><text x="120" y="487" text-anchor="middle" font-size="11">mit Access Token</text><line x1="55" y1="494" x2="510" y2="494" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><rect x="420" y="510" width="180" height="70" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="510" y="529" text-anchor="middle" font-size="11" font-weight="700" style="fill:#b8472a">Entscheidung 2: Rollen</text><text x="510" y="546" text-anchor="middle" font-size="11">Prüfung der Rollenzuweisung</text><text x="510" y="566" text-anchor="middle" font-size="10.5" style="fill:#5b6072">Was darf die Identität?</text><text x="567" y="601" text-anchor="middle" font-size="11">rollt aus</text><line x1="510" y1="608" x2="625" y2="608" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#d3-a)"/><text x="20" y="650" text-anchor="start" class="legend-text">Zeit läuft von oben nach unten. Rot: die beiden Entscheidungen auf Microsoft-Seite.</text></svg>