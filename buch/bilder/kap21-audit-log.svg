<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" role="img" aria-labelledby="d21-al-title d21-al-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d21-al-title">Wer im Audit Log von SAP steht</title><desc id="d21-al-desc">Oben fragen M. und K. einen Agenten mit einer Verbindung über den technischen Benutzer RFC_USER; SAP prüft dessen Rollen, und das Audit Log zeigt zweimal RFC_USER. Unten sind M. und K. am Agenten angemeldet, ihr Token wird über Entra, IAS und ein Zertifikat getauscht; SAP prüft ihre eigenen Rollen, und das Audit Log zeigt M. und K.</desc><defs><marker id="d21-al-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d21-al-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d21-al-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="30" width="660" height="140" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="52" font-size="13" text-anchor="start" font-weight="600" style="fill:#b8472a">Technischer Benutzer</text><rect x="25" y="72" width="125" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="87.5" y="100" font-size="12.5" text-anchor="middle" font-weight="600">M. und K.</text><text x="87.5" y="114" font-size="11" text-anchor="middle" style="fill:#5b6072">fragen den Agenten</text><rect x="175" y="72" width="140" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="245.0" y="100" font-size="12.5" text-anchor="middle" font-weight="600">Verbindung</text><text x="245.0" y="114" font-size="11" text-anchor="middle" style="fill:#5b6072">RFC_USER</text><rect x="340" y="72" width="150" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="415.0" y="100" font-size="12.5" text-anchor="middle" font-weight="600">SAP prüft</text><text x="415.0" y="114" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen von RFC_USER</text><rect x="515" y="72" width="140" height="60" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="585.0" y="100" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Audit Log</text><text x="585.0" y="114" font-size="11" text-anchor="middle" style="fill:#5b6072">zweimal RFC_USER</text><path d="M150 102 L173 102" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d21-al-r)"/><path d="M315 102 L338 102" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d21-al-r)"/><path d="M490 102 L513 102" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d21-al-r)"/><rect x="10" y="195" width="660" height="140" rx="6" fill="none" stroke="#c8ccd6" stroke-width="1.5"/><text x="24" y="217" font-size="13" text-anchor="start" font-weight="600" style="fill:#2f5d8a">Principal Propagation</text><rect x="25" y="237" width="125" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="87.5" y="264" font-size="12.5" text-anchor="middle" font-weight="600">M. und K.</text><text x="87.5" y="280" font-size="11" text-anchor="middle" style="fill:#5b6072">angemeldet</text><rect x="175" y="237" width="140" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="245.0" y="264" font-size="12.5" text-anchor="middle" font-weight="600">Token-Tausch</text><text x="245.0" y="280" font-size="11" text-anchor="middle" style="fill:#5b6072">Entra, IAS, Zertifikat</text><rect x="340" y="237" width="150" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="415.0" y="264" font-size="12.5" text-anchor="middle" font-weight="600">SAP prüft</text><text x="415.0" y="280" font-size="11" text-anchor="middle" style="fill:#5b6072">Rollen von M. und K.</text><rect x="515" y="237" width="140" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="585.0" y="264" font-size="12.5" text-anchor="middle" font-weight="600">Audit Log</text><text x="585.0" y="280" font-size="11" text-anchor="middle" style="fill:#5b6072">M., K.</text><path d="M150 267 L173 267" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-al-a)"/><path d="M315 267 L338 267" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-al-a)"/><path d="M490 267 L513 267" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-al-a)"/><text x="340" y="360" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Nur mit Principal Propagation prüft und protokolliert SAP die echte Person.</text></svg>