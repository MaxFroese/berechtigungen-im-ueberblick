<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="k4-title k4-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="k4-title">Delegierte Berechtigung und Anwendungsberechtigung im Vergleich</title><desc id="k4-desc">Links überlappen sich die Mengen Files.Read.All als App-Recht und Dateien des Nutzers, nur die Schnittmenge ist wirksam, der Claim heißt scp. Rechts wirkt Files.Read.All ohne Nutzerrecht auf alle Sites des Tenants, der Claim heißt roles.</desc><defs><marker id="k4-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="k4-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="k4-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><defs><clipPath id="k4-clip"><circle cx="125" cy="175" r="80"/></clipPath></defs>
