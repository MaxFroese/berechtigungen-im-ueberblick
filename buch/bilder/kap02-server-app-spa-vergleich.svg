<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" role="img" aria-labelledby="d4-t d4-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style>
<title id="d4-t">Server-App und Single-Page Application im Vergleich</title>
<desc id="d4-d">Server-App und Single-Page Application nebeneinander beim Einlösen des Codes und bei der Ablage der Tokens. Die beiden Varianten unterscheiden sich darin, wer den Code einlöst, mit welchem Nachweis, und wo danach die Tokens liegen.</desc>
<defs><marker id="d4-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#2f5d8a"/></marker><marker id="d4-r" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#b8472a"/></marker><marker id="d4-m" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#5b6072"/></marker></defs>
<line x1="340" y1="12" x2="340" y2="395" stroke="#5b6072" stroke-width="1"/>
<text x="170" y="28" text-anchor="middle" font-size="14" font-weight="600" style="fill:#2f5d8a">Server-App</text>
<text x="510" y="28" text-anchor="middle" font-size="14" font-weight="600" style="fill:#2f5d8a">Single-Page Application (SPA)</text>
<circle cx="90" cy="100" r="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="90" y="104.0" text-anchor="middle" font-size="12">Browser</text>
<circle cx="250" cy="100" r="40" fill="#ffffff" stroke="#b8472a" stroke-width="3"/>
<text x="250" y="92" text-anchor="middle" font-size="12" font-weight="600">Server</text>
<rect x="222" y="100" width="56" height="20" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/>
<text x="250.0" y="114.0" text-anchor="middle" font-size="11">Tokens</text>
<line x1="130" y1="100" x2="209" y2="100" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d4-a)"/>
<text x="170" y="92" text-anchor="middle" font-size="11.5">Code</text>
<circle cx="250" cy="265" r="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="250" y="261.5" text-anchor="middle" font-size="12">token-</text>
<text x="250" y="276.5" text-anchor="middle" font-size="12">Endpunkt</text>
<line x1="240" y1="139" x2="240" y2="225" stroke="#b8472a" stroke-width="2" marker-end="url(#d4-r)"/>
<line x1="260" y1="226" x2="260" y2="140" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d4-a)"/>
<text x="268" y="186" text-anchor="start" font-size="11.5">Tokens</text>
<text x="228" y="160" text-anchor="end" font-size="11.5">Code mit Nachweis</text>
<rect x="105" y="168" width="123" height="22" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.2"/>
<text x="166.5" y="183.0" text-anchor="middle" font-size="11">PKCE-Wert</text>
<rect x="105" y="194" width="123" height="22" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.2"/>
<text x="166.5" y="209.0" text-anchor="middle" font-size="11">App-Anmeldedaten</text>
<circle cx="510" cy="100" r="60" fill="#ffffff" stroke="#b8472a" stroke-width="3"/>
<text x="510" y="72" text-anchor="middle" font-size="12" font-weight="600">Browser</text>
<rect x="464" y="82" width="92" height="20" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.2"/>
<text x="510.0" y="96.0" text-anchor="middle" font-size="10.5">JavaScript-Code</text>
<rect x="482" y="110" width="56" height="20" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/>
<text x="510.0" y="124.0" text-anchor="middle" font-size="11">Tokens</text>
<circle cx="510" cy="265" r="40" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="510" y="261.5" text-anchor="middle" font-size="12">token-</text>
<text x="510" y="276.5" text-anchor="middle" font-size="12">Endpunkt</text>
<line x1="500" y1="160" x2="500" y2="225" stroke="#b8472a" stroke-width="2" marker-end="url(#d4-r)"/>
