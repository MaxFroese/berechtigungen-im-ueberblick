<text x="488" y="184" text-anchor="end" font-size="11.5">Code mit Nachweis</text>
<rect x="365" y="192" width="123" height="22" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.2"/>
<text x="426.5" y="207.0" text-anchor="middle" font-size="11">PKCE-Wert</text>
<text x="20" y="335" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Einlöser:</text>
<text x="88" y="335" text-anchor="start" font-size="12">der Server</text>
<text x="360" y="335" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Einlöser:</text>
<text x="428" y="335" text-anchor="start" font-size="12">JavaScript-Code im Browser</text>
<text x="20" y="357" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Nachweis:</text>
<text x="88" y="357" text-anchor="start" font-size="12">PKCE-Wert und App-Anmeldedaten</text>
<text x="360" y="357" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Nachweis:</text>
<text x="428" y="357" text-anchor="start" font-size="12">nur PKCE-Wert</text>
<text x="20" y="379" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Tokens:</text>
<text x="88" y="379" text-anchor="start" font-size="12">auf dem Server</text>
<text x="360" y="379" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Tokens:</text>
<text x="428" y="379" text-anchor="start" font-size="12">im Browser</text>
<text x="340" y="425" text-anchor="middle" class="legend-text">dicker roter Rand: löst den Code ein  |  rotes Rechteck: Ablageort der Tokens  |  roter Pfeil: Einlösen</text>
</svg>