<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" role="img" aria-labelledby="kap05-vererbung-t kap05-vererbung-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap05-vererbung-t">Vererbung und Ausnahmen in einer Site</title><desc id="kap05-vererbung-d">Baum aus Site, Bibliothek, Ordnern und Dateien, in dem die Rechte von oben nach unten fließen und an zwei Stellen abweichen.</desc><defs><marker id="kap05-vererbung-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="kap05-vererbung-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="kap05-vererbung-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs>
<text x="20" y="32" text-anchor="start" font-size="12" font-weight="600" style="fill:#2f5d8a">Ohne Ausnahme:</text>
<text x="20" y="48" text-anchor="start" font-size="12" style="fill:#2f5d8a">Rechte sind an der</text>
<text x="20" y="64" text-anchor="start" font-size="12" style="fill:#2f5d8a">Site ablesbar</text>
<text x="498" y="32" text-anchor="start" font-size="12" font-weight="600" style="fill:#b8472a">Änderung an der Site</text>
<text x="498" y="48" text-anchor="start" font-size="12" style="fill:#b8472a">erreicht Ausnahmen</text>
<text x="498" y="64" text-anchor="start" font-size="12" style="fill:#b8472a">nicht vollständig</text>
<rect x="200" y="16" width="280" height="62" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2.5"/>
<text x="340" y="42" text-anchor="middle" font-size="14" font-weight="600">Site</text>
<text x="340" y="62" text-anchor="middle" font-size="12" style="fill:#5b6072">Owner · Member · Visitor</text>
<line x1="340" y1="78" x2="340" y2="112" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-vererbung-a)"/>
<text x="348" y="99" text-anchor="start" font-size="11" style="fill:#2f5d8a">erbt</text>
<rect x="260" y="112" width="160" height="38" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="340" y="136" text-anchor="middle" font-size="13" font-weight="600">Bibliothek</text>
<line x1="290" y1="150" x2="190" y2="200" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-vererbung-a)"/>
<text x="226" y="168" text-anchor="end" font-size="11" style="fill:#2f5d8a">erbt</text>
<line x1="390" y1="150" x2="510" y2="200" stroke="#b8472a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#kap05-vererbung-h)"/>
<text x="470" y="168" text-anchor="start" font-size="11" style="fill:#b8472a">Vererbung getrennt</text>
<rect x="70" y="200" width="190" height="48" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="165" y="221" text-anchor="middle" font-size="13" font-weight="600">Ordner A</text>
<text x="165" y="238" text-anchor="middle" font-size="11" style="fill:#5b6072">erbt von der Bibliothek</text>
<rect x="430" y="200" width="220" height="48" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/>
<text x="540" y="221" text-anchor="middle" font-size="13" font-weight="600">Ordner B</text>
<text x="540" y="238" text-anchor="middle" font-size="11" style="fill:#b8472a">Vererbung unterbrochen</text>
<line x1="540" y1="248" x2="540" y2="280" stroke="#b8472a" stroke-width="1.6" marker-end="url(#kap05-vererbung-h)"/>
<rect x="440" y="280" width="200" height="58" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/>
<text x="540" y="304" text-anchor="middle" font-size="12.5" font-weight="600">Eigene Rechteliste</text>
<text x="540" y="323" text-anchor="middle" font-size="11" style="fill:#5b6072">unabhängig von der Site</text>
<line x1="125" y1="248" x2="95" y2="290" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-vererbung-a)"/>
<line x1="205" y1="248" x2="265" y2="290" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-vererbung-a)"/>
<rect x="30" y="290" width="130" height="40" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/>
<text x="95" y="315" text-anchor="middle" font-size="12.5" font-weight="600">Datei</text>
<rect x="190" y="290" width="170" height="40" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="2.5"/>
<text x="275" y="315" text-anchor="middle" font-size="12.5" font-weight="600">Datei mit Ausnahme</text>
<line x1="275" y1="330" x2="275" y2="354" stroke="#b8472a" stroke-width="1.6" marker-end="url(#kap05-vererbung-h)"/>
<rect x="190" y="354" width="170" height="48" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/>
<text x="275" y="374" text-anchor="middle" font-size="12.5" font-weight="600">Freigabelink</text>
<text x="275" y="391" text-anchor="middle" font-size="11" style="fill:#5b6072">eigener Rechteeintrag</text>
<line x1="24" y1="432" x2="56" y2="432" stroke="#2f5d8a" stroke-width="1.6" marker-end="url(#kap05-vererbung-a)"/>
<text x="64" y="436" text-anchor="start" class="legend-text">geerbte Rechte</text>
<rect x="190" y="424" width="30" height="16" rx="3" fill="#ffffff" stroke="#b8472a" stroke-width="2"/>
<text x="228" y="436" text-anchor="start" class="legend-text">Ausnahme mit eigenen Rechten</text>
</svg>