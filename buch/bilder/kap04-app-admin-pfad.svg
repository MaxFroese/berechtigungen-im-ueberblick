<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" role="img" aria-labelledby="d-app-title d-app-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d-app-title">Vom App-Admin zum tenantweiten Datenzugriff</title><desc id="d-app-desc">Der Weg von einer App-Admin-Rolle ohne Inhaltsrechte zum tenantweiten Datenzugriff über die Identität einer bestehenden App.</desc><defs><marker id="d-app-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d-app-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d-app-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><circle cx="80" cy="95" r="60" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="80" y="92" font-size="12" text-anchor="middle" font-weight="600">Application</text><text x="80" y="108" font-size="12" text-anchor="middle" font-weight="600">Administrator</text><text x="80" y="172" font-size="11" text-anchor="middle" style="fill:#5b6072">kein eigenes Recht</text><text x="80" y="186" font-size="11" text-anchor="middle" style="fill:#5b6072">auf Postfächer</text><path d="M140 95 L188 95" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-app-a)"/><rect x="190" y="65" width="210" height="60" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="295" y="85" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Schritt 1</text><text x="295" y="101" font-size="12.5" text-anchor="middle" font-weight="600">Neues Client Secret</text><text x="295" y="116" font-size="12.5" text-anchor="middle" font-weight="600">hinzufügen</text><rect x="190" y="133" width="210" height="22" rx="3" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="295.0" y="148.0" font-size="11" text-anchor="middle">Audit-Log: neue Anmeldedaten</text><path d="M400 95 L506 95" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-app-a)"/><circle cx="570" cy="95" r="62" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="570" y="82" font-size="12" text-anchor="middle" font-weight="600">Bestehende App</text><rect x="531" y="92" width="78" height="22" rx="3" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="570" y="107" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Mail.Read</text><path d="M570 157 L570 212 L130 212 L130 238" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-app-a)"/><text x="350" y="204" font-size="11" text-anchor="middle" style="fill:#5b6072">mit den Anmeldedaten der App</text><rect x="30" y="240" width="200" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="130" y="262" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Schritt 2</text><text x="130" y="280" font-size="12.5" text-anchor="middle" font-weight="600">Access Token holen</text><text x="130" y="302" font-size="11.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">roles statt scp</text><rect x="30" y="328" width="200" height="22" rx="3" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="130.0" y="343.0" font-size="11" text-anchor="middle">Sign-in-Log: Anmeldung der App</text><path d="M230 280 L268 280" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-app-a)"/><rect x="270" y="240" width="170" height="80" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="355" y="270" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Schritt 3</text><text x="355" y="290" font-size="12.5" text-anchor="middle" font-weight="600">Graph API</text><rect x="270" y="328" width="170" height="22" rx="3" fill="#ffffff" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="3 3"/><text x="355.0" y="343.0" font-size="11" text-anchor="middle" style="fill:#5b6072">kein Eintrag in Entra-Logs</text><path d="M440 280 L506 280" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-app-a)"/><circle cx="570" cy="280" r="62" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="570" y="276" font-size="12" text-anchor="middle" font-weight="600">Alle Postfächer</text><text x="570" y="293" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">tenantweit</text><rect x="20" y="368" width="640" height="36" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="391" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Rolle wirkt harmlos. Ihre Reichweite bestimmen die Apps im Tenant.</text><rect x="20" y="419" width="22" height="14" rx="2" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="50" y="430" class="legend-text">Eintrag im Protokoll</text><circle cx="204" cy="426" r="7" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="218" y="430" class="legend-text">hält die Rechte, um die es geht</text></svg>