<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" role="img" aria-labelledby="d2-t d2-d" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style>
<title id="d2-t">Ein Access Token pro Zieldienst</title>
<desc id="d2-d">Eine App erhält von Entra ID getrennte Access Tokens für drei Zieldienste, und ein falsch adressiertes Token wird abgelehnt. Die Audience bindet jedes Access Token an genau einen Dienst und begrenzt so den Schaden, wenn ein Dienst oder Token kompromittiert wird.</desc>
