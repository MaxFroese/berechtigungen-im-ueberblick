<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 355" role="img" aria-labelledby="d20-la-title d20-la-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d20-la-title">Eine SAP-Landschaft</title><desc id="d20-la-desc">Drei Systeme DEV, QAS und PRD. DEV hat die Mandanten 100 und 200, QAS und PRD je den Mandanten 100, jeweils mit eigenen Benutzern und Daten. In jedem System gelten Programme und Tabellen für alle Mandanten. Transportaufträge wandern von DEV über QAS nach PRD.</desc><defs><marker id="d20-la-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d20-la-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d20-la-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="30" width="210" height="250" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="115" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">System DEV</text><rect x="25" y="70" width="180" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="96" font-size="12.5" text-anchor="middle" font-weight="600">Mandant 100</text><text x="115.0" y="110" font-size="11" text-anchor="middle" style="fill:#5b6072">Customizing: Benutzer, Daten</text><rect x="25" y="140" width="180" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="166" font-size="12.5" text-anchor="middle" font-weight="600">Mandant 200</text><text x="115.0" y="180" font-size="11" text-anchor="middle" style="fill:#5b6072">Test: Benutzer, Daten</text><rect x="25" y="220" width="180" height="46" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="115.0" y="240" font-size="12.5" text-anchor="middle" font-weight="600">Programme, Tabellen</text><text x="115.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">gelten für alle Mandanten</text><rect x="235" y="30" width="210" height="250" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="340" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">System QAS</text><rect x="250" y="70" width="180" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="96" font-size="12.5" text-anchor="middle" font-weight="600">Mandant 100</text><text x="340.0" y="110" font-size="11" text-anchor="middle" style="fill:#5b6072">Abnahme: Benutzer, Daten</text><rect x="250" y="220" width="180" height="46" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="340.0" y="240" font-size="12.5" text-anchor="middle" font-weight="600">Programme, Tabellen</text><text x="340.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">gelten für alle Mandanten</text><rect x="460" y="30" width="210" height="250" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="565" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">System PRD</text><rect x="475" y="70" width="180" height="56" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="565.0" y="96" font-size="12.5" text-anchor="middle" font-weight="600">Mandant 100</text><text x="565.0" y="110" font-size="11" text-anchor="middle" style="fill:#5b6072">Produktion: Benutzer, Daten</text><rect x="475" y="220" width="180" height="46" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="565.0" y="240" font-size="12.5" text-anchor="middle" font-weight="600">Programme, Tabellen</text><text x="565.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">gelten für alle Mandanten</text><path d="M115 305 L338 305" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-la-a)"/><path d="M340 305 L563 305" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d20-la-a)"/><text x="227" y="298" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Transportauftrag</text><text x="452" y="298" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Transportauftrag</text><text x="340" y="340" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Ein Mandant trennt Daten im System; er ist kein Tenant.</text></svg>