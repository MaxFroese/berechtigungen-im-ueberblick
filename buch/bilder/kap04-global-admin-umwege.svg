<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 532" role="img" aria-labelledby="d-umwege-title d-umwege-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d-umwege-title">Umwege des Global Administrators zu den Inhalten</title><desc id="d-umwege-desc">Der Global Administrator hat keine direkte Verbindung zu den Inhalten, erreicht sie aber über mehrere Umwege, die alle Spuren in Protokollen hinterlassen.</desc><defs><marker id="d-umwege-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d-umwege-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker><marker id="d-umwege-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker></defs><path d="M80 153 L80 66 L600 66 L600 134" fill="none" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#d-umwege-m)"/><path d="M332 58 L348 74 M348 58 L332 74" stroke="#b8472a" stroke-width="3" fill="none"/><text x="340" y="48" font-size="12" text-anchor="middle" font-weight="600" style="fill:#b8472a">Direkter Zugriff: scheitert ohne eigenes Recht</text><rect x="410" y="96" width="44" height="314" rx="4" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1.5"/><text x="432" y="257" font-size="12" text-anchor="middle" font-weight="600" style="fill:#1f2230" transform="rotate(-90 432 253)">Protokolle halten jeden Pfad fest</text><path d="M124 171 L174 122" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><rect x="176" y="98" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="276" y="116" font-size="12.5" text-anchor="middle" font-weight="600">Dienstweg</text><text x="276" y="132" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Zugriff auf Postfach oder Site</text><path d="M376 120 L408 120" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M454 120 L540 168" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M137 191 L174 176" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><rect x="176" y="153" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="276" y="171" font-size="12.5" text-anchor="middle" font-weight="600">Kontoweg</text><text x="276" y="187" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Passwort zurücksetzen, anmelden</text><path d="M376 175 L408 175" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M454 175 L533 190" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M141 224 L174 229" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><rect x="176" y="208" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="276" y="226" font-size="12.5" text-anchor="middle" font-weight="600">App-Weg</text><text x="276" y="242" font-size="10.5" text-anchor="middle" style="fill:#5b6072">App, Admin Consent, Graph API</text><path d="M376 230 L408 230" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M454 230 L533 215" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M130 252 L174 284" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><rect x="176" y="263" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="276" y="281" font-size="12.5" text-anchor="middle" font-weight="600">Compliance-Weg</text><text x="276" y="297" font-size="10.5" text-anchor="middle" style="fill:#5b6072">Rolle für Datensuche, dann suchen</text><path d="M376 285 L408 285" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M454 285 L541 236" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><text x="276" y="354" font-size="11" text-anchor="middle" font-weight="600" style="fill:#5b6072">Separater Pfad nach Azure</text><path d="M110 269 L175 383" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><rect x="176" y="363" width="200" height="44" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="276" y="381" font-size="12.5" text-anchor="middle" font-weight="600">Elevate Access</text><text x="276" y="397" font-size="10.5" text-anchor="middle" style="fill:#5b6072">User Access Administrator</text><path d="M376 385 L408 385" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><path d="M454 385 L542 385" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d-umwege-a)"/><circle cx="600" cy="385" r="56" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="600" y="382" font-size="12" text-anchor="middle" font-weight="600">Azure-</text><text x="600" y="397" font-size="12" text-anchor="middle" font-weight="600">Subscriptions</text><circle cx="80" cy="215" r="62" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="80" y="212" font-size="12.5" text-anchor="middle" font-weight="600">Global</text><text x="80" y="228" font-size="12.5" text-anchor="middle" font-weight="600">Administrator</text><circle cx="600" cy="202" r="66" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="600" y="168" font-size="13" text-anchor="middle" font-weight="600">Inhalte</text><rect x="569" y="176" width="62" height="18" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/><text x="600" y="189" font-size="10.5" text-anchor="middle">Postfach</text><rect x="569" y="197" width="62" height="18" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/><text x="600" y="210" font-size="10.5" text-anchor="middle">Site</text><rect x="569" y="218" width="62" height="18" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1"/><text x="600" y="231" font-size="10.5" text-anchor="middle">Datei</text><rect x="20" y="454" width="640" height="36" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340" y="477" font-size="13" text-anchor="middle" font-weight="600" style="fill:#b8472a">Die Grenze: zusätzliche, protokollierte Schritte, keine technische Sperre.</text><line x1="20" y1="514" x2="58" y2="514" stroke="#2f5d8a" stroke-width="1.5"/><text x="66" y="518" class="legend-text">Umweg, möglich</text><line x1="190" y1="514" x2="228" y2="514" stroke="#5b6072" stroke-width="1.5" stroke-dasharray="6 5"/><text x="236" y="518" class="legend-text">Direktverbindung, gibt es nicht</text><rect x="440" y="507" width="22" height="14" rx="2" fill="#d9e4ef" stroke="#2f5d8a" stroke-width="1"/><text x="470" y="518" class="legend-text">Protokollierung</text></svg>