<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="d18-sc-title d18-sc-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d18-sc-title">Schichten einer Komponente</title><desc id="d18-sc-desc">Ein Stapel für ein Formular in Produktion: unten System, darüber managed v1.0 und v1.1, ganz oben eine unmanaged Änderung, die direkt in Produktion gemacht wurde. Die Laufzeit liest die oberste Schicht; ein neues Deployment v1.2 landet darunter und bleibt unsichtbar.</desc><defs><marker id="d18-sc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d18-sc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d18-sc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><text x="210" y="30" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Schichten eines Formulars in Produktion</text><rect x="60" y="50" width="300" height="50" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="210.0" y="72" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">unmanaged Änderung</text><text x="210.0" y="88" font-size="11" text-anchor="middle" style="fill:#5b6072">direkt in Produktion gemacht</text><rect x="60" y="110" width="300" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="210.0" y="132" font-size="12.5" text-anchor="middle" font-weight="600">managed v1.1</text><text x="210.0" y="148" font-size="11" text-anchor="middle" style="fill:#5b6072">aus der Pipeline</text><rect x="60" y="170" width="300" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="210.0" y="200" font-size="12.5" text-anchor="middle" font-weight="600">managed v1.0</text><rect x="60" y="230" width="300" height="50" rx="4" fill="#ffffff" stroke="#c8ccd6" stroke-width="1.5"/><text x="210.0" y="260" font-size="12.5" text-anchor="middle" font-weight="600">System</text><path d="M500 75 L362 75" fill="none" stroke="#b8472a" stroke-width="1.5" marker-end="url(#d18-sc-r)"/><text x="510" y="70" font-size="11" text-anchor="start" font-weight="600" style="fill:#b8472a">Laufzeit liest</text><text x="510" y="84" font-size="11" text-anchor="start" font-weight="600" style="fill:#b8472a">die oberste Schicht</text><rect x="430" y="150" width="230" height="50" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="545.0" y="172" font-size="12.5" text-anchor="middle" font-weight="600">Neues Deployment v1.2</text><text x="545.0" y="188" font-size="11" text-anchor="middle" style="fill:#5b6072">aus der Entwicklung</text><path d="M430 175 L362 107" fill="none" stroke="#2f5d8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d18-sc-a)"/><text x="545" y="225" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">landet unter der Änderung</text><text x="545" y="239" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">und bleibt unsichtbar</text><text x="340" y="315" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Lösung: die unmanaged Schicht entfernen, nicht darüberbauen.</text></svg>