<svg viewBox="0 0 680 375" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap10-drei-schranken-t kap10-drei-schranken-d" id="kap10-drei-schranken" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap10-drei-schranken-t">Drei unabhängige Schranken vor dem Auswertungslauf</title><desc id="kap10-drei-schranken-d">Ein alter Projektordner muss nacheinander drei Schranken passieren, bevor er in den Auswertungslauf darf: technischer Zugriff, geprüft durch Entra ID und SharePoint; Tarif und Anbietervertrag, geklärt durch die Firma; Erlaubnis für diese Daten, je Projekt. Lesezugriff öffnet nur die erste Schranke. Die beiden anderen prüft kein technisches System, und von beiden führt ein Abzweig weg, wenn sie nicht geklärt sind: Der Ordner bleibt draußen. Ein guter Tarif öffnet die dritte Schranke nicht automatisch.</desc><defs><marker id="kap10-drei-schranken-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap10-drei-schranken-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap10-drei-schranken-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><text x="187" y="28" font-size="12" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Lesezugriff öffnet</text><text x="187" y="44" font-size="12" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">nur diese Schranke</text><path d="M124 66V58H250V66" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="412" y="44" font-size="12" font-weight="600" text-anchor="middle" style="fill:#b8472a">Prüft kein technisches System</text><path d="M274 66V58H550V66" fill="none" stroke="#b8472a" stroke-width="1.5"/><line x1="100" y1="163" x2="122" y2="163" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-drei-schranken-a)"/><line x1="250" y1="163" x2="272" y2="163" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-drei-schranken-a)"/><line x1="400" y1="163" x2="422" y2="163" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-drei-schranken-a)"/><line x1="550" y1="163" x2="578" y2="163" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-drei-schranken-a)"/><circle cx="56" cy="163" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="56" y="151" font-size="12" text-anchor="middle">Alter</text><text x="56" y="167" font-size="12" text-anchor="middle">Projekt-</text><text x="56" y="183" font-size="12" text-anchor="middle">ordner</text><circle cx="624" cy="163" r="44" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="624" y="160" font-size="11.5" text-anchor="middle">Auswertungs-</text><text x="624" y="176" font-size="11.5" text-anchor="middle">lauf</text><rect x="124" y="78" width="126" height="170" rx="8" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="187" y="97" font-size="11" font-weight="600" text-anchor="middle" style="fill:#2f5d8a">Schranke 1</text><text x="187" y="113" font-size="12" font-weight="600" text-anchor="middle">Technischer</text><text x="187" y="129" font-size="12" font-weight="600" text-anchor="middle">Zugriff</text><text x="187" y="147" font-size="11" text-anchor="middle">Site-Rechte, Token</text><text x="187" y="161" font-size="11" text-anchor="middle" style="fill:#5b6072">geprüft durch</text><text x="187" y="175" font-size="11" text-anchor="middle" style="fill:#5b6072">Entra ID und</text><text x="187" y="189" font-size="11" text-anchor="middle" style="fill:#5b6072">SharePoint</text><rect x="274" y="78" width="126" height="170" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="337" y="97" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">Schranke 2</text><text x="337" y="113" font-size="12" font-weight="600" text-anchor="middle">Tarif und</text><text x="337" y="129" font-size="12" font-weight="600" text-anchor="middle">Anbietervertrag</text><text x="337" y="147" font-size="11" text-anchor="middle">Business-Tarif, AVV,</text><text x="337" y="161" font-size="11" text-anchor="middle">Drittland</text><text x="337" y="175" font-size="11" text-anchor="middle" style="fill:#5b6072">geklärt durch</text><text x="337" y="189" font-size="11" text-anchor="middle" style="fill:#5b6072">Firma</text><rect x="424" y="78" width="126" height="170" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="487" y="97" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">Schranke 3</text><text x="487" y="113" font-size="12" font-weight="600" text-anchor="middle">Erlaubnis für</text><text x="487" y="129" font-size="12" font-weight="600" text-anchor="middle">diese Daten</text><text x="487" y="147" font-size="11" text-anchor="middle">Rechtsgrundlage,</text><text x="487" y="161" font-size="11" text-anchor="middle">Kundenvertrag,</text><text x="487" y="175" font-size="11" text-anchor="middle">Vertraulichkeits-</text><text x="487" y="189" font-size="11" text-anchor="middle">vereinbarung</text><text x="487" y="203" font-size="11" text-anchor="middle" style="fill:#5b6072">je Projekt</text><line x1="337" y1="248" x2="337" y2="283" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-drei-schranken-h)"/><rect x="274" y="285" width="126" height="42" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="337" y="302" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">nicht geklärt:</text><text x="337" y="317" font-size="10.5" text-anchor="middle">Ordner bleibt draußen</text><line x1="487" y1="248" x2="487" y2="283" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-drei-schranken-h)"/><rect x="424" y="285" width="126" height="42" rx="8" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="487" y="302" font-size="11" font-weight="600" text-anchor="middle" style="fill:#b8472a">nicht geklärt:</text><text x="487" y="317" font-size="10.5" text-anchor="middle">Ordner bleibt draußen</text><line x1="412" y1="168" x2="412" y2="340" stroke="#5b6072" stroke-width="1" stroke-dasharray="3 3"/><text x="412" y="356" font-size="12" font-weight="600" text-anchor="middle" style="fill:#b8472a">Ein guter Tarif öffnet nicht automatisch Schranke 3</text><line x1="20" y1="292" x2="50" y2="292" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap10-drei-schranken-a)"/><text x="58" y="296" class="legend-text">Weg des Ordners</text><line x1="20" y1="312" x2="50" y2="312" stroke="#b8472a" stroke-width="2" marker-end="url(#kap10-drei-schranken-h)"/><text x="58" y="316" class="legend-text">Abzweig, wenn nicht geklärt</text></svg>