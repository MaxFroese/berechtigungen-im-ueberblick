<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" aria-labelledby="d21-dk-title d21-dk-desc" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="d21-dk-title">Drei Ketten bis zum Zugriff</title><desc id="d21-dk-desc">Drei Spalten: Anmeldung von Entra ID über den IAS zur SAP-Anwendung; Existenz vom HR-System über Entra ID zum Identity Provisioning; Berechtigung mit SAP-Rollen, Prüfung der Funktionstrennung und Entscheidung in SAP. Darunter: Zugriff nur, wenn alle drei Ketten passen.</desc><defs><marker id="d21-dk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f5d8a"/></marker><marker id="d21-dk-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8472a"/></marker><marker id="d21-dk-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6072"/></marker></defs><rect x="10" y="30" width="210" height="262" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="115" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">1 Anmeldung</text><rect x="25" y="70" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="94" font-size="12.5" text-anchor="middle" font-weight="600">Entra ID</text><text x="115.0" y="108" font-size="11" text-anchor="middle" style="fill:#5b6072">MFA, Conditional Access</text><path d="M115 122 L115 142" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="25" y="144" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="168" font-size="12.5" text-anchor="middle" font-weight="600">IAS</text><text x="115.0" y="182" font-size="11" text-anchor="middle" style="fill:#5b6072">Vermittler auf SAP-Seite</text><path d="M115 196 L115 216" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="25" y="218" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="115.0" y="242" font-size="12.5" text-anchor="middle" font-weight="600">SAP-Anwendung</text><text x="115.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">vertraut dem IAS</text><rect x="235" y="30" width="210" height="262" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="340" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">2 Existenz</text><rect x="250" y="70" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="94" font-size="12.5" text-anchor="middle" font-weight="600">HR-System</text><text x="340.0" y="108" font-size="11" text-anchor="middle" style="fill:#5b6072">etwa SuccessFactors</text><path d="M340 122 L340 142" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="250" y="144" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="168" font-size="12.5" text-anchor="middle" font-weight="600">Entra ID</text><text x="340.0" y="182" font-size="11" text-anchor="middle" style="fill:#5b6072">Drehscheibe</text><path d="M340 196 L340 216" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="250" y="218" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="340.0" y="242" font-size="12.5" text-anchor="middle" font-weight="600">Identity Provisioning</text><text x="340.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">verteilt an SAP-Systeme</text><rect x="460" y="30" width="210" height="262" rx="6" fill="none" stroke="#2f5d8a" stroke-width="1.5"/><text x="565" y="54" font-size="13" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">3 Berechtigung</text><rect x="475" y="70" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="565.0" y="94" font-size="12.5" text-anchor="middle" font-weight="600">SAP-Rollen</text><text x="565.0" y="108" font-size="11" text-anchor="middle" style="fill:#5b6072">PFCG oder Business Roles</text><path d="M565 122 L565 142" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="475" y="144" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="565.0" y="168" font-size="12.5" text-anchor="middle" font-weight="600">Funktionstrennung</text><text x="565.0" y="182" font-size="11" text-anchor="middle" style="fill:#5b6072">GRC oder IAG</text><path d="M565 196 L565 216" fill="none" stroke="#2f5d8a" stroke-width="1.5" marker-end="url(#d21-dk-a)"/><rect x="475" y="218" width="180" height="52" rx="4" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="565.0" y="242" font-size="12.5" text-anchor="middle" font-weight="600">Entscheidung</text><text x="565.0" y="256" font-size="11" text-anchor="middle" style="fill:#5b6072">immer in SAP</text><rect x="10" y="306" width="660" height="40" rx="4" fill="#ffffff" stroke="#b8472a" stroke-width="1.5"/><text x="340.0" y="330" font-size="12.5" text-anchor="middle" font-weight="600" style="fill:#b8472a">Zugriff nur, wenn alle drei Ketten passen.</text></svg>