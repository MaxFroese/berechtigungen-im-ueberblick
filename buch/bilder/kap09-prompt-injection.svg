<svg viewBox="0 0 680 370" width="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kap09-prompt-injection-t kap09-prompt-injection-d" id="kap09-prompt-injection" style="background:#ffffff"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1f2230}.legend-text{font-size:11px;fill:#5b6072}</style><title id="kap09-prompt-injection-t">Prompt Injection und ihre drei Bedingungen</title><desc id="kap09-prompt-injection-d">Eine Anweisung aus einem Kanal wie README, Dokument oder MCP-Antwort gelangt in den Kontext des Modells, wird zum Befehl des KI-Agenten, läuft mit den Rechten des Kontos und nutzt einen Ausgang nach außen. Drei Stellen sind Bedingungen: nicht vertrauenswürdige Inhalte, Zugriff auf Daten oder Rechte und ein Weg nach außen. Least Privilege entfernt den Zugriff, die Sandbox den Ausgang.</desc><defs><marker id="kap09-prompt-injection-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f5d8a"/></marker><marker id="kap09-prompt-injection-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8472a"/></marker><marker id="kap09-prompt-injection-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6072"/></marker></defs><rect x="8" y="34" width="124" height="62" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="70.0" y="54.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Bedingung</text><text x="70.0" y="68.8" font-size="11" text-anchor="middle">nicht vertrauens-</text><text x="70.0" y="82.8" font-size="11" text-anchor="middle">würdige Inhalte</text><line x1="70" y1="96" x2="70" y2="136" stroke="#5b6072" stroke-width="1.5"/><rect x="413" y="34" width="124" height="62" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="475.0" y="54.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Bedingung</text><text x="475.0" y="68.8" font-size="11" text-anchor="middle">Zugriff auf Daten</text><text x="475.0" y="82.8" font-size="11" text-anchor="middle">oder Rechte</text><line x1="475" y1="96" x2="475" y2="136" stroke="#5b6072" stroke-width="1.5"/><rect x="548" y="34" width="124" height="62" rx="2" fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5"/><text x="610.0" y="54.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#2f5d8a">Bedingung</text><text x="610.0" y="68.8" font-size="11" text-anchor="middle">Weg nach außen</text><text x="610.0" y="82.8" font-size="11" text-anchor="middle">oder Schreibaktion</text><line x1="610" y1="96" x2="610" y2="136" stroke="#5b6072" stroke-width="1.5"/><circle cx="70" cy="190" r="54" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="70" y="172.8" font-size="11" text-anchor="middle" font-weight="600">Kanal</text><text x="70" y="186.8" font-size="11" text-anchor="middle">README,</text><text x="70" y="200.8" font-size="11" text-anchor="middle">Dokument,</text><text x="70" y="214.8" font-size="11" text-anchor="middle">MCP-Antwort</text><circle cx="205" cy="190" r="54" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="205" y="186.7" font-size="12" text-anchor="middle" font-weight="600">Kontext</text><text x="205" y="201.7" font-size="12" text-anchor="middle">des Modells</text><circle cx="340" cy="190" r="54" fill="#ffffff" stroke="#2f5d8a" stroke-width="2"/><text x="340" y="186.8" font-size="11" text-anchor="middle" font-weight="600">Befehl</text><text x="340" y="200.8" font-size="11" text-anchor="middle">des KI-Agenten</text><circle cx="475" cy="190" r="54" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="475" y="186.7" font-size="12" text-anchor="middle" font-weight="600">Rechte</text><text x="475" y="201.7" font-size="12" text-anchor="middle">des Kontos</text><circle cx="610" cy="190" r="54" fill="#ffffff" stroke="#b8472a" stroke-width="3"/><text x="610" y="186.7" font-size="12" text-anchor="middle" font-weight="600">Ausgang</text><text x="610" y="201.7" font-size="12" text-anchor="middle">nach außen</text><line x1="124.0" y1="190.0" x2="150.0" y2="190.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-prompt-injection-a)"/><line x1="259.0" y1="190.0" x2="285.0" y2="190.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-prompt-injection-a)"/><line x1="394.0" y1="190.0" x2="420.0" y2="190.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-prompt-injection-a)"/><line x1="529.0" y1="190.0" x2="555.0" y2="190.0" stroke="#2f5d8a" stroke-width="2" marker-end="url(#kap09-prompt-injection-a)"/><text x="137" y="268" font-size="11" text-anchor="middle" style="fill:#5b6072">Aufgabe und Daten landen</text><text x="137" y="282" font-size="11" text-anchor="middle" style="fill:#5b6072">im selben Kontext</text><text x="340" y="268" font-size="11" text-anchor="middle" style="fill:#5b6072">läuft mit den</text><text x="340" y="282" font-size="11" text-anchor="middle" style="fill:#5b6072">Rechten des Menschen</text><rect x="412" y="290" width="126" height="50" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="475.0" y="311.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Least Privilege</text><text x="475.0" y="325.9" font-size="11" text-anchor="middle">entfernt den Zugriff</text><line x1="475" y1="289" x2="475" y2="246" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-prompt-injection-h)"/><rect x="547" y="290" width="126" height="50" rx="2" fill="#ffffff" stroke="#b8472a" stroke-width="2"/><text x="610.0" y="311.9" font-size="11" text-anchor="middle" font-weight="600" style="fill:#b8472a">Sandbox</text><text x="610.0" y="325.9" font-size="11" text-anchor="middle">entfernt den Ausgang</text><line x1="610" y1="289" x2="610" y2="246" stroke="#b8472a" stroke-width="2" marker-end="url(#kap09-prompt-injection-h)"/></svg>